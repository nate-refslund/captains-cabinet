# =============================================================
# Officer Capabilities — capability-based hook routing
# =============================================================
# Maps officers to capabilities so hooks route behavior without
# hardcoding officer names. Founders: customize for your officer set.
#
# Format: officer:capability (one per line, # comments ignored)
#
# Available capabilities:
#   deploys_code            — pushes code to production (triggers deploy notifications)
#   validates_deployments   — validates live deployments (receives deploy alerts)
#   reviews_implementations — reviews implementations against specs (receives deploy alerts)
#   logs_captain_decisions  — must log decisions after Captain conversations
#   reviews_specs           — validates product specifications (receives spec alerts)
#   reviews_research        — validates research briefs (receives research alerts)
#   captain_rules_retrieval — receives auto-retrieved patterns/intents on Captain DMs (Spec 042)
#   telegram_bot            — maintains a Telegram bot session (Spec 060 v1.1 — Lead only on Mac)
#   drives_computer         — may invoke cua-driver or GUI control tools (Spec 061 v1.2 — Lead only)
# =============================================================
#
# INSTANCE DATA, not a framework default (germline-4file-prep, 2026-07-15):
# the officer column below (env.officers()'s source, framework/env.py) is
# THIS deployment's roster — a fresh hatch replaces every row here with its
# own officer set, exactly as cabinet/scripts/generate-instance.py's hatch
# instructions already direct ("add each lane CEO's rows"). It is schg-locked
# alongside cabinet/mcp-scope.yml as JUDGED config (germline-lock.sh: "judged
# config, NOT runtime-written"), which is in tension with "Founders:
# customize for your officer set" above for a FRESH hatch — flagged, not
# resolved, in docs/proposals/germline-lockstep-lane-resolver-addendum-2026-07-12.md
# ("egg-side question — not this row") and carried forward in
# docs/proposals/germline-4file-prep-mcp-officer-conf-2026-07-15.md.
# instance/config/roster.yml (deployment-local, gitignored) is the parallel
# roster record — its own header calls THIS file the mirror target ("capability
# rows below mirror it"). framework/tests/test_roster_conf_lockstep.py checks
# the two agree (officer set + capability rows) whenever roster.yml exists;
# it is a no-op on a fresh checkout / CI where roster.yml is absent.
# =============================================================

