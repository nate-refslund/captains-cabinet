# cabinet/mcp-scope.yml
# Per-agent MCP scope. Phase 1 CP5 (2026-04-17).
#
# What an agent can REACH determines what it can DO. This file is the
# single source of truth for which MCP servers each agent is allowed to
# call. The pre-tool-use hook enforces it at tool-call time.
#
# Structure is filterable by cabinet_id for Phase 2 (per-Cabinet scope
# overrides). Phase 1 has one cabinet (default 'main') so the top-level
# cabinet key is informational. When Phase 2 introduces a second Cabinet,
# add a `cabinet_overrides:` section keyed by cabinet_id.
#
# Scope semantics:
#   - Agents listed under `agents:` are hired and active. Their listed
#     `mcps:` are the only MCP servers pre-tool-use.sh will allow them
#     to call.
#   - Agents listed under `scaffolds:` are scaffolded per CP4 but NOT
#     hired. Their scope is reserved so the hook has a clean entry the
#     moment they activate.
#   - Any MCP call whose server name is not in the acting agent's
#     `mcps:` list is blocked (exit 2) with a clear error citing the
#     scope file.
#
# Add a new MCP: list it here under the relevant agents. The hook
# re-reads on every cache-refresh cycle (same pattern as contexts).
#
# brain (2026-06-10): Nate's screenpipe brain bridge — vault search, person
# intel, commitments, queue_draft outbound gate, reasoning log. Declared in
# instance/config/extensions.yml → rendered to instance/config/extra-mcps.json
# (merged into every officer's .mcp.json at boot). Every hired officer gets
# it (functional roster + portfolio lane CEOs); usage rules are MANDATORY:
# .claude/rules/brain-bridge.md.
#
# INSTANCE DATA, not a framework default (germline-4file-prep, 2026-07-15):
# the `agents:` keys below are THIS deployment's hired roster — a fresh hatch
# replaces the lane-CEO entries with its own (cabinet/scripts/generate-
# instance.py's hatch instructions already direct this: "list each lane CEO
# under agents:"). It is schg-locked alongside cabinet/officer-
# capabilities.conf as JUDGED config, in tension with per-hatch
# customization for a FRESH deployment — flagged, not resolved, in
# docs/proposals/germline-lockstep-lane-resolver-addendum-2026-07-12.md
# ("egg-side question") and carried forward in docs/proposals/germline-
# 4file-prep-mcp-officer-conf-2026-07-15.md. instance/config/roster.yml
# (deployment-local, gitignored) is the parallel roster record — its header
# names this file as the MCP-scope counterpart ("MCP scope lives there, not
# here"). framework/tests/test_roster_conf_lockstep.py checks the agents:
# keys agree with roster.yml's officer set whenever roster.yml exists; a
# no-op on a fresh checkout / CI where roster.yml is absent.

cabinet: main

agents:
  cos:
    mcps: [notion, telegram, brain, exa, brave-search, perplexity, claude-in-chrome, cua, cua-driver]
    rationale: >
      Coordination and briefings. Not code; CoS does not touch Neon or
      Vercel directly — that's CTO/COO. Library for Phase 1 inbox and
      memory lookups; Notion for legacy business brain until migration.
      cua + cua-driver: the drives_computer capability boots the cua/cua-driver
      overlay (start-officer-mac.sh) — the §9 gate must scope both server names
      or every mcp__cua__* / mcp__cua-driver__* call is blocked call-time
      (mcp-config-1, enforcement-reaudit 2026-07-14; Captain-authorized grant).
      (host grant removed 2026-07-07 — dangling: no live .mcp.json layer
      defines a `host` server; the only definition pointed at the extinct
      /opt/founders-cabinet deployment. See
      docs/proposals/germline-amendment-host-grant-removal-2026-07-07.md.)





  # Portfolio roster lane CEOs (preset `portfolio`, hq deployment).
  # Role defs are generated from presets/portfolio/agents/_lane-ceo.md.template
  # into instance/agents/<slug>-ceo.md (instance overlay — the preset agents
  # dir intentionally has no file for them). Scope = the engineering-grade set + brain:
  # a lane CEO owns its lane end-to-end (schema/migrations, deploys-to-gate,
  # backlog, framework records) and is bound by .claude/rules/brain-bridge.md
  # + .claude/rules/courses-of-action.md. telegram stays in-scope for warroom
  # broadcast only — lane CEOs are Telegram-dark (no bot, no Captain DM;
  # attention routes via the Chair's captain-attention queue).
  polads-ceo:
    mcps: [neon, vercel, make, telegram, brain, corridor, monday]
    rationale: >
      Lane CEO — engineering-grade scope for the lane plus
      brain for gather-then-decide and the queue_draft outbound gate.
      Production deploys and external comms remain propose-only (hard
      ceiling) regardless of scope.

  stephie-ceo:
    mcps: [neon, vercel, make, telegram, brain, corridor, monday]
    rationale: >
      Lane CEO — engineering-grade scope for the lane plus
      brain for gather-then-decide and the queue_draft outbound gate.
      Production deploys and external comms remain propose-only (hard
      ceiling) regardless of scope.

  # Comms Officer (portfolio/hq) — owns Nate's Outlook + Teams comms.
  # Telegram-dark: surfaces ONLY through the Chair. Captain-approved (2026-06-24).
  comms-officer:
    mcps: [make, brain, telegram, monday]
    rationale: >
      make: Graph-proxy folder-WRITE edit (3902068) + filing/archiving mailbox
      MOVES through the Make proxy — never a human-bound send. brain:
      gather-then-decide + the queue_draft outbound gate (approve-only). No
      neon/vercel/corridor. External comms + spend + mail-delete stay
      propose-only. telegram = warroom broadcast only; Telegram-dark.

# Scaffolded agents (not hired, scope reserved):
scaffolds:
  operations-officer:
    mcps: [notion, telegram]
    rationale: >
      Back-office vendor management and SOPs. Notion for process docs;
      Library for SOP records. No Neon/Vercel — infra vendors are CTO/COO.

  compliance-officer:
    mcps: [notion, telegram]
    rationale: >
      Regulatory monitoring, policy drafting, compliance register. Notion
      for policy docs; Library for compliance findings. No Neon/Vercel —
      compliance veto authority is expressed via triggers, not direct
      deployment access.

  executive-assistant:
    mcps: [notion, telegram]
    rationale: >
      Captain logistics (scheduling, correspondence, research-on-request).
      Notion for captain-preferences + research results; Library for
      inbox triage. No Linear (EA isn't on product backlog); no Neon /
      Vercel (no production access).

  physical-coach:
    mcps: [telegram]
    rationale: >
      Personal-capacity. Longitudinal tracking of sleep, training, recovery.
      Library writes to personal Spaces only; no Notion (work business-brain
      is not personal domain); no Linear / Neon / Vercel (no product-infra
      access); Phase 2 will add Cabinet MCP calls to Work Cabinet for
      handoffs when Captain crosses capacity contexts mid-conversation.

  mindfulness-coach:
    mcps: [telegram]
    rationale: >
      Personal-capacity. Reflection and emotional-awareness work. Narrowest
      MCP surface by design — Captain DM + Library for personal-capacity
      Spaces. No external data sources without a coaching_consent_log entry.
      Phase 3 never federates personal content.

# MCPs that every hired agent gets by default (convenience shorthand for
# the hook). Inline bracket-list style — the hook's parser reads this
# specific format. See pre-tool-use.sh section 9 (universal-merge).
#
# Germline window 2 (2026-07-07, audit addendum 4a + #3b):
# - `redis-trigger-channel` ADDED — the trigger-delivery plane every officer
#   session must boot (injects cabinet:triggers:<officer>; without it the
#   officer is deaf to wakes). Previously carried as a launcher EXTRA_ALLOW
#   pass-through in start-officer-mac.sh — dropped there in the same change.
# - `cabinet` DESCOPED — the FW-005 federation server is registered in NO
#   config layer (root .mcp.json, .mcp.json.mac-native, extra-mcps.json,
#   instance/agents/*/mcp.json), so the grant was dead policy weight (same
#   class as the removed `host` grant). Re-grant when the server is actually
#   wired; §10's peer-trust policy remains in place for that day.
# - `cabinet-comms` ADDED (comms foundation, feat/telegram-hardening) — the
#   channel-agnostic LLM-native comms surface (send_card/react/poll/pin/
#   open_thread/stream_thinking/send_rich_card/read_feed). Every officer's
#   ONE DOOR to the Captain: routes through framework.attention.gate + the
#   bound ChannelAdapter, so it cannot bypass the charter/quiet-hours/floor.
#   Inert until the server is registered in instance/config/extensions.yml.
universal: [telegram, redis-trigger-channel, cabinet-comms]
