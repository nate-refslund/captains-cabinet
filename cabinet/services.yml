# =============================================================
# cabinet/services.yml — THE fleet manifest (F0.4, promoted 2026-07-02)
# =============================================================
# One manifest describing the live fleet. Daemon/watchdog plists are RENDERED
# from this file by cabinet/scripts/generate-plists.py (into
# cabinet/launchd/generated/, machine-specific, gitignored). Officers are
# rendered by deploy-mac.sh from cabinet/launchd/com.cabinet.officer.template.plist
# with the roster derived from instance/config/roster.yml (F0.2).
#
# SCHEMA (per service):
#   name:     ^[a-z0-9-]+$ (validated before any path use)
#   label:    launchd Label (reverse-DNS)
#   kind:     officer | daemon | watchdog | cron
#             officer = rendered by deploy-mac.sh from the officer template,
#             SKIPPED by the generator. daemon/watchdog/cron all render
#             identically — kind is fleet taxonomy, not a rendering switch.
#             Any OTHER kind is a hard generator ERROR (lane-ops 2026-07-04):
#             the old silent-skip of unknown kinds is exactly how the
#             `kind: cron` retro-trigger row was never rendered, so its
#             hand-made plist shipped without PATH and FATAL'd hourly
#             (launchd's minimal PATH has no /opt/homebrew/bin → no redis-cli).
#   command:  repo-root-relative invocation, executed as
#             /bin/bash -lc "cd $CABINET_ROOT && set -a && source cabinet/.env
#             2>/dev/null && set +a && REDIS_HOST=localhost exec <command>"
#   schedule: keepalive | {interval_s: N} | {calendar: [{hour: H, minute: M}|{minute: M}|{day: D, ...}, ...]}
#             `day` (1-31, launchd Day) makes a calendar entry MONTHLY — added
#             lane-supply 2026-07-05 for the fidelity-f1 row; generate-plists.py
#             renders it and framework/watchdog/registry.py gives monthly rows a
#             33-day freshness floor (the 26h daily default would false-page).
#   env:      optional per-service EnvironmentVariables (NAMES + non-secret values only —
#             secrets stay in cabinet/.env, sourced at runtime, never rendered into plists)
#   disabled: true → the row stays in the manifest as fleet truth but is NOT
#             rendered by the generator and NOT expected loaded by the
#             outcome-watchdog's no-silent-cron floors (a parked or staged
#             service — see draft-lane, mission-supervisor). Default false.
#   sunset:   optional apoptosis metadata (R10-class discipline, added with the
#             Cabinet World rows 2026-07-07): the organ's KILL CRITERIA — when
#             this row should be retired or superseded. Free text for humans +
#             the apoptosis sweep's propose-only cards; ignored by
#             generate-plists.py (never rendered into plists). New scheduled
#             organs SHOULD carry one — an organ that cannot say when it should
#             die is a hoarding candidate.
#   expected: the "fed + watched" floor (principle 7) — what the outcome-watchdog /
#             dead-man asserts; a service without a met floor is DOWN even if green.
#             Since lane-ops 2026-07-04 the outcome-watchdog DERIVES per-service
#             log-freshness floors from this manifest (framework/watchdog/
#             registry.py::_parse_services_manifest) — adding a row here is
#             what puts a service under no-silent-cron coverage.
#   notes:    free text
#
# expected floors are wired progressively: F0.12 heartbeat-watchdog, F0.7
# ledger-liveness, healthchecks.io (F0.13 — live for pipe-watchdog-side checks).
#
# B2+ additions land here as they ship (per Plan B services.yml spec):
#   heartbeat-watchdog (F0.12), memory-worker (B2.12), ledger-liveness (F0.7),
#   probe-github/vercel/sentry/ci (B2.3-6), verifier (B2.7), mission-supervisor
#   (B2.11), gate-runner/flywheel/dreaming/gate-drift-replay/judge-calibration (B5),
#   cmp-lite (B6.4), executor under user cabinet-exec (B4.7).
#
# DELIBERATELY ABSENT — com.cabinet.gate-apply (sovereign amendment 2026-07-05,
# D15): the germline code-apply root daemon ships DARK. Its plist lives at
# cabinet/launchd/com.cabinet.gate-apply.plist but is NOT a service row here,
# is NOT rendered by generate-plists.py, and is NOT loaded by any setup
# script. Arming it is an explicit Captain `sudo launchctl load` AFTER the
# unprivileged sandbox verify harness exists. Do not add a row for it.

services:
  # ── Officers (keepalive; tmux sessions via start-officer-mac.sh; roster-derived) ──
  - name: officer-cos
    label: com.cabinet.officer.cos
    kind: officer
    command: bash cabinet/scripts/start-officer-mac.sh cos
    schedule: keepalive
    expected: "redis heartbeat cabinet:heartbeat:cos (idle≠dead — progress-aware semantics land with F0.12)"
    notes: sole Telegram voice; no self-wake loop by design (woken by DMs/triggers/briefings)
  - name: officer-polads-ceo
    label: com.cabinet.officer.polads-ceo
    kind: officer
    command: bash cabinet/scripts/start-officer-mac.sh polads-ceo
    schedule: keepalive
    expected: "redis heartbeat cabinet:heartbeat:polads-ceo"
  - name: officer-stephie-ceo
    label: com.cabinet.officer.stephie-ceo
    kind: officer
    command: bash cabinet/scripts/start-officer-mac.sh stephie-ceo
    schedule: keepalive
    expected: "redis heartbeat cabinet:heartbeat:stephie-ceo"
  - name: officer-comms-officer
    label: com.cabinet.officer.comms-officer
    kind: officer
    command: bash cabinet/scripts/start-officer-mac.sh comms-officer
    schedule: keepalive
    expected: "redis heartbeat cabinet:heartbeat:comms-officer"

  # ── Captain channel ──────────────────────────────────────────────────────
  - name: cos-inbound
    label: com.cabinet.officer.cos-inbound
    kind: daemon
    command: bash cabinet/scripts/start-inbound-poller.sh cos
    schedule: keepalive
    env:
      CABINET_BINDER_WIRED: "1"   # F0.5 mechanical verdict capture (rollback: remove + redeploy)
      # TI-4 veto wire ARMED (lane-ops 2026-07-04): binder_wire's never:/lift/
      # `veto confirm` verbs now PERSIST to shared/interfaces/captain-vetoes.yml
      # (previously dark — verbs parsed but recorded nothing), which makes
      # run_action_lane's is_vetoed() a real pre-act block. Writes stay gated on
      # captain_verified (this poller relays ONLY CAPTAIN_TELEGRAM_ID messages),
      # so a veto is unforgeable. Rollback: remove this line + redeploy.
      CABINET_VETO_WIRED: "1"
      # CABINET_NEEDS_WIRED: "1"  # DARK by default (sovereign amendment 2026-07-05, §8 step 8):
      #                           # uncomment + redeploy to arm the FI-4 binder needs verbs
      #                           # (grant/deny/later/snooze NEED-<hex> + rearm <kind>).
    expected: "offset advances on Captain messages; binder wire records verdicts in-process (F0.5); Captain `never:` persists to captain-vetoes.yml (TI-4, armed 2026-07-04)"
    notes: >-
      SOLE getUpdates poller (two pollers on one token 409-conflict). Generated
      plist replaced the invalid-XML hand-made one at the F0.5 deploy
      (2026-07-02); command carries the officer arg (missing in the draft row).

  - name: ledger-liveness
    label: com.cabinet.ledger-liveness
    kind: watchdog
    command: python3.12 cabinet/scripts/ledger-liveness-check.py
    schedule: { interval_s: 3600 }
    expected: "healthchecks 'ledger-liveness' pinged hourly; /fail on evidence starvation (pending proposals + live poller + zero decisions in 24h)"
    notes: >-
      F0.7 dead-man skeleton: evidence starvation must page — staleness is loss
      of proof. Auto-demote wiring joins when graduation goes live (B2.9+).
  - name: retro-trigger
    label: com.cabinet.retro-trigger
    kind: cron
    command: bash cabinet/cron/retro-trigger.sh
    schedule: { interval_s: 3600 }
    expected: "fires cross-officer RETRO+EVOLUTION trigger to cos when due (5 reflections or 48h floor); otherwise logs 'No retro yet'"
    notes: >-
      HIGH-8 (2026-07-03): was unscheduled anywhere — the reflection→retro→
      evolution chain had no clock. Stamp key standardized to
      cabinet:schedule:last-run:cos:cross-officer-retro (cos:retro was never
      written by anything); first firing bootstraps the stamp convention.
      PATH FATAL fix (lane-ops 2026-07-04): kind cron was silently skipped by
      generate-plists.py, so the hand-made plist had no PATH and redis-cli was
      unfindable under launchd (FATAL hourly since ~Jul 3). The generator now
      renders cron rows; cabinet/launchd/com.cabinet.retro-trigger.plist is
      regenerated WITH PATH — Nate reloads it (no launchctl from lanes).
  - name: action-lane
    label: com.cabinet.action-lane
    kind: daemon
    command: python3.12 framework/acting/run_action_lane.py
    schedule: { interval_s: 1800 }
    expected: "≤2 action cards/run, ≤5/day (Redis budget) to Captain Telegram; approve executes via action_exec (Monday/Reminders); log every 30min"
    notes: >-
      The 2026-07-03 Captain-ruled pivot of the draft lane (parked): proactive
      ACTION proposals from captured commitments/meetings/decisions through the
      SAME binder gate. Propose-only; verdicts feed the live graduation engine.
      Pure core (action_lane.py) is retrodiction-ready for the sim harness.
  - name: frontdoor-briefing
    label: com.cabinet.frontdoor-briefing
    kind: daemon
    command: bash cabinet/scripts/run-frontdoor-briefing.sh
    schedule:
      calendar:
        - { hour: 7, minute: 30 }
        - { hour: 19, minute: 30 }
    expected: "2 delivered briefings/day (outcome-watchdog expectation: DELIVERED, not exited-0)"
  - name: intake-surface
    label: com.cabinet.intake-surface
    kind: daemon
    command: python3.12 -m framework.frontdoor.surface
    schedule: { interval_s: 300 }
    env: { CABINET_ENV: runtime }
    expected: "ping-now items surface <10min; queue drains (XLEN not monotonically growing)"

  # ── Acting ───────────────────────────────────────────────────────────────
  - name: draft-lane
    label: com.cabinet.draft-lane
    kind: daemon
    disabled: true
    command: bash cabinet/scripts/run-draft-lane.sh
    schedule: { interval_s: 300 }
    expected: "(parked — nothing asserted while disabled)"
    notes: >-
      PARKED 2026-07-04 (lane-ops), superseded by the Captain's act-not-draft
      ruling (2026-07-03: Nate owns ALL outbound comms; inbound becomes ACTION
      proposals via the action-lane, not reply drafts). The LaunchAgents copy
      is already sitting as com.cabinet.draft-lane.plist.disabled; this row is
      the manifest-side park so the generator stops rendering it and the
      watchdog stops expecting it. Cadence history: Captain Q10 2026-07-02
      ruled 300s (docs previously claimed 2h). Re-enable = delete `disabled:`
      + regenerate + Captain re-ruling.

  - name: mission-supervisor
    label: com.cabinet.mission-supervisor
    kind: daemon
    disabled: true
    command: bash cabinet/cron/mission-supervisor.sh
    schedule: { interval_s: 300 }
    expected: "(staged — nothing asserted while disabled)"
    notes: >-
      STAGED DISABLED (lane-ops 2026-07-04): pull-only ratified 2026-07-04;
      enable only if pull proves insufficient. The push-router half of the
      work graph (framework/missions/supervisor.py routes ready tasks to
      officers as Redis triggers every 5min). Officers currently PULL ready
      work; flipping this on is a Captain call, not an ops default. The
      cabinet-route-tasks skill remains the manual trigger meanwhile.

  # ── Watchdogs / supervision ──────────────────────────────────────────────
  - name: outcome-watchdog
    label: com.cabinet.outcome-watchdog
    kind: watchdog
    command: bash cabinet/scripts/run-outcome-watchdog.sh
    schedule:
      calendar:
        - { minute: 0 }
        - { minute: 30 }
    expected: "heartbeat key cabinet:watchdog:outcome:heartbeat fresh <75min (externally asserted by the screenpipe pipe-watchdog dead-man + healthchecks.io outcome-watchdog-alive)"
  - name: limit-reset-watchdog
    label: com.cabinet.limit-reset-watchdog
    kind: watchdog
    command: bash cabinet/cron/limit-reset-watchdog.sh
    schedule: { interval_s: 180 }
    expected: "log writes every cycle; wakes (never restarts) limit-blocked officers at reset"
    notes: >-
      Installed plist is invalid XML for strict parsers ('--daemon' in a
      comment) — replaced by this generated one at next deploy.
      Tick heartbeat added 2026-07-04 (adversarial review): the script used to
      log only on EVENTS, so the manifest-derived 2h freshness floor false-
      paged on healthy quiet stretches (5.7h observed) — every completed tick
      now writes one stdout line, making the "log writes every cycle" floor
      claim above actually true.
  - name: officer-supervisor-mac
    label: com.cabinet.officer-supervisor-mac
    kind: watchdog
    command: bash cabinet/scripts/officer-supervisor-mac.sh
    schedule: { interval_s: 7200 }
    expected: "re-arms /loop on lane officers; log every 2h"
  - name: status-sweep
    label: com.cabinet.status-sweep
    kind: daemon
    command: bash cabinet/scripts/run-status-sweep.sh
    schedule: { interval_s: 1800 }
    expected: "trigger XADD to cos every 30min"
    notes: self-labeled TEMPORARY backstop pending always-on Mini

  # ── Surfaces ─────────────────────────────────────────────────────────────
  - name: dashboard
    label: com.cabinet.dashboard
    kind: daemon
    command: bash cabinet/scripts/start-dashboard.sh
    schedule: keepalive
    expected: "HTTP 200 on :3100/api/health"

  # ── F0.13 weekly drill + B2.12 memory worker (added 2026-07-03) ─────────────
  - name: healthchecks-drill
    label: com.cabinet.healthchecks-drill
    kind: watchdog
    command: /opt/homebrew/bin/python3.12 cabinet/scripts/healthchecks-drill.py
    schedule: { calendar: [{weekday: 0, hour: 9, minute: 0}] }   # Sundays 09:00 local
    expected: "drill-failed healthcheck pinged normally weekly (goes late ~9d if the drill dies; /fail = immediate alert)"
    notes: fires the external dead-man end-to-end (fail -> alert -> REAL kickstart recovery -> up); clears F0.10 debt (a) permanently
  - name: memory-worker
    label: com.cabinet.memory-worker
    kind: daemon
    command: bash cabinet/scripts/memory-worker.sh
    schedule: keepalive
    expected: "cabinet:memory:embed_queue XLEN not monotonically growing; rows landing in Neon cabinet_memory"
    notes: >-
      B2.12 — long-runner (script's own doc: run as a long-lived process; loop
      mode XREADGROUP BLOCK 5000). Was NEVER scheduled anywhere: 497 entries
      rotted in the queue while five hooks kept feeding it (blueprint 1.e).
      Needs NEON_CONNECTION_STRING + VOYAGE_API_KEY from cabinet/.env (sourced
      by the wrapper) and psql on PATH. Self-heal hardening (lane-ops
      2026-07-04): NOGROUP → re-create the consumer group; XAUTOCLAIM output
      is now actually processed (was piped to /dev/null, so reclaimed messages
      churned invisibly forever); empty loop sleeps 5s (no busy-spin when
      redis-cli fails fast).

  # ── Flip agents (checkpoint 2026-07-04 conditions 5+12) ───────────────────
  # Rows added by lane-ops 2026-07-04 so the fleet manifest is the ONE truth
  # and the outcome-watchdog derives their no-silent-cron floors. Their
  # INSTALL SOURCE stays the hand-made, comment-rich plists in cabinet/launchd/
  # (see cabinet/launchd/INSTALL-flip.md — loading is a deliberate human step);
  # the generated renders exist for --check parity, not for installation.
  - name: undo-sweep
    label: com.cabinet.undo-sweep
    kind: watchdog
    command: bash cabinet/scripts/run-undo-sweep.sh
    schedule: { interval_s: 3600 }
    expected: "hourly UNDO-3 sweep log; past-TTL acted rows get ttl_ok/silent_revert consequence labels; skips (never mints false ttl_ok) on Monday outage"
    notes: runner sets its own PYTHONPATH + sources ~/.screenpipe/pipes/_shared/.env (no secrets in plist)
  - name: actfirst-canary
    label: com.cabinet.actfirst-canary
    kind: watchdog
    command: bash cabinet/scripts/run-actfirst-canary.sh
    schedule: { calendar: [{weekday: 1, hour: 7, minute: 15}] }   # Mondays 07:15 local
    expected: "weekly TI-7 journal-only create→verify→reverse canary per act-first kind; any failure freezes the kind (PAGE lines in log)"
    notes: runner sets its own PYTHONPATH + sources ~/.screenpipe/pipes/_shared/.env (no secrets in plist)
  - name: falsifier-daily
    label: com.cabinet.falsifier-daily
    kind: watchdog
    command: python3.12 cabinet/scripts/falsifier-report.py
    schedule: { calendar: [{hour: 8, minute: 5}] }   # daily 08:05 local
    expected: "one JSON line/day appended to shared/interfaces/falsifier-series.jsonl (idempotent per date) — Day-14/30/Quarter falsifiers measurable; since 2026-07-07 each line also carries memory_ingestion per-source_type liveness + recall_drops + session_insert_failures, and stale WIRED capture classes print ALERT lines into the job log"
    notes: >-
      Read-only end to end (ledger files + local Redis GET + ONE constant
      SELECT over cabinet_memory for ingestion liveness — connection string
      from NEON_CONNECTION_STRING else cabinet/.env, value never logged).
      Redis-unreachable degrades to ledger-only counts; psql/conn-string
      unavailable degrades memory_ingestion to null + an UNMEASURABLE alert,
      never a crash.

  # ── Durability (lane-ops 2026-07-04) ───────────────────────────────────────
  - name: backup
    label: com.cabinet.backup
    kind: daemon
    command: bash cabinet/scripts/backup.sh --retention-days 14
    schedule: { calendar: [{hour: 3, minute: 0}] }   # daily 03:00 local; sleep-missed slots coalesce on wake
    expected: "a dated snapshot dir lands in ~/Cabinet-Backups daily (filesystem state + redis dump.rdb); restore-drill (cabinet/scripts/restore-drill.sh) passes when run"
    notes: >-
      Closes the CRIT-4 finding (19.7GB of runtime state with zero backups).
      LOCAL destination ~/Cabinet-Backups, 14-day retention, pruned by the
      script itself. Verify restorability with cabinet/scripts/restore-drill.sh
      (temp-dir only, never touches live state).
      NATE-DECISION (off-machine copy, deliberately NOT wired): recommend
      rsync of ~/Cabinet-Backups to the UpCloud CPH box over Tailscale
      (8CPU/16GB node already on the tailnet) — an on-machine backup does not
      survive disk loss/theft. Say the word and ops wires a post-backup rsync.
      NATE-DECISION (Redis AOF, deliberately NOT flipped): BGSAVE gives
      point-in-time snapshots only; cabinet/scripts/enable-redis-aof.sh exists
      and flips appendonly+everysec, but it restarts Redis (brief fleet trigger
      outage) so flipping it stays a Captain step.

  # ── Verdict supply (lane-supply 2026-07-05) ────────────────────────────────
  # THE keystone wave: the 2026-07-03 re-review found the machine
  # eval/probe/verifier stack "dead at runtime" (no __main__, no manifest row,
  # no plist; CABINET_PROBES_ENABLED only in comments). These rows wake it so
  # verdict_judge/probe-outcome labels flow into the consequence ledger on the
  # SAME (actor, lane, action_type) cells the act-first graduation gate reads —
  # zero Captain attention per label. INSTALL SOURCE stays the hand-made,
  # comment-rich plists in cabinet/launchd/ (INSTALL-flip.md §verdict-supply;
  # loading is a deliberate human step — same posture as the flip agents
  # above); installing a plist IS the enable flip: each carries
  # CABINET_PROBES_ENABLED=1, and the entrypoints are inert without it.
  # probe-ci / probe-support stay import-only (CI workflow names + Resend
  # inbound config not wired yet — schedule them when their config lands).
  - name: verifier
    label: com.cabinet.verifier
    kind: watchdog
    command: bash cabinet/scripts/run-verifier.sh
    schedule: { interval_s: 3600 }
    env: { CABINET_PROBES_ENABLED: "1" }
    expected: "hourly JSON summary line in log; claims from executed act-first cards reconciled to review{source: verdict_judge} supersedes; NO verdict on outcome=unknown (RT#4); human verdicts never overwritten"
    notes: >-
      B2.8 claims↔probes reconciler (framework/probes/run_verifier.py wrapping
      framework/probes/verifier.py). Ledger-only — reads/writes no external
      system, no Redis. Fabrication demotes are structurally unreachable from
      the acted-card claim scope (every acted emit carries outcome=unknown);
      they arm only if claims are ever widened to org_events completion claims
      (a separate, reviewed decision).
  - name: probe-github
    label: com.cabinet.probe-github
    kind: watchdog
    command: bash cabinet/scripts/run-probes.sh github
    schedule: { interval_s: 300 }
    env: { CABINET_PROBES_ENABLED: "1" }
    expected: "healthchecks 'probe-github' pinged 5-min once the check exists; /fail on silent source; trailer-carrying PR outcomes (merged/reverted/held) superseded onto their proposals"
    notes: >-
      B2.3 reference probe. Read-only via gh CLI (own keychain auth; GH_TOKEN
      mapped from GITHUB_PAT only as fallback). Products + local checkouts:
      instance/config/probes.yml — missing checkout/config skips fail-closed.
  - name: probe-vercel
    label: com.cabinet.probe-vercel
    kind: watchdog
    command: bash cabinet/scripts/run-probes.sh vercel
    schedule: { interval_s: 600 }
    env: { CABINET_PROBES_ENABLED: "1" }
    expected: "healthchecks 'probe-vercel' pinged 10-min once the check exists; /fail on silent source; deploy_ready/rolled_back/deploy_error outcomes superseded onto their proposals"
    notes: >-
      B2.4. Read-only Vercel REST, team-scoped (probe_vercel.TEAM_ID —
      truncated-id gotcha). VERCEL_API_KEY from _shared/.env via env (VERCEL_TOKEN
      fallback mapped in run-probes.sh); empty key = probe-wide skip, no verdict.
  - name: probe-sentry
    label: com.cabinet.probe-sentry
    kind: watchdog
    command: bash cabinet/scripts/run-probes.sh sentry
    schedule: { interval_s: 900 }
    env: { CABINET_PROBES_ENABLED: "1" }
    expected: "healthchecks 'probe-sentry' pinged 15-min once the check exists; /fail on silent source; within_budget/regressed outcomes superseded; frozen feed reads unknown, never ok"
    notes: >-
      B2.5. Read-only Sentry API; SENTRY_AUTH_TOKEN via env (empty = skip).
      Cross-cycle per-version last-event map persisted at ~/Library/Application
      Support/cabinet/probe-sentry-seen.json (CABINET_PROBE_STATE_DIR override);
      dry runs never persist (a rehearsal must not advance the feed clock).
  - name: fidelity-f1
    label: com.cabinet.fidelity-f1
    kind: cron
    command: bash cabinet/scripts/run-fidelity-f1.sh
    schedule: { calendar: [{day: 1, hour: 6, minute: 30}] }   # monthly, 1st 06:30 local
    expected: "one monthly batch summary in log; exit nonzero + assert message if the clone stops beating the 0.083 generic-assistant baseline (fidelity-decay canary)"
    notes: >-
      F1 end-to-end fidelity batch (framework/fidelity/run_f1.py via
      cabinet/scripts/run-fidelity-f1.sh; F1_ROLE/F1_CASES env knobs). Monthly:
      the batch is expensive (officer drives + OAuth judge + Voyage) and drift
      is slow — the fast label loop is verifier+probes above. Monthly calendar
      rows get a 33-day watchdog floor (registry.py, lane-supply 2026-07-05).
  - name: regression-corpus
    label: com.cabinet.regression-corpus
    kind: cron
    command: python3.12 cabinet/scripts/build-regression-corpus.py
    schedule: { calendar: [{hour: 4, minute: 30}] }   # daily 04:30 local
    expected: "daily refresh log line; corpus artifact updated from decided cards/verdicts (see the script's own contract when it lands)"
    notes: >-
      Scheduled by lane-supply (single-writer 2026-07-05) at the wave's AGREED
      path; the script itself ships with the regression-corpus lane of this
      same integration wave. If integration lands without it, the plist FATALs
      visibly at 04:30 (missing file) — flip `disabled: true` here + regenerate
      rather than letting it thrash.
  - name: graduation-transitions
    label: com.cabinet.graduation-transitions
    kind: cron
    command: python3.12 cabinet/scripts/emit-graduation-transitions.py
    schedule: { interval_s: 3600 }
    expected: "hourly transition scan log line; cell promote/demote/hold transitions emitted from the consequence ledger the verifier/probes above feed"
    notes: >-
      Scheduled by lane-supply (single-writer 2026-07-05) at the wave's AGREED
      path; the script ships with the graduation lane of this integration wave.
      Downstream of verifier+probes: they supply the verdict rows whose cell
      crossings this emitter surfaces. Same missing-file posture as
      regression-corpus (flip disabled rather than thrash).

  # ── Growth + hygiene organs (armed 2026-07-07) ─────────────────────────────
  # Two organs that existed but were NEVER scheduled: the R8 learning loop
  # (template plist only since 2026-06-09 — the org's growth engine had no
  # clock) and the apoptosis sweep (shipped 4bcb79e7 with scheduling
  # deliberately deferred to this wave). INSTALL SOURCE is the hand-kept
  # templates in cabinet/launchd/ instantiated via
  # envsubst '$REPO_ROOT $HOME $USER' into ~/Library/LaunchAgents (loading is
  # a deliberate human step — same posture as the flip agents above). NOT
  # armed here: judge-calibration and the rest of the future-B5 verdict-fuel
  # set — they stay in the B2+ comment block until their wave ships them.
  - name: self-improvement-loop
    label: com.cabinet.self-improvement-loop
    kind: cron
    command: bash cabinet/cron/self-improvement-loop.sh
    schedule: { interval_s: 21600 }   # every 6h
    env: { REPORT_ONLY: "1" }   # report-only until first weekly review — flip to 0 to arm auto-apply
    expected: "REPORT-ONLY soak (audit-ratified 2026-07-07): every 6h the log shows the loop summary PLUS a 'REPORT-ONLY' block and one grep-able REPORT_ONLY_SUMMARY JSON line (would-apply proposal ids + validation results); self_improvement_loop_started/completed events carry report_only: true and a would_apply payload; ZERO mutations — no adapt_role, no proposal YAMLs, no drafts in memory/skills/evolved/. Validation still RUNS: a RED evaluated gate stays LOUD (exit 3 + FATAL stderr marker → watchdog pages, review fix 2026-07-07) and the golden shells are Mac-native + self-isolating (ephemeral redis, private cache/hook copies — zero live-state writes). Once REPORT_ONLY is flipped to \"0\" (re-render + reload required): auto-apply ONLY through the validation gate — skeleton TODO proposals stay pending_captain_approval on disk; skill induction writes drafts to memory/skills/evolved/, never auto-validates."
    notes: >-
      R8 growth engine (framework.learning.self_improvement_loop) — the
      eval→pattern→proposal→gate→apply chain, never scheduled since it
      shipped (role-evals-weekly.sh invokes it inline but that cron was never
      armed either). Every run emits a unique loop_id and proposal
      application is idempotent, so overlap with an eval-bound invocation is
      safe (template comment). Interpreter pinned in the script via
      CABINET_PYTHON (default /opt/homebrew/bin/python3.12): bare python3
      under launchd is the 3.9 system Python; the framework targets 3.12.
      REPORT_ONLY wiring (2026-07-07, hardened by the same-day review fix):
      the wrapper maps env REPORT_ONLY onto the driver's --report-only flag
      — propose + validate run for real, every apply/promote/graduate is
      withheld, and the completion event records what WOULD have applied.
      REPORT-ONLY IS THE WRAPPER DEFAULT: an UNSET env runs --report-only,
      so role-evals-weekly.sh's inline call and manual runs are soak-safe
      with no export; ONLY an explicit REPORT_ONLY=0 (or false/no/off)
      arms apply-mode — flip this row's env to "0" (and set it wherever
      the weekly chain runs) to arm. INSTALL SOURCE for this
      row moved 2026-07-07 from the hand-kept envsubst template to the
      generated plist (cabinet/scripts/generate-plists.py → generated/ →
      cp to ~/Library/LaunchAgents + bootstrap), so the row's env here IS
      what launchd runs; logs follow the generated convention
      (~/Library/Logs/cabinet/self-improvement-loop.log + .err — the old
      template wrote .out.log/.err.log). Runbook:
      cabinet/runbooks/org-memory-day1.md §self-improvement.
