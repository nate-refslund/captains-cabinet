  # ── Durability (lane-ops 2026-07-04) ───────────────────────────────────────
  - name: backup
    label: com.cabinet.backup
    kind: daemon
    command: bash cabinet/scripts/backup.sh --retention-days 14
    schedule: { calendar: [{hour: 3, minute: 0}] }   # daily 03:00 local; sleep-missed slots coalesce on wake
    expected: "a checksum-verified dated snapshot lands in ~/Cabinet-Backups daily (topology-preserved filesystem state + configured Postgres + fresh verified Redis RDB or AOF-converted RDB fallback); exact Redis logical-state v3 and restore-drill pass"
    notes: >-
      Closes the CRIT-4 finding (19.7GB of runtime state with zero backups).
      LOCAL destination ~/Cabinet-Backups, 14-day retention, pruned by the
      script itself. Verify restorability with cabinet/scripts/restore-drill.sh
      (temp-dir only, never touches live state).
      CAPTAIN-DECISION (off-machine copy, deliberately NOT wired): recommend
      rsync of ~/Cabinet-Backups to the UpCloud CPH box over Tailscale
      (8CPU/16GB node already on the tailnet) — an on-machine backup does not
      survive disk loss/theft. Say the word and ops wires a post-backup rsync.
      Redis AOF remains the live durability layer. The backup prefers a bounded
      fresh RDB; if BGSAVE is stuck and AOF is healthy, it pauses writes and
      waits for a bounded global AOF drain (buffer length 0, pending bio fsync
      0, last write OK, no rewrite) before copying the complete multipart set.
      This is a drain condition, not a claim of global fsync. The fallback is
      replayed in a disposable Redis, known Streams operational omissions are
      repaired from an identifier-only manifest, and exact v3 state is proved.
      It is then converted to RDB, re-proved in a second disposable Redis, and
      published as an RDB with aof-converted provenance. Both paths use the same
      type-aware SHA-256 logical-state v3 proof: durable state is exact;
      expiring keys may disappear only after their recorded absolute deadline;
      unsupported value types fail closed. That exact v3 logical-state proof,
      not the drain, is the authoritative completeness gate. The blocking logical fingerprint
      has a 55-second internal deadline inside the 60-second write pause and
      aborts rather than publishing if the keyspace outgrows that budget.
      Legacy v2 snapshots retain their
      strict DUMP-based comparison and request a fresh v3 snapshot on mismatch.

