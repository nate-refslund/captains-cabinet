      RADAR-OBSERVE (dependency radar, deterministic half — observe ONLY: no
      LLM in this path, nothing auto-acted-on). Nightly sweep of the tracked
      registry cabinet/config/dependency-radar.yml (vendor changelogs,
      release feeds, model-doc pages + the local claude binary/PATH probe):
      curl -m 20 https-only fail-soft fetches (a dead source is ONE WARN
      line, never a failed run), deterministic LINEAR-TIME normalize +
      sha256 (single-pass markup strips — a hostile open-flood inside the
      5MB cap cannot stall the sweep; test-pinned), diff against the runtime
      sidecar ~/.cabinet/state/dependency-radar.json (last_seen NEVER lives
      in the tracked registry). SECURITY LAW: fetched changelog/release text
      is UNTRUSTED — stored provenance-fenced as DATA (json-escaped JSONL
      rows + sha256-keyed fences with an injection screen in the daily
      report), never executed, never shell/SQL-interpolated, never treated
      as instructions; the triage reader must re-apply the same screen
      (docs/runbooks/dependency-radar.md). The claude-code binary/PATH probe
      cards the 2026-07-16 fleet incident class (a CLI update moved the
      binary off the plists' service PATH and officer boots died) BEFORE
      boots fail — its service_path is cross-pinned by test to
      generate-plists.py PATH_ENV so probe and plists can't drift apart —
      and an installed-version bump (stable status) is itself a delta;
      cabinet-doctor #14 mirrors a probe FAIL as DEAD/RED with the remedy
      and a stale sweep (>48h) as WARN/AMBER. TRIAGE SEAM: every delta also
      lands as a component entry in the per-day mirror
      cabinet/logs/platform-radar/delta-<date>.json (gitignored runtime
      path; {date, source, components[]} — the intake contract of the gated
      platform-radar triage lane, whose skill/runner/gating runbook land
      with the radar-triage-gating lane), so the same-morning senses/triage
      chain reads tonight's deltas mechanically, not yesterday's. Slot:
      04:20 rides the quiet pre-dawn org-senses window — after the 04:10
      transcript-digest, CONCURRENT with the 04:20 task-sync-drift
      falsifier by design (launchd fires same-minute calendar siblings
      concurrently; there is no exclusivity contract to lean on, and the
      two share no files or locks — the radar writes ~/.cabinet/* plus the
      platform-radar mirror, the falsifier its own verdict JSONL), ahead
