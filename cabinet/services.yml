    expected: "one summary line/run (rows= proposals= new=); supersession candidates land status=proposed in shared/interfaces/memory-supersession-proposals.jsonl — NEVER applied by this organ (the memory-supersede-apply row consumes them 15 min later)"
    sunset: "retire if cabinet_memory moves off superseded_by versioning"
    notes: >-
      §4.2 belief invalidation, the DETECT half (2026-07-09; consumer row
      memory-supersede-apply added 2026-07-15, per 2026-07-15 Captain
      ratification of memory Wave 3). Deterministic propose-only pass
      (near-duplicate Jaccard>=0.75; contradiction-cue >=0.35 + cue in
      the newer row only), bounded per-source_type buckets, one constant
      read-only SELECT (falsifier psql discipline). ONE command per row:
      the generated-plist wrapper `exec`s the command, so a `&&` chain
