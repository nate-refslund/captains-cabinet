  - name: evidence-signing-broker
    label: com.cabinet.evidence-signing-broker
    kind: daemon
    command: python3.12 -m framework.evidence_signing_broker serve --config /etc/cabinet/evidence-signing-broker.yml
    schedule: keepalive
    disabled: true
    disabled_reason: "staged: evidence-program HP-1 ships dark; the ONLY enable path is the OS-USER-SPLIT deploy ceremony (docs/runbooks/evidence-signing-broker.md — Captain sudo: create the broker service account, relocate the key, install a /Library/LaunchDaemons plist with UserName, load by hand). Explicitly NOT remove-flag+generate-plists: the generator renders same-user LaunchAgents, and a same-user broker is zero isolation — false comfort, not security."
    expected: "keepalive daemon (post-ceremony only): Unix socket live at the configured path (0750 dir / 0660 group socket after the ceremony; 0700/0600 in same-user staging); one JSONL row per request appended to the broker-owned request log (ts/uid/identity/verb/ids/outcome — the independent second record); typed refusals on every non-conforming request; exit 2 + stderr line on missing peer-credential support, bad config, or unusable key"
    sunset: "supersede when a hardware- or OS-keystore-backed signer replaces file-key custody, or if the evidence store itself moves out of officer-writable space — the broker exists to compensate for same-user key custody (HP-1)"
    notes: >-
      Evidence program HP-1 (whole-cabinet evidence design 2026-07-16
      §2.3): out-of-process HMAC key custody for the evidence store.
      Serves sign-event over event-hash-shaped payloads ONLY (the broker
      builds the frozen preimage itself; arbitrary bytes are never MAC'd),
      sign-object for the 'anchor' purpose with an exact payload schema
      (control/purge/watermark minting refused — a strict tightening:
      store birth, configuration and purges become broker-user/ceremony
      operations), and boolean verify verbs that never return a MAC.
      Kernel peer credentials (SO_PEERCRED / LOCAL_PEERCRED,
      feature-detected, REQUIRED — no support means refuse to serve) map
      uids to attested identities fixed at start; per-uid token-bucket
      rate limit; same-(trial,sequence)-different-hash re-requests refused
      loudly (history-rewrite shape) while identical triples stay
      idempotent for crash recovery. The key never crosses the socket and
      its path never appears in responses, logs, or errors. THREAT
      HONESTY: HP-1 raises the forgery bar from same-OS-user to root —
      root can still forge everything including this broker's log; the
      residual is accepted and stated. Recorder-side wiring:
      framework/evidence/signing.py (absent config = local mode =
      byte-identical pre-seam behavior; broker mode is fail-closed, never
      a silent local fallback). The independent verifier still reads the
      store-root key until its own broker seam lands — the deploy ceremony
      is BLOCKED on that follow-up (see the runbook precondition).
