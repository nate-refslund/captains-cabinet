# =============================================================
# cabinet/services.yml — THE fleet manifest (F0.4, promoted 2026-07-02)
# =============================================================
# One manifest describing the live fleet. Daemon/watchdog plists are RENDERED
# from this file by cabinet/scripts/generate-plists.py (into
# cabinet/launchd/generated/, machine-specific, gitignored). Officers are
# rendered by deploy-mac.sh from cabinet/launchd/com.cabinet.officer.template.plist
# with the roster derived from instance/config/roster.yml (F0.2).
#
# SCHEMA (per service):
#   name:     ^[a-z0-9-]+$ (validated before any path use)
#   label:    launchd Label (reverse-DNS)
#   kind:     officer | daemon | watchdog | cron
#             officer = rendered by deploy-mac.sh from the officer template,
#             SKIPPED by the generator. daemon/watchdog/cron all render
#             identically — kind is fleet taxonomy, not a rendering switch.
#             Any OTHER kind is a hard generator ERROR (lane-ops 2026-07-04):
#             the old silent-skip of unknown kinds is exactly how the
#             `kind: cron` retro-trigger row was never rendered, so its
#             hand-made plist shipped without PATH and FATAL'd hourly
#             (launchd's minimal PATH has no /opt/homebrew/bin → no redis-cli).
#   command:  repo-root-relative invocation, executed as
#             /bin/bash -lc "cd $CABINET_ROOT || exit 1; set -a;
#             [ -r cabinet/.env ] && source cabinet/.env 2>/dev/null; set +a;
#             export PATH=$HOME/.local/bin:$PATH; REDIS_HOST=localhost exec <command>"
#             (`;` not `&&` so a missing/malformed cabinet/.env can NOT abort
#             the service before exec — the watchdog/doctor still boot + report; #51)
#   schedule: keepalive | {interval_s: N} | {calendar: [{hour: H, minute: M}|{minute: M}|{day: D, ...}, ...]}
#             `day` (1-31, launchd Day) makes a calendar entry MONTHLY — added
#             lane-supply 2026-07-05 for the fidelity-f1 row; generate-plists.py
#             renders it and framework/watchdog/registry.py gives monthly rows a
#             33-day freshness floor (the 26h daily default would false-page).
#   env:      optional per-service EnvironmentVariables (NAMES + non-secret values only —
#             secrets stay in cabinet/.env, sourced at runtime, never rendered into plists)
#   disabled: true → the row stays in the manifest as fleet truth but is NOT
#             rendered by the generator and NOT expected loaded by the
#             outcome-watchdog's no-silent-cron floors (a parked or staged
#             service — see draft-lane, mission-supervisor). Default false.
#   disabled_reason: REQUIRED alongside `disabled: true` on any row a test pins
#             as must-stay-scheduled (W10 class): a machine-readable statement
#             that the parking is deliberate + documented (re-enable path in
#             the row comment). test_cron_officer_targets accepts documented
#             parking and still fails silent unscheduling.
#   sunset:   optional apoptosis metadata (R10-class discipline, added with the
#             Cabinet World rows 2026-07-07): the organ's KILL CRITERIA — when
#             this row should be retired or superseded. Free text for humans +
#             the apoptosis sweep's propose-only cards; ignored by
#             generate-plists.py (never rendered into plists). New scheduled
#             organs SHOULD carry one — an organ that cannot say when it should
#             die is a hoarding candidate.
#   organs:   COG-4 composed runner rows ONLY (W6-e2 2026-07-24): the EXPLICIT
#             block list of organ-manifest paths this wake vehicle runs — the
#             row→manifest association is DECLARED, never discovered (§9.5).
#             Ignored by generate-plists.py; cabinet/scripts/
#             cog4-organ-runner.py loads exactly these;
#             framework/watchdog/registry.py::_parse_organ_manifests derives
#             ONE freshness floor PER composed organ from each manifest's
#             freshness_needs (§9.2 COUNT+TUPLE floor conservation).
#   expected: the "fed + watched" floor (principle 7) — what the outcome-watchdog /
#             dead-man asserts; a service without a met floor is DOWN even if green.
#             Since lane-ops 2026-07-04 the outcome-watchdog DERIVES per-service
#             log-freshness floors from this manifest (framework/watchdog/
#             registry.py::_parse_services_manifest) — adding a row here is
#             what puts a service under no-silent-cron coverage.
#   notes:    free text
#
# expected floors are wired progressively: F0.12 heartbeat-watchdog, F0.7
# ledger-liveness, healthchecks.io (F0.13 — live for pipe-watchdog-side checks).
#
# B2+ additions land here as they ship (per Plan B services.yml spec):
#   heartbeat-watchdog (F0.12), memory-worker (B2.12), ledger-liveness (F0.7),
#   probe-github/vercel/sentry/ci (B2.3-6), verifier (B2.7), mission-supervisor
#   (B2.11), gate-runner/flywheel/dreaming/gate-drift-replay (B5 — judge-
#   calibration shipped out of this set 2026-07-09; since 2026-07-24 it rides
#   the cog4-organ-runner composed row, COG-4 W6-e2 — manifest under
#   cabinet/config/organs/), cmp-lite (B6.4), executor under user cabinet-exec
#   (B4.7).
#
# DELIBERATELY ABSENT — com.cabinet.gate-apply (sovereign amendment 2026-07-05,
# D15): the germline code-apply root daemon ships DARK. Its plist lives at
# cabinet/launchd/com.cabinet.gate-apply.plist but is NOT a service row here,
# is NOT rendered by generate-plists.py, and is NOT loaded by any setup
# script. Arming it is an explicit Captain `sudo launchctl load` AFTER the
# unprivileged sandbox verify harness exists. Do not add a row for it.

services:
  # ── Officers (keepalive; tmux sessions via start-officer-mac.sh; roster-derived) ──
  # Product/captain-agnostic foundation (2026-07-14): officer rows are no
  # longer hardcoded here — a fresh clone's roster is empty, so there is
  # nothing to list until instance/config/roster.yml (deployment-local,
  # gitignored; roster.yml.example ships the shape) is seeded. Officer
  # identity is DERIVED at read time, the same F0.2 pattern deploy-mac.sh
  # already uses to render officer LaunchAgents:
  #   - cabinet-doctor.sh merges cabinet/scripts/lib_roster.py's
  #     officer_service_rows() alongside the rows below before its per-row
  #     keepalive/tmux-session check, so officer health coverage is
  #     unchanged — just roster-sourced instead of hand-copied YAML.
  #   - framework/watchdog/registry.py needs NO merge: verify_no_silent_
  #     cron_failure's officer-label exclusion already has a broader
  #     `com.cabinet.officer.` label-prefix fallback for officers absent
  #     from this manifest's text (written for "an officer hired after this
  #     manifest was written appears with no row") — zero rows here is
  #     already a covered case, not a gap.
  #   - `python3 cabinet/scripts/generate-services-officers.py [--yaml]`
  #     prints the current roster's rows for human inspection/documentation
  #     only; it never writes back into this tracked file (that would
  #     re-introduce a specific deployment's concrete officer slugs — e.g.
  #     product-lane CEOs — into a framework file that must stay generic).
  # Per-slug `expected:`/`notes:` OVERRIDES (optional 4-space roster.yml
  # fields, ignored by the bash awk parsers elsewhere) restore any hand-
  # authored annotation a specific officer used to carry here; the generic
  # `redis heartbeat cabinet:heartbeat:<slug>` applies when absent.

  # ── Captain channel ──────────────────────────────────────────────────────
  - name: cos-inbound
    label: com.cabinet.officer.cos-inbound
    kind: daemon
    command: bash cabinet/scripts/start-inbound-poller.sh cos
    schedule: keepalive
    env:
      CABINET_BINDER_WIRED: "1"   # F0.5 mechanical verdict capture (rollback: remove + redeploy)
      # TI-4 veto wire ARMED (lane-ops 2026-07-04): binder_wire's never:/lift/
      # `veto confirm` verbs now PERSIST to shared/interfaces/captain-vetoes.yml
      # (previously dark — verbs parsed but recorded nothing), which makes
      # run_action_lane's is_vetoed() a real pre-act block. Writes stay gated on
      # captain_verified (this poller relays ONLY CAPTAIN_TELEGRAM_ID messages),
      # so a veto is unforgeable. Rollback: remove this line + redeploy.
      CABINET_VETO_WIRED: "1"
      # CABINET_NEEDS_WIRED: "1"  # DARK by default (sovereign amendment 2026-07-05, §8 step 8):
      #                           # uncomment + redeploy to arm the FI-4 binder needs verbs
      #                           # (grant/deny/later/snooze NEED-<hex> + rearm <kind>).
      # P3 one-door (review cp3 H1): the binder's edit: re-card runs IN THIS
      # process via action_exec._tg_send -> channel.send, whose allow_sends()
      # gate needs the runtime marker; without it every Captain edit: raises
      # (loud by design — never a silent blackhole). Rollback: remove + redeploy.
      CABINET_ENV: "runtime"
    expected: "offset advances on Captain messages; binder wire records verdicts in-process (F0.5); Captain `never:` persists to captain-vetoes.yml (TI-4, armed 2026-07-04)"
    notes: >-
      SOLE getUpdates poller (two pollers on one token 409-conflict). Generated
      plist replaced the invalid-XML hand-made one at the F0.5 deploy
      (2026-07-02); command carries the officer arg (missing in the draft row).

  - name: ledger-liveness
    label: com.cabinet.ledger-liveness
    kind: watchdog
    command: python3.12 cabinet/scripts/ledger-liveness-check.py
    schedule: { interval_s: 3600 }
    expected: "healthchecks 'ledger-liveness' pinged hourly; /fail on evidence starvation (pending proposals + live poller + zero decisions in 24h)"
    notes: >-
      F0.7 dead-man skeleton: evidence starvation must page — staleness is loss
      of proof. Auto-demote wiring joins when graduation goes live (B2.9+).
  - name: retro-trigger
    label: com.cabinet.retro-trigger
    kind: cron
    command: bash cabinet/cron/retro-trigger.sh
    schedule: { interval_s: 3600 }
    expected: "fires cross-officer RETRO+EVOLUTION trigger to cos when due (5 reflections or 48h floor); otherwise logs 'No retro yet'"
    notes: >-
      HIGH-8 (2026-07-03): was unscheduled anywhere — the reflection→retro→
      evolution chain had no clock. Stamp key standardized to
      cabinet:schedule:last-run:cos:cross-officer-retro (cos:retro was never
      written by anything); first firing bootstraps the stamp convention.
      PATH FATAL fix (lane-ops 2026-07-04): kind cron was silently skipped by
      generate-plists.py, so the hand-made plist had no PATH and redis-cli was
      unfindable under launchd (FATAL hourly since ~Jul 3). The generator now
      renders cron rows; cabinet/launchd/com.cabinet.retro-trigger.plist is
      regenerated WITH PATH — the Captain reloads it (no launchctl from lanes).
  - name: research-sweep
    label: com.cabinet.research-sweep
    kind: cron
    command: bash cabinet/cron/research-sweep.sh
    # RE-ENABLED 2026-07-26 (Captain ruling, arm-the-cabinet batch): the
    # ABSENCE-DISABLE premise ("the Captain is dark") expired — he is back and
    # ruling. The 2026-07-10 parking was class-(b) absence, never a defect.
    # Deploy step: regenerate + rename ~/Library/LaunchAgents/
    # com.cabinet.research-sweep.plist.disabled -> .plist + bootstrap.
    schedule: { calendar: [{hour: 9, minute: 5}, {hour: 15, minute: 5}] }  # twice daily local
    expected: "'Research sweep trigger pushed' log line per run; FATAL lines page via the no-silent-cron floor"
    sunset: "retire if research briefs go unconsumed 60d (backlog-refine reads shared/interfaces/research-briefs/) or a dedicated research seat returns"
    notes: >-
      W10 (2026-07-09): script existed since the 5-officer era but was
      UNSCHEDULED and fired trigger_send cro — a retired seat, so even a
      manual run XADDed into a dead stream. Target now RESEARCH_SWEEP_OFFICER
      (default cos, the Chair); cadence 2x/day, not the header's old 4h —
      the Chair carries other duties.
  - name: backlog-refine
    label: com.cabinet.backlog-refine
    kind: cron
    command: bash cabinet/cron/backlog-refine.sh
    # RE-ENABLED 2026-07-26 (Captain ruling, arm-the-cabinet batch) alongside
    # research-sweep — it reads the briefs that row produces. Deploy step:
    # regenerate + rename ~/Library/LaunchAgents/
    # com.cabinet.backlog-refine.plist.disabled -> .plist + bootstrap.
    schedule: { calendar: [{hour: 8, minute: 35}] }   # daily 08:35 local — after the 07:30 briefing
    expected: "'Backlog refinement trigger pushed' log line per run; FATAL lines page via the no-silent-cron floor"
    sunset: "retire if shared/backlog.md is superseded by the work-graph as the only backlog surface"
    notes: >-
      W10 (2026-07-09): same repair as research-sweep — unscheduled + fired
      trigger_send cpo (retired seat). Target now BACKLOG_REFINE_OFFICER
      (default cos); daily, not the header's old 12h.
  - name: action-lane
    label: com.cabinet.action-lane
    kind: daemon
    command: python3.12 framework/acting/run_action_lane.py
    schedule: { interval_s: 1800 }
    # P3 one-door (review cp3 H2): cards send via channel.send's allow_sends()
    # gate — without the runtime marker every present raises loudly. Kept HERE
    # so a plist regeneration can never wipe the hand-edited plist fix.
    # W7 (2026-07-09): CABINET_GATHER_VIA_SOURCE=1 — the CG-2 seam goes LIVE
    # after shadow-parity green (test_gather_via_source + test_org_decision_
    # recall): gather routes through the bound PersonalSource — commitments
    # rows + leak-scoped content_ts-fenced memory recall reach the proposer,
    # so decisions stop being memory-blind (memory-audit P0). FAIL-CLOSED: a
    # broken/absent source gathers EMPTY, never silently falls back to the
    # vault walk. Revert = delete this one env key.
    env: { CABINET_ENV: runtime, CABINET_GATHER_VIA_SOURCE: "1" }
    expected: "≤2 action cards/run, ≤5/day (Redis budget) to Captain Telegram; approve executes via action_exec (Monday/Reminders); log every 30min; gather runs the source seam (flag ON 2026-07-09), not the raw vault walk"
    notes: >-
      The 2026-07-03 Captain-ruled pivot of the draft lane (parked): proactive
      ACTION proposals from captured commitments/meetings/decisions through the
      SAME binder gate. Propose-only; verdicts feed the live graduation engine.
      Pure core (action_lane.py) is retrodiction-ready for the sim harness.
      Gather flows via the PersonalSource seam (W7 flip): watch the first tick
      after deploy — a persistent "source unavailable — empty gather" log line
      means fix the source binding, not blind-revert the flag.
  - name: frontdoor-briefing
    label: com.cabinet.frontdoor-briefing
    kind: daemon
    command: bash cabinet/scripts/run-frontdoor-briefing.sh
    schedule:
      # SOURCE OF TRUTH: instance/config/platform.yml `briefing_times` —
      # generate-plists.py stamps StartCalendarInterval from that key (fleet
      # default 07:30,19:30); this row is the documented no-config fallback
      # MIRROR and loses on divergence. Keep it in sync — the parity suite
      # (cabinet/scripts/tests/test_briefing_time_parity.py) fails on drift.
      calendar:
        - { hour: 7, minute: 30 }
        - { hour: 19, minute: 30 }
    # C3 (captain-decisions 2026-07-10): admission law ON — the briefing's
    # "Needs you (N)" section calls build_queue() directly, so it carries the
    # same flag as intake-surface (SURFACE-PARITY-LAW: one census, N skins).
    # CAPTAIN-SURFACE-V2 interim (PR #135, 2026-07-10): CABINET_QUEUE_CARD=0 —
    # kill-switch the old jargon-wording pinned queue card until the window-4
    # re-point lands (docs/proposals/germline-window-4-deferral-2026-07-10.md).
    # Revert = delete this one env key.
    # ONE-VOICE-RESET (Captain interview 2026-07-11): briefing-as-card ARMED
    # via instance/config/comms-surface.yml `briefing_card: true` — this run
    # now delivers ONE card (status + "N decisions ready — Triage"); the
    # composed body is archived to instance/memory/briefings/ as data, never
    # sent as a (1/N)-chunked wall. "sent": true in the run output = the CARD
    # delivered (the delivered-marker grep below keys off it). Revert =
    # delete the yml key (classic text path is byte-identical underneath).
    env: { CABINET_ADMISSION_LAW: "1", CABINET_QUEUE_CARD: "0" }
    expected: "2 delivered briefings/day (outcome-watchdog expectation: DELIVERED, not exited-0)"
  - name: intake-surface
    label: com.cabinet.intake-surface
    kind: daemon
    command: python3.12 -m framework.frontdoor.surface
    schedule: { interval_s: 300 }
    # C3 (captain-decisions 2026-07-10): CABINET_ADMISSION_LAW=1 — org-decidable
    # chains route to the org (acted-digest lines w/ undo), only captain-gated
    # chains enter the Decisions room. Observability untouched (feed/digest/
    # chronicle keep everything). Revert = delete this one env key.
    # CAPTAIN-SURFACE-V2 interim (PR #135, 2026-07-10): CABINET_QUEUE_CARD=0 —
    # same kill-switch as frontdoor-briefing (SURFACE-PARITY-LAW: one census).
    env: { CABINET_ENV: runtime, CABINET_ADMISSION_LAW: "1", CABINET_QUEUE_CARD: "0" }
    expected: "ping-now items surface <10min; queue drains (XLEN not monotonically growing)"
  - name: surface-pin
    label: com.cabinet.surface-pin
    kind: cron
    command: bash cabinet/cron/surface-pin-tick.sh
    schedule: { interval_s: 300 }
    # 3-KNOBS RATIFICATION (captain-decisions 2026-07-10 16:30Z): pin =
    # standing OVERVIEW card ("⚑ N need you", edited in place). Was the
    # PIN-ONLY partial arming (`engine --pin-tick`); the PERSONAL-AGENT
    # RESET (Captain interview 2026-07-11) armed the next step of the same
    # order: the wrapper now runs `engine --tick` = pacing (ask-first, cap 5
    # — the ratified knobs in instance/config/comms-surface.yml) + the pin
    # lifecycle. Decisions ride paced single-decision cards; the escalation
    # gate stays DARK (CABINET_ESCALATION_GATE unset). The wrapper sources
    # cabinet/.env and sets CABINET_ENV=runtime + CABINET_ADMISSION_LAW=1
    # (same room as intake-surface). It supersedes the retired
    # CABINET_QUEUE_CARD pinned card (msg 1013 unpinned 2026-07-10).
    # Revert pacing arming = `--tick` → `--pin-tick` in the wrapper.
    expected: "one 'Surface tick ok' line per 300s run; error-reporting ticks exit 1 with a FATAL stderr line (observability floor today = doctor log-freshness on surface-pin.log; FATAL grep is a wanted upgrade)"

  # ── Tasks: due-at reminders (Spec 041, armed 2026-07-16) ───────────────────
  - name: due-at-reminder-tick
    label: com.cabinet.due-at-reminder-tick
    kind: cron
    command: bash cabinet/scripts/due-at-reminder-tick.sh
    schedule: { interval_s: 300 }   # every 5 min — a CADENCE ("fire within ~5 min of due_at"), not a wall-clock slot (a due time can land at any minute)
    expected: "one line per run — `[due-at-reminder-tick] fired=N carded=C snooze_bumped=B fail=M elapsed_at=<iso>` (a heartbeat even on a quiet tick, so the derived 300s freshness floor is honestly met — the limit-reset-watchdog log-only-on-events lesson); each due OFFICER reminder XADDs a task_reminder trigger onto the owning officer's cabinet:triggers:<officer_slug> stream, each due CAPTAIN reminder (type='reminder' or captain-slug owner) files a needs-ledger one-tap card instead, both marked reminder_fired_at in the same claim; the reconcile phase then applies Captain card verdicts (grant closes, later bumps due_at +7d)"
    notes: >-
      Spec 041 (/tasks due_at auto-fire) — schema shipped in cabinet/sql/
      041-tasks-due-at.sql (due_at + reminder_fired_at columns, the
      officer_tasks_due_pending_idx partial index, and the
      officer_tasks_due_at_rearm_trg re-arm trigger that clears
      reminder_fired_at on any due_at change) and this worker shipped, but the
      worker was SCHEDULED NOWHERE — reminders NEVER fired (its header still
      carried a convergence-era /opt crontab suggestion). This row is the
      missing clock. ONE command per row: the generated-plist wrapper `exec`s
      the command, so a `&&` chain would die at the first program (pinned
      fleet-wide by test_no_enabled_service_chains_past_the_exec_wrapper, paid
      2026-07-15) — the atomic SQL claim AND the trigger fan-out live in this
      one script, never a chain. interval_s (not calendar) because due_at is a
      moving target, not a fixed slot; 300s matches the "within ~5 min of due"
      bar and mirrors intake-surface/surface-pin. Conn string:
      NEON_CONNECTION_STRING from cabinet/.env (sourced by the wrapper AND by
      the script for direct runs) — the tasks Neon where officer_tasks lives,
      same DB the dashboard reads; a box with no conn string degrades LOUDLY
      (one stderr line, exit 0), never fabricated cred plumbing. Idempotent by
      construction: the SELECT ... FOR UPDATE SKIP LOCKED claim flips
      reminder_fired_at in the same statement, so a re-run after a fire yields
      zero new triggers; a due_at bump re-arms via the trigger. Task title is
      UNTRUSTED and is query OUTPUT only (never interpolated into SQL, never
      carried on the claim TSV — the claim RETURNING is machine fields only
      and both routes re-read the title by id, so an embedded newline/tab can
      never forge a routing row) — it reaches the officer trigger through a
      jq -cn --arg/--argjson payload and the Captain card via STDIN to
      captain-reminder-arm.py file-card. The same worker is the Captain-arm
      delivery leg (docs/runbooks/captain-reminders.md): captain rows card to
      the needs ledger, and the reconcile phase runs every tick (grant =
      close granted; later = one guarded parameterized due_at bump, the 041
      re-arm trigger refires it). Captain-arm install: the generated plist
      (deploy-mac.sh / cabinet-bootstrap), same step as every other cron row.

  # ── Acting ───────────────────────────────────────────────────────────────
  # draft-lane RETIRED 2026-07-24 (COG-4 W6-e2, foundry §3 L61 evidence-gated:
  # superseded by the Captain's 2026-07-03 act-not-draft ruling; disabled +
  # quiet since 2026-07-04; reader inventory clean — evidence bundle in
  # shared/interfaces/reviews/feat-cog4-w6-e2-cp1.md). Row + the hand-made
  # cabinet/launchd/com.cabinet.draft-lane.plist deleted together; re-enable =
  # revert that commit + Captain re-ruling (framework/acting/run_draft_lane.py
  # itself stays — code compaction is Phase-7 work, not fleet truth).

  - name: mission-supervisor
    label: com.cabinet.mission-supervisor
    kind: daemon
    disabled: true
    disabled_reason: "STAYS PARKED after the 2026-07-26 arm-the-cabinet re-review: this is NOT class-(b) 'nobody got to it'. Arming the push router while officers also PULL double-dispatches the same task, and there is NO claim primitive anywhere in the tree to prevent it (`git grep -n 'def claim\\|claim_task\\|work_item_claimed' framework/ cabinet/` = 0 hits). Wiring one reaches cabinet/scripts/hooks/session-task-inject.sh, which is inside the schg-locked hooks dir — a Captain unlock ceremony, not a small change. Re-enable path: land a claim primitive on the pull path first, then flip."
    command: bash cabinet/cron/mission-supervisor.sh
    schedule: { interval_s: 300 }
    expected: "(staged — nothing asserted while disabled)"
    notes: >-
      STAGED DISABLED (lane-ops 2026-07-04): pull-only ratified 2026-07-04;
      enable only if pull proves insufficient. The push-router half of the
      work graph (framework/missions/supervisor.py routes ready tasks to
      officers as Redis triggers every 5min). Officers currently PULL ready
      work; flipping this on is a Captain call, not an ops default. The
      cabinet-route-tasks skill remains the manual trigger meanwhile.
      SECOND DEFECT found 2026-07-26 and left in place (the row is parked, so
      fixing it here would be unverifiable churn): cabinet/cron/
      mission-supervisor.sh invokes `python3 -m framework.missions.supervisor`
      UNPINNED — under launchd that is the 3.9 system Python, and the framework
      targets 3.12. Pin CABINET_PYTHON/python3.12 as part of any enable.

  # ── Watchdogs / supervision ──────────────────────────────────────────────
  - name: outcome-watchdog
    label: com.cabinet.outcome-watchdog
    kind: watchdog
    command: bash cabinet/scripts/run-outcome-watchdog.sh
    schedule:
      calendar:
        - { minute: 0 }
        - { minute: 30 }
    expected: "heartbeat key cabinet:watchdog:outcome:heartbeat fresh <75min (externally asserted by the screenpipe pipe-watchdog dead-man + healthchecks.io outcome-watchdog-alive)"
  - name: limit-reset-watchdog
    label: com.cabinet.limit-reset-watchdog
    kind: watchdog
    command: bash cabinet/cron/limit-reset-watchdog.sh
    schedule: { interval_s: 180 }
    expected: "log writes every cycle; wakes (never restarts) limit-blocked officers at reset"
    notes: >-
      Installed plist is invalid XML for strict parsers ('--daemon' in a
      comment) — replaced by this generated one at next deploy.
      Tick heartbeat added 2026-07-04 (adversarial review): the script used to
      log only on EVENTS, so the manifest-derived 2h freshness floor false-
      paged on healthy quiet stretches (5.7h observed) — every completed tick
      now writes one stdout line, making the "log writes every cycle" floor
      claim above actually true.
  - name: officer-supervisor-mac
    label: com.cabinet.officer-supervisor-mac
    kind: watchdog
    command: bash cabinet/scripts/officer-supervisor-mac.sh
    schedule: { interval_s: 7200 }
    expected: "re-arms /loop on lane officers; log every 2h"
  - name: status-sweep
    label: com.cabinet.status-sweep
    kind: daemon
    command: bash cabinet/scripts/run-status-sweep.sh
