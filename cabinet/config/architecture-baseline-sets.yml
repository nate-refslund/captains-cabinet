# architecture-baseline-sets.yml — the MEMBER sets the expansion registry
# measures surplus against.
# =============================================================================
# Read by cabinet/scripts/cognitive-architecture-census.py together with
# cabinet/config/cognitive-architecture-contract.yml. The contract pins how MANY
# members each class may hold; this file pins WHICH members were already there.
# The census requires, per class:
#
#     observed - baseline  ==  {row.member for row in contract.expansions}
#
# exactly and disjointly — a bijection, not a presence check. A net-new member
# with no row is RED. A row naming a member that is not observed (the stale
# copy-paste) is RED. A row naming a member that is already in the baseline (the
# laundering edit) is RED. A name in THIS file that the tree does not carry is
# RED. Two rows naming one member are refused outright.
#
# WHY A SNAPSHOT AND NOT A DERIVATION: the census must run in a gitless clean
# hatch (its own docstring), so it cannot ask git what the tree looked like
# before. The baseline is therefore data, hand-maintained, and deliberately
# ships with NO regenerator script: a one-command "refresh the baseline" is
# exactly the laundering path the registry exists to close.
#
# WHAT ACTUALLY BOUNDS A HAND EDIT HERE — stated exactly, because the sentence
# that used to sit on this line was FALSE and was falsified twice by execution
# on 2026-07-27. It claimed the count budgets stopped a hand edit: "every class
# is pinned at observed==max with zero headroom, so adding a member to this file
# WITHOUT raising the matching maximum still REDs the census". Both halves were
# wrong. An ordinary temporary_allowances row is not a maximum raise and worked
# — a net-new production module landed at ok=True with no expansion row, paid
# for with one line here plus one routine allowance row. And a name added here
# for a member that does not exist in the tree moved no count at all, so it red
# NOTHING, and the inventory could be pre-loaded in one commit and consumed in a
# later one. A line here does not move a count; what it does is take a member
# out of the surplus, which is the whole of the bijection. The two real bounds:
#
#   * COUNT: since 2026-07-27 no temporary_allowances row may name a bijection
#     class — it is refused at contract load, with the rows already live pinned
#     by exact (phase, budget, additional) triple in the census source. The
#     count of a bijection class now grows only by raising `maximum` in the
#     contract: visible, permanent, and on the line the zero-headroom law is
#     read from.
#   * PRE-LOADING: a name here with no corresponding tree member is a census
#     failure, so an inventory cannot be written now and consumed later.
#
# WHEN YOU MAY EDIT THIS FILE — the rule, because without one the friction below
# will teach the wrong habit. A pure RENAME or MOVE has ZERO net growth and yet
# reds twice: `unregistered set member` on the new path, and (if the old path was
# a registered expansion) `expansion row names a member that is not present`.
# Measured 2026-07-27: renaming one production module held the count at 246/246
# and produced exactly those two failures. The two green paths are a full
# expansion row — two blind arms and a written adjudication, absurd for a rename
# — or an edit here. The edit is correct, and it is a PAIRED edit made in the
# SAME commit as the tree change: REMOVE the old member and ADD the new one
# together. Never one without the other. If the member carried an expansion row,
# that row's `member` moves with it in the same commit.
#
# And the clause that keeps the paired edit from becoming the D1 bypass, stated
# once and MACHINE-ENFORCED: a line is NEVER added here for a member the tree
# does not ALREADY have. A name here with no tree member is a census failure, so
# an inventory cannot be pre-loaded and consumed later. A rename satisfies this
# by construction — the new path exists at the commit that adds it.
#
# NOT BOUNDED, named rather than relabelled as covered: a line added here in the
# SAME commit as the file it names still removes that file from the surplus, and
# the bijection cannot tell the difference. That path costs a visible `maximum`
# raise and a claim about snapshot_of below that git blame contradicts — it is
# caught by reading the diff, not by the census. Adding to this file is
# therefore never routine. REMOVING a line is always safe: it can only make the
# surplus larger, never smaller, so a stale line after a real deletion is
# corrected by deleting it, and nothing is bought by the correction.
#
# HONEST SCOPE — the members below were NOT adjudicated by this gate. They are
# the tree as it stood when the registry landed; the registry makes no claim
# about anything that predates it. It binds what comes next.
#
# NOT COVERED, and stated so no reader mistakes coverage for completeness:
#   * framework_production_noncomment_lines is a MASS, not a set — growth inside
#     an existing module is invisible here and stays on temporary_allowances.
#   * named_compiler_modules is pinned at 1 with a declared invariant behind it
#     (no_global_database_bus_or_compiler); a second one is already impossible.
#   * layer_debt_entries / layer_allowlist_entries are the shrink-only ratchets
#     owned by cabinet/scripts/check-layer-separation.sh.
#
# ONE FRICTION, so the next author is not surprised by it: this file NAMES every
# framework module, which means a module living under a zero-consumers shadow
# law (evidence_calibration, evidence_detectors, evidence_recompute today) trips
# that law's whole-tree grep the moment it is listed here. The fix is the guard's
# own sanctioned allowlist entry with a why — a member-name row in a data file is
# never an import and never a consumer — added in the SAME landing as the module.
# Never mangle a member id to dodge a grep: that buys a green with the data a
# later reader needs, which is the same trade as reformatting docstrings into
# comments to duck a line counter.
#
# Provenance: the 2026-07-27 two-model expansion-gate adjudication (Fable 5 +
# Opus 5, blind, own clones), per the 2026-07-07 full-autonomy grant.
