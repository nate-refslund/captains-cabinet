# State-persistence policy — the reasoned exemptions to "every gitignored path
# must survive a deploy".
#
# Read cabinet/scripts/state-persistence-preflight.py first. Short version: a
# release is a FRESH `git worktree`, so it holds tracked files and NOTHING else.
# Every gitignored path — the cabinet's accumulated runtime state — survives a
# deploy only if runtime-provision.sh symlinks it into the runtime root's
# shared/ tree. The preflight DERIVES the durable set from .gitignore instead of
# adding a fourth hand-maintained list, and fails on anything it cannot account
# for. This file is where a path is accounted for WITHOUT being carried.
#
# THREE SECTIONS, narrowest first:
#   wildcard_covered — carried, but by one of link_instance_data()'s wildcard
#                      blocks rather than a named list entry. `rule:` must name
#                      a real block; if that block is deleted the preflight
#                      fails instead of silently widening coverage.
#   disposable       — genuinely safe to lose: regenerated from tracked inputs,
#                      stored outside the worktree, or ephemeral by design.
#   known_gap        — DURABLE and NOT carried, because the fix needs a design
#                      decision. Requires an `expires:` date; the preflight
#                      FAILS once it passes, so a deferral cannot rot into a
#                      permanent hole.
#
# EVERY entry needs a `reason:`. An exemption without a written reason is itself
# a failure — three hand-synced lists already drifted precisely because nobody
# had to say why. Write the reason for the person who finds this in a year.

wildcard_covered:
  - path: instance/agents
    rule: agents-ceo-md
    reason: >-
      Lane-CEO role definitions are symlinked per-file by link_instance_data's
      shared/instance/agents/*-ceo.md wildcard block (runtime-provision.sh
      :295-303), so they already survive a deploy.

  - path: .oauth-backup-*.json
    rule: oauth-backup
    reason: >-
      Symlinked per-file from the runtime root by link_instance_data's
      shared/.oauth-backup-*.json wildcard block (runtime-provision.sh :304-309).

  - path: cabinet/.env
    rule: cabinet-env
    reason: >-
      Symlinked unconditionally to <runtime_root>/shared/cabinet.env by the
      secrets block (runtime-provision.sh :284-287); cmd_init creates that file
      empty if absent, so the link never dangles.

  - path: shared/interfaces
    rule: interfaces-md
    reason: >-
      Every *.md under shared/interfaces/ is linked recursively by
      link_instance_data's find block (runtime-provision.sh :310-320), which
      deliberately skips the git-tracked deployment-status.md so it is never
      shadowed. The individually-gitignored *.jsonl/*.yml ledgers beside them
      have their own INSTANCE_PERSISTENT_FILES rows. See the SEEDING CAVEAT at
      the foot of this file — the block is discovery-only.

disposable:
  # ---- build output and language caches ------------------------------------
  - path: node_modules
    reason: >-
      npm dependency tree, reinstalled from the tracked package-lock.json.
  - path: __pycache__
    reason: >-
      Python bytecode cache, rewritten on import; never state.
  - path: "*.pyc"
    reason: >-
      Python bytecode, regenerated on import.
  - path: "*.pyo"
    reason: >-
      Optimized Python bytecode, regenerated on import.
  - path: .DS_Store
    reason: >-
      macOS Finder metadata; carries no cabinet state.
  - path: Thumbs.db
    reason: >-
      Windows Explorer thumbnail cache; carries no cabinet state.
  - path: cabinet/dashboard/.next
    reason: >-
      Next.js build output, regenerated by the dashboard build from tracked
      sources.
  - path: cabinet/dashboard/tsconfig.tsbuildinfo
    reason: >-
      TypeScript incremental-build fingerprint, regenerated by tsc.

  # ---- data that lives OUTSIDE the release worktree -------------------------
  - path: pgdata
    reason: >-
      Docker-managed named volume (cabinet/docker-compose.yml :141-142 declares
      it bare — no driver_opts, no bind path), so the data lives in Docker's own
      volume store, never inside a release worktree. The mac deploy path runs no
      Docker at all (zero docker references in cabinet-deploy.sh /
      runtime-provision.sh); this .gitignore entry is purely defensive.
  - path: redisdata
    reason: >-
      Docker-managed named volume, same as pgdata above
      (cabinet/docker-compose.yml :141-142).
  - path: .claude/memory
    reason: >-
      Claude Code's own auto-memory. No framework reader or writer exists
      anywhere in the tree, and officers run under a CLAUDE_CONFIG_DIR outside
      the repo (start-officer-mac.sh :459-471), so officer memory is not stored
      here.

  # ---- regenerated from tracked inputs on every start/deploy ----------------
  - path: officers
    reason: >-
      Per-officer symlink farm recreated in full by start-officer.sh :307-316 on
      every officer start; the durable part (session transcripts) lives outside
      the tree. Unused on the mac path.
  - path: .claude/agents
    reason: >-
      Agent definitions derived from tracked presets/ + instance/agents/ by
      load-preset.sh :440-583, which re-runs on every officer start
      (start-officer-mac.sh :147). Losing the .gen.sha marker makes the clobber
      guard strictly MORE protective, not less (load-preset.sh :504-511).
  - path: cabinet/launchd/generated
    reason: >-
      Plist render staging dir, rebuilt from tracked cabinet/services.yml by
      deploy-mac.sh :356-362 every deploy; the authoritative plists are COPIED
      to ~/Library/LaunchAgents outside the tree, so a wiped staging dir never
      unloads a running job.
  - path: cabinet/tests/hook-regression/.last-run
    reason: >-
      Per-run harness stdout, mkdir'd and overwritten by run-hook-regression.sh
      :19-21 on every invocation; all 17 harnesses are tracked.
  - path: cabinet/scripts/world-aesthetic/judge/runs
    reason: >-
      Vision-judge run bundles — per-invocation scratch (blinded corpus copies
      plus agent results) rebuilt by `judge_protocol build` from the candidate
      render and the manifest-verified corpus. .gitignore :292 declares them
      ephemeral and the output root is CLI-overridable.

  # ---- ephemeral by design: carrying it across a deploy would be a BUG ------
  - path: .claude/scheduled_tasks.lock
    reason: >-
      Claude Code harness mutex for the /loop scheduled-tasks feature. No repo
      writer, and carrying a lock into a new release slot would leak stale lock
      state into a fresh runtime.
  - path: instance/onboarding/.onboarding-v2.lock
    reason: >-
      Zero-byte fcntl advisory mutex created on demand by
      framework/onboarding/journey.py :257-270. Already excluded by design and
      documented at runtime-provision.sh :214-219; the data it guards
      (instance/onboarding/{v2,formation,purge-receipts}) IS persisted.
  - path: instance/config/estop
    reason: >-
      Emergency-stop filesystem marker — the second E-stop channel, written and
      cleared on the live machine by kill-switch.sh. CARRYING IT WOULD BE A BUG,
      not a fix. The shared reader treats this path's existence in ANY form as
      not-CLEAR, and a symlink specifically as INDETERMINATE ("stop marker
      present but not a regular file", killswitch-read.sh :123), which halts
      every officer's every tool call; measured directly against _ks_marker_verdict
      (absent -> CLEAR, symlink -> INDETERMINATE). A persistence symlink at this
      path would therefore arm the emergency stop permanently, and `deactivate`'s
      `rm -f "$ESTOP_MARKER"` (kill-switch.sh :117) removes the LINK while the
      shared/ copy survives — so the next provision would re-create the halt and
      the normal resume verb could never clear it. No learned state is lost: the
      authoritative channel is the Redis key cabinet:killswitch, the verdict is
      the OR of the two channels, and `activate` does not write this marker at
      all today (declared residual RES-016, declared-residuals-register.md — cited
      by row id, not by line: that register's cites are anchor-resolved as of
      2026-07-28 precisely because line pins rot).
      RESIDUAL, stated rather than hidden: once RES-016 arms the marker, a deploy
      will drop the filesystem channel for the incoming release, so inside that
      window the pre-armed `DEL cabinet:killswitch` loop the second channel
      exists to defeat wins again. The fix for that is a re-arm step at provision
      time driven by the Redis verdict, NEVER a symlink into shared/.

  # ---- materialized links: the CONTENT is persisted or tracked elsewhere ----
  # Both entries are safe from DATA loss but have a live materialization gap;
  # see the KNOWN LIMITATIONS note at the foot of this file.
  - path: cabinet/loop-prompts
    reason: >-
      Materialized copy of the canonical lane prompts at instance/loop-prompts/,
      which IS carried (INSTANCE_PERSISTENT_DIRS). No content is lost; the
      tracked _template.txt and cos.txt fallbacks ship with every release. This
      directory also holds tracked files, so it must never be symlinked whole.
  - path: cabinet/officer-skills
    reason: >-
      Hand-made symlinks to instance/officer-skills/<officer>.txt, whose content
      is git-TRACKED and therefore ships with every release. Nothing is lost.
      The directory carries tracked generic role files, so it must never be
      symlinked whole.
  - path: cabinet/officer-skills/cos.txt
    reason: >-
      Individual symlink to the tracked instance/officer-skills/cos.txt — see
      the cabinet/officer-skills entry above.
  - path: cabinet/officer-skills/comms-officer.txt
    reason: >-
      Individual symlink to the tracked instance/officer-skills/comms-officer.txt
      — see the cabinet/officer-skills entry above.

  # ---- report-only / regenerable projections -------------------------------
  - path: shared/interfaces/evidence-shadow-findings.jsonl
    reason: >-
      Report-only shadow-detector journal. Every line is recomputed from the
      evidence store plus the degradation ledger on each run, and a germline law
      bars anything downstream from consuming it to gate or block. Excluded by
      design and already documented at runtime-provision.sh :240-242.
  - path: cabinet/scripts/world-aesthetic/corpus
    reason: >-
      The corpus ROOT holds only the git-tracked manifest.json, which ships with
      the release and must never be shadowed. The durable frames — the judge's
      accumulated Captain approve/reject rulings — live in corpus/positive,
      corpus/negative and corpus/palette, and ALL THREE are carried in
      INSTANCE_PERSISTENT_DIRS. Superseded corpora are carried too — see the
      corpus-limezu-2026-07-08 entry below.
  - path: cabinet/scripts/world-aesthetic/corpus-limezu-2026-07-08
    reason: >-
      The 2026-07-28 re-fit's SUPERSEDED corpus, same shape and same rule as
      corpus/ above: the ROOT holds only the git-tracked manifest.json, which
      must never be shadowed, and the frames live in positive/ and negative/ —
      BOTH carried in INSTANCE_PERSISTENT_DIRS. They are durable, not
      disposable: the re-fit's whole contract is that every claim made against
      the old corpus stays reproducible, and calibrate.py prove uses this dir
      as its P5 cross-family bite arm, which degrades to NOT RUN if it is lost.
  - path: cabinet/dashboard/public/world-assets
    reason: >-
      LimeZu pack binaries are commercial-licensed and never committed, but the
      PURCHASED packs live outside the repo (world-asset-install.py :79-84
      sources from ~/Downloads/*) and a deploy does not touch them. Most
      manifest rows re-install via world-asset-install.py and every row is
      sha256-verified against the tracked manifest.json. See KNOWN LIMITATIONS
      for the ~414 rows that need a manual, hash-verified re-copy.
  - path: vault/library-archive
    reason: >-
      A pure read-only projection of the library_records/library_spaces tables,
      which were never dropped (ledger LIB-RETIRE-1 kept the schema dormant on
      purpose). Fully regenerated by an idempotent re-run of
      cabinet/scripts/retire-library-export.py.
  - path: product-brain/library-archive
    reason: >-
      Legacy pre-VAULT-1 archive root. product-brain/ no longer exists in the
      tree (git ls-files product-brain/ returns nothing) and
      retire-library-export.py :105-106 only targets it when vault/ is absent,
      which cannot happen on a current checkout.
  - path: founders-cabinet-plan.md
    reason: >-
      Legacy deployment-specific plan doc with zero references anywhere in the
      tree — `git grep founders-cabinet-plan` hits only .gitignore itself. No
      writer, no reader, no consumer.

known_gap:
  - path: cabinet/scripts/world-aesthetic/goldens
    expires: "2026-10-31"
    reason: >-
      DURABLE AND NOT CARRIED. Captain-approved golden frames are LimeZu-derived
      licensed pixels that are never committed; the tracked manifest.json
      preserves only their sha256, so a lost golden makes every future `compare`
      unusable until a new render is produced AND re-approved by the Captain.
      Not fixed here because the PNGs sit at the directory root beside the
      git-tracked manifest.json, so a whole-dir symlink would shadow a tracked
      file — unlike corpus/, there is no subdirectory to carry instead. Needs a
      design call: either a layout change (goldens/frames/) or a new per-file
      wildcard block plus something that actually seeds it.
  - path: bin/Cabinet Companion.app
    expires: "2026-10-31"
    reason: >-
      DURABLE AND NOT CARRIED. The Launch-at-Login item is registered via
      SMAppService at this bundle's ABSOLUTE path, and the app self-locates
      CABINET_ROOT as two directories up from its own bundle
      (cabinet/companion/main.swift :161-172, :1114-1131) — so a deploy both
      strands the login item on a release that prune will delete and pins the
      app to a stale release. Symlinking bin/ whole would move it under
      <runtime_root>/shared, where the two-dirs-up probe finds no
      cabinet/scripts/cabinet-doctor.sh and self-location fails. Needs a design
      call (set CABINET_ROOT for the companion, or point the login item at
      <runtime_root>/current/bin/). Its sibling bin/cabinet-calread IS carried:
      that one is urgent because the macOS Calendar TCC grant is keyed to the
      binary's CDHASH, so losing it costs a Captain re-grant.

# ---------------------------------------------------------------------------
# KNOWN LIMITATIONS — measured 2026-07-25, recorded so they are not rediscovered
# as surprises. None of these are fixed by this policy file; each is reported.
#
# SEEDING CAVEAT — FIXED 2026-07-25, kept here as provenance. It used to read:
#   "Nothing in the repo creates <runtime_root>/shared/shared/interfaces/ ...
#   the wildcard blocks are discovery-only ... so the *.md block AND the ~20
#   shared/interfaces/*.{yml,jsonl} rows may all link nothing." That was true
#   AND it meant this file's `interfaces-md` wildcard row CERTIFIED a path that
#   was being lost — captain-decisions.md and captain-patterns.md, the
#   append-only Captain-law ledgers, were measured lost at exit 0. Every class in
#   link_instance_data now ADOPTS from the outgoing release before it links (see
#   the ADOPTION INVARIANT in runtime-provision.sh), so a wildcard destination
#   seeds itself from whatever the live release actually holds. A `rule:` row
#   here is therefore now a claim about linking AND about seeding.
#
# MATERIALIZATION GAP. No script recreates cabinet/loop-prompts/<role>.txt or
#   cabinet/officer-skills/<officer>.txt after a deploy. No data is lost (both
#   sources are persisted or tracked), but every lane officer silently falls
#   back to the generic tick prompt, and the post-compact skill refresh no-ops.
#   The fix is a materialization step at provision time, not a persistence row.
#
# vault/ ITSELF HAS NO PERSISTENCE ENTRY. Only 4 files under vault/ are tracked,
#   yet framework/env.py describes it as the org's knowledge corpus written by
#   officers via normal file writes. Officer-written vault notes are
#   untracked-and-unlinked. Not in this checker's derived set because vault/ is
#   not gitignored as a whole — a separate unit of work.
#
# WORLD-ASSET RE-INSTALL. ~414 of 2407 manifest rows (Modern Office Revamped,
#   parts of Modern Interiors/Exteriors) have no tracked installer section and
#   no in-pack source path recorded, so re-deriving them is a manual
#   find-and-copy verified against the manifest's sha256.
# ---------------------------------------------------------------------------
