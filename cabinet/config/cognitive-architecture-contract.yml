#     exact (phase, budget, additional) triple in the census source, so a legacy
#     row cannot be edited upward or duplicated either. A bijection class's
#     count therefore grows only by raising its `maximum` above, visibly.
#   * a baseline name with no tree member is RED, so an inventory cannot be
