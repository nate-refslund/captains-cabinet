  # ── SET PINS — the surfaces the mass budgets are BLIND to ──────────────────
  # Expansion-gate adjudication of record, 2026-07-27 (D3), two blind arms.
  # Every budget above this line rglobs framework/ and counts *.py, so
  # cabinet/scripts/** (1294 tracked files, 8.2% add-rate), cabinet/config/**,
  # .claude/** and EVERY non-.py file cost ZERO — a blind spot this contract
  # already recorded in its own words ("the new framework/schemas/
  # cognitive-trajectory.v2.schema.json is JSON so the census — which counts
  # only *.py — adds ZERO modules and ZERO lines for it"), and BOTH live
  # expansion escapes landed inside it.
  #
  # The gate ruled SPLIT: NO line-mass budget in cabinet/scripts — one arm
  # measured that it would false-positive daily, and a detector that fires on
  # every routine change is disabled within a week, which is worse than a
  # miss. What lands instead are SET pins on the classes both arms named
  # independently: a new organ manifest, a new skill, a newly WIRED hook, a new
  # verdict word, a new durable store. Each is DERIVED FROM THE TREE — the
  # in-tree standard (state-persistence-preflight.py derives the durable set
  # from .gitignore "rather than adding a fourth hand-maintained list"; the
  # COG-4 fleet-truth pins re-derive from the tree and never trust a literal).
  # A hand-maintained list is where this program's last three drift bugs came
  # from.
  #
  # MEASURED FIRE RATES, per first-parent landing on master, 30 days to
  # 2026-07-27 (601 landings) with the 7-day steady state (67 landings) beside
  # it. A fire = the landing must bump the maximum here and say why.
  #   organ_manifests                            0/601 = 0.00%   (7d 0.00%)
  #   claude_hook_wirings                        0/601 = 0.00%   (7d 0.00%)
  #   claude_skills                              2/601 = 0.33%   (7d 0.00%)
  #   cabinet_script_verdict_vocabulary_members  6/601 = 1.00%   (7d 2.99%)
  #   framework_verdict_vocabulary_members      14/601 = 2.33%   (7d 2.99%)
  #   durable_store_units                       36/601 = 5.99%   (7d 7.46%)
  # The last row is the loud one and is recorded as such rather than buried:
  # it is the same band as the 8.2% add-rate the same gate REFUSED for
  # cabinet/scripts line mass. It is kept for a stated reason — every one of
  # those 36 fires was a genuinely NEW durable store (captain-dates, the
  # availability dial, the evidence recorder, the foundry archive, the world
  # chronicle …), i.e. true positives at a high rate, not false alarms on
  # routine edits, which is exactly the distinction the cabinet/scripts refusal
  # turned on. If it ever starts firing on non-stores, delete the row rather
  # than widen it.
  #
  # ZERO HEADROOM, like every budget above: observed == maximum, so one unit of
  # growth blocks. Shrink is always green.
  organ_manifests:
    path: cabinet/config/organs
    # EVERY manifest spelling the runtime loads, not just the one in use:
    # framework/organs/registry.py MANIFEST_SUFFIXES = (".yml", ".yaml",
    # ".json") and load_organ_manifests reads each of them out of this
    # directory. A "*.yml"-only pin was DEFEATED by execution 2026-07-27 —
    # a sixth organ named .yaml, declared in cabinet/services.yml, loaded by
    # the registry (6 manifests) and derived a floor in
    # framework/watchdog/registry.py::_parse_organ_manifests (6 entries),
    # while the census still read organ_manifests 5 <= 5. Widening stays a
    # DATA edit; this list tracks MANIFEST_SUFFIXES.
    pattern: ["*.yml", "*.yaml", "*.json"]
    # An organ manifest IS a new scheduled decider — the composed runner reads
    # this directory and derives one freshness floor per organ from it
    # (framework/watchdog/registry.py _parse_organ_manifests). It was
    # un-budgeted: organs are YAML, so they cost the module and line budgets
    # nothing. Missing directory = ERROR, never 0 — and so is a path that
    # exists but is NOT a directory (rglob over a regular file yields nothing,
    # which read zero and passed until 2026-07-27). A contract path that
    # silently reads zero is a disabled sensor.
    maximum: 5
  claude_skills:
    path: .claude/skills
    pattern: SKILL.md
    # A skill is a decision surface every officer reads. Counted by their entry
    # file so the set is derived from the tree, and so a directory of notes
    # without a SKILL.md is not miscounted as a skill.
    maximum: 21
  claude_hook_wirings:
    path: .claude/settings.json
    # The WIRING, not the script on disk, is what makes a hook fire. Two hook
    # FILES were added in the 30-day window and ZERO hook-wiring diffs landed,
    # so this is a near-silent tripwire: it costs nothing until something wires
    # a new always-on decider into every session. Counts hooks.<Event>[].hooks[]
    # entries; a malformed or renamed section is an ERROR, never a smaller
    # count.
    maximum: 27
  framework_verdict_vocabulary_members:
    path: framework
    symbol_pattern: VERDICT
    # The SATELLITE vocabularies. central_event_types and central_action_types
    # are pinned, but the under-ask verdict ("missed", framework/frontdoor/
    # action_lessons.py) landed touching NEITHER — a new word the cabinet can
    # say about the Captain, free. Discovery is by NAME across the production
    # tree, so a vocabulary in a file this contract has never heard of is found
    # on the run it lands; an unreadable or in-place-mutated vocabulary is an
    # ERROR, because otherwise the way to grow one for free is to build it at
    # import time.
    maximum: 70
  cabinet_script_verdict_vocabulary_members:
    path: cabinet/scripts
    symbol_pattern: VERDICT
    # Same pin, pointed at the blind half. This is the ONE budget that reads
    # cabinet/scripts, and deliberately not by mass: it counts words in a
    # decision vocabulary, not lines.
    maximum: 18
  durable_store_units:
    path: .gitignore
    # A new durable store is a new organ of memory. .gitignore already IS the
    # store registry — a release is a fresh git worktree, so every positively
    # ignored path is exactly what the cabinet accumulates at runtime — and the
    # unit is the deepest wildcard-free prefix, the same reduction
    # cabinet/scripts/state-persistence-preflight.py already applies, so
    # memory/logs/*.jsonl and memory/logs/*.log are ONE store. Raw line count
    # was measured (38/39 touching commits) and rejected for the unit set.
    # OVERLAP, stated rather than hidden: the preflight already fails closed on
    # a new unaccounted unit and demands a written reason (proven by execution
    # 2026-07-27 — adding one ignored path made it exit non-zero). It asks
    # whether a store SURVIVES A DEPLOY. This asks whether the org grew another
    # memory at all, which no gate asked before.
    #
    # 96 -> 97 (2026-07-27): instance/onboarding/access-records/ — the per-source
    # record of a completed read (root, ownership class, authority basis, charter
    # and manifest hashes, entry count, every refusal with its class). A true
    # positive of exactly the kind this pin is kept for, and a PERMANENT organ,
    # so it is a maximum bump rather than a temporary_allowances row: an
    # allowance would promise a deletion gate that will never fire. It is the
    # one store that must SURVIVE the purge of the data it describes, so it sits
    # outside instance/onboarding/v2/ and is carried by runtime-provision.sh's
    # INSTANCE_PERSISTENT_DIRS. Content-free by construction (hashes and counts,
    # never excerpts), and the purge redacts its root. Shrink-only resumes here.
    maximum: 97
temporary_allowances:
  - phase: propose-means-propose
    budget: framework_production_noncomment_lines
    additional: 194
    reason: >-
      the propose/gate/unclassified verdict split in the authority gate.
      `main()` exited 2 on ANY non-None result, so `propose_only` ("above your
      bar — ask, and the chain proceeds without this step") and `always_gated`
      ("hard ceiling, no auto path exists") were OPERATIONALLY IDENTICAL: the
      verdict vocabulary was richer than enforcement could express, which is
      why the enforcing flip measured as an undifferentiated 52,659 refusals
      (75.66%) when only 11,570 of them are ceilings. +186 measured 2026-07-27 (151 at first landing, +43 closing an adversarial review)
      with cognitive-architecture-census.py against master f77bcf45 (69315,
      itself exactly at the pinned maximum). The lines are: the GateDecision
      str-subclass carrying a STRUCTURED verdict field (a str subclass because
      ~100 call sites depend on `evaluate_policy` returning `str | None` —
      nothing was weakened to buy the distinction), the propose-need filing
      seam with its measured rate limit, the authority_enforcing() resolver,
      and the needs_enabled() enforcing disjunct that closes the guardian
      no-op. ZERO new modules (framework_production_modules unchanged at 244):
      all of it lives inside the two existing authority modules. Docstrings
      are counted as written — the reason a propose verdict still WITHHOLDS
      the step (its dominant bucket is byte-indistinguishable from
      send-to-group.sh, `gh api -X POST`, and `python3 -c "...smtplib..."`) is
      the single most important thing a later reader must not lose, and
      rewriting it into "#" comments to duck this counter would be buying a
      number with the explanation that stops someone widening it by accident.
      The +43 closes an adversarial pass: a ceiling risk_class the floor's
      `hard_ceiling` omits, mistypes or drops now GATES on the CANONICAL set
      (classifier.CEILING_CLASS_ACTION_TYPES) instead of falling through to
      the propose collapse (it was filing "grant autonomous external_message" onto
      the Captain's deny surface), a future-dated rate-limit marker degrades to
      re-file instead of muting a need forever, the marker path falls back to
      the needs kernel's own root resolver instead of silently disabling the
      limit at ~46ms/call, an undo-plane gap files its OWN reason rather than
      deduping onto a capability request, and GateDecision gained
      __getnewargs__ so copy/pickle round-trip as a plain str always did.
    owner: authority-plane
    sunset: '2027-01-19'
    deletion_gate: >-
      the per-invocation Bash sub-decider lands and the `unclassified` kind
      stops being the dominant verdict, so the split collapses back into the
      matrix rows it was compensating for, or COG-7 compaction brings
      production non-comment lines below the pinned baseline
  - phase: personal-preset-live
    budget: framework_production_modules
    additional: 1
    reason: >-
      framework/sources/local.py — the local-folder PersonalSource. Paid because
      the personal flavor emitted NO instance/config/sources.yml, so a
      deployment declaring autonomy.flavor: personal fail-closed to
      NullPersonalSource (available() False, search() no hits) and the ONE
      preset shaped for an operator who does not run a company shipped inert
      (adjudicated 2026-07-26, two blind arms). NOT merged into either existing
      adapter, and the merge question is answered by grep rather than prose:
      null.py IS the fail-closed default the resolver binds when config is
      absent or damaged — teaching it to read a directory would make the
      FAILURE path read files — and org.py's search() spawns memory.sh, which
      needs NEON_CONNECTION_STRING plus an embedding provider and returns the
      same empty without them, so binding it on a laptop buys nothing. The
      module is bound as DATA through the existing resolver: no framework code
      branches on flavor to select it, and the axis linter stays green.
      Docstrings counted as written — they carry the mtime refusal (a
      fabricated content_ts defeats the leak fence downstream), the realpath
      jail, the caps, and the fact that there is no write side, which is the
      reasoning a later reader needs and would be bought back with a smaller
      number by rewriting it into "#" comments.
    owner: onboarding-plane
    sunset: '2027-01-19'
    deletion_gate: >-
      the connect-explore-structure sweep lands and supersedes single-folder
      recall with a per-source ingest carrying ownership classes (resulting
      order items 2-4 of the 2026-07-26 altitude gate), at which point this
      adapter is folded into it; or COG-7 compaction brings production modules
      below the pinned baseline
  - phase: personal-preset-live
    budget: framework_production_noncomment_lines
    additional: 331
    reason: >-
      the same module. RE-MEASURED on every merge rather than carried from the
      first measurement — master moved four times mid-flight (shell-lexer,
      propose-means-propose, hook-redos and source-ownership-class each moved
      this budget): cognitive-architecture-census.py reads 70434 on master
      d7c66fe2, itself exactly at the pinned maximum, and 70765 on this
      branch. The DELTA is 331 against every base measured (91faed1b 69654 ->
      69985; 6e50570f 69848 -> 70179; 8095ded9 69849 -> 70180; d7c66fe2 70434
      -> 70765), which is the check that the number measures this module and
      not a merge. ZERO other framework files grew:
      the emission is cabinet/scripts/generate-instance.py and the preset
      payload is presets/personal/, both outside this budget's path. What the
      331 buy: a bounded read (file cap, per-file byte cap, extension
      allowlist, hidden dirs skipped), a realpath jail applied to BOTH the walk
      and read_note so a symlink out of the declared root is skipped rather
      than followed, IDF x saturating-TF ranking normalised into the same
      0..1 base_score band OrgSource returns, and content_ts derived from
      frontmatter or filename or left None. Every other Protocol method is an
      explicit honest empty — a notes folder is not a mailbox, a dossier index
      or a deploy log, and the two tri-state probes return None rather than a
      fabricated boolean.
    owner: onboarding-plane
    sunset: '2027-01-19'
    deletion_gate: >-
      same as the module row above — the per-source ingest supersedes this
      adapter, or COG-7 compaction brings production non-comment lines below
      the pinned baseline
  - phase: bash-egress-fail-closed
    budget: framework_production_noncomment_lines
    additional: 186
    reason: >-
      positive-locality proof for Bash commands (classifier._is_provably_local
      + the two capability sets it asks its question of), the derived
      enum-and-class fence on standing-grant rows, and the ONE fenced
      risk-class map replacing queue.py's two verbatim copies. +130 measured
      2026-07-27 with cognitive-architecture-census.py against master 73c516ba
      (69129, itself exactly at the pinned maximum). 130 -> 186 in the same
      landing: an adversarial review defeated the first proof with a generic
      prefix, and all four causes were in the SHARED shell parser, so the fix
      moved there (newline as a statement separator, redirect words never
      becoming the command word, an UNRESOLVED sentinel where the parser cannot
      see the program, and inline VAR=VAL reported instead of skipped). Those
      56 lines also close a PRE-EXISTING bypass of the live-enforcing
      binary_block and destructive_rm gates, which the same two gaps defeated. ZERO new modules — the
      proof lives inside the existing classifier rather than in a new file,
      which is why framework_production_modules is unchanged at 244. Docstrings
      are counted as written: the sets carry their membership RULE and the
      measured parser gaps that justify an allowlist over a blocklist, and
      rewriting that reasoning into "#" comments to duck this counter would be
      buying a number with the explanation a later reader needs.
    owner: authority-plane
    sunset: '2027-01-19'
    deletion_gate: >-
      the containment half of RES-018 lands (sandbox appleevent-send deny with a
      sanctioned-destination allowlist) and the locality proof is reduced to the
      classification it is, or COG-7 compaction brings production non-comment
      lines below the pinned baseline
  - phase: shell-command-word-parser
    budget: framework_production_noncomment_lines
    additional: 199
    reason: >-
      the shell lexer in policy_engine.py rewritten so a token that is not a
      program is never resolved as the command word. MEASURED over 39,797 real
      recorded Bash commands (the PR-233 dry-run corpus, rebuilt read-only):
      347 DISTINCT non-program tokens were reaching the resolver in 10,209
      records; after the fix, 1 token in 1 record. Causes fixed, each pinned by
      an arm that fails against the pre-change parser: `&` was a separator
      inside the redirection `2>&1` (the digit `1` was the command word of
      14,943 records); the double-quote scanner ended a span at a quote nested
      inside `$( )`, desynchronising the rest of the command; `${VAR:-default}`
      was split as a brace group; comments were never stripped; every heredoc
      body was re-parsed as shell even when a `cat`, an interpreter, `read` or
      `git commit -F -` consumed it; `$(( ))` arithmetic, `find -exec {} \;`,
      case patterns and `for` loop variables all became command words. It also
      CLOSES a pre-existing fail-open: 498 real records were classified
      provably-local while invoking redis-cli, gh or launchctl inside `$( )`
      in a double-quoted string, and `echo "$(sendmail -t)"` was provably
      local on master. ZERO new modules (framework_production_modules
      unchanged at 244) and zero new files: the lexer replaced the character
      scanner in place. Docstrings are counted as written — each helper states
      the token it stopped manufacturing and the corpus count behind it, which
      is the evidence a later reader needs to tell a fix from a guess.
    owner: authority-plane
    sunset: '2027-01-19'
    deletion_gate: >-
      the authority matrix grows a local-execution risk class (the PR-233
      dry-run's own recommendation), which removes the reason this parser must
      carry the whole locality question, or COG-7 compaction brings production
  - phase: recipient-exclusion-carve-backs
    budget: framework_production_noncomment_lines
    additional: 140
    reason: >-
      answers the Captain's 2026-07-27 "allowlist or/and denylist?" question.
      The ALLOWLIST already existed and no second one was built: org_domains()
      IS it, the framework ships none of its own, and it fails closed to EMPTY
      so a stranger's cabinet treats every recipient as external. What it could
      not express was an EXCEPTION, and that gap was reachable two ways with no
      code and no config change. (1) ADDRESS: every address at a listed domain
      is internal, so a distribution list or alias that fans out to
      non-employees classified internal_comms — off the always-gated
      external_comms ceiling — and no setting of org_domains can carve one
      address out. (2) SUBDOMAIN: matching was `dom == d or
      dom.endswith("." + d)`, so a bare listed domain claimed its ENTIRE
      subdomain namespace, unboundedly and forever, including subdomains a
      partner operates and subdomains that do not exist yet. FIX — two
      carve-backs on the SAME one declared source, never a second way to BE
      internal: a Captain-owned denylist (instance/config/
      recipient-exclusions.yml, reusing the act-first-surfaces dialect — ruled
      file, empty denylist default, why: per row) and `subdomain_matching`,
      now `strict` by default with the old unbounded rule reachable as
      `inherit` — a config line, not a code change. Both only ever REMOVE from
      the internal set, so the direction-of-travel law the previous landing
      established (the predicate can only move a recipient TOWARD the ceiling,
      never away) survives and is now PROVEN, not asserted: a property arm
      quantifies every expressible policy over the recipient corpus against a
      frozen reimplementation of the pre-change predicate, and a mutant that
      widens the allow side to a dotless suffix match turns it red. Corruption
      is honest, copying the act-first contract: file ABSENT => empty denylist;
      file PRESENT but damaged => EVERY recipient external until repaired.
      +108 measured 2026-07-27 with cognitive-architecture-census.py against
      master 0ab0cc2b (69315, itself exactly at the pinned maximum) -> 69423.
      108 -> 140 in the same landing: an adversarial review DEFEATED the
      fail-closed claim three ways and the fixes are all in the parser. A
      duplicate `denylist:` key is last-wins under yaml.safe_load, so appending
      one empties the exclusion set while every original row still reads intact
      above it — a silent shrink, and the shape a careless append produces; a
      dangling symlink read as ABSENT rather than damaged; and rows that parse
      but can never MATCH (a value carrying an address separator, the
      display-name form pasted out of a mail client, a domain written with a
      leading dot) were accepted, so a Captain's exclusion could read live and
      exclude nothing. Those 32 lines add a SafeLoader subclass refusing
      duplicate keys and aliases (an exclusion list assembled from anchors
      cannot be audited by eye), lexists over exists, a size bound on a file
      parsed at import of a germline module, an inert-row refusal, and a
      case-fold so a caps typo cannot take the whole org to deny-all.
      ZERO new modules (244 unchanged): the resolver joins framework/env.py
      beside org_domains and the predicate stays inside the existing
      classifier. Docstrings are counted as written — they carry the two
      attack shapes, the fail-closed contract, and the one thing this
      mechanism cannot see (a delivery graph: an internal-looking address that
      relays outward is invisible by construction), which is exactly the
      reasoning a later reader needs and would be bought back with a smaller
      number by rewriting it into "#" comments.
    owner: authority-plane
    sunset: '2027-01-19'
    deletion_gate: >-
      the two independent recipient classifiers are unified — framework/
      channels/contract.py's classify_recipient still decides internal-vs-
      external on its own, last-address-wins, from a different config file, and
      is fenced today only by having no importer (the fence arm in
      framework/authority/tests/test_classifier.py) — so folding both onto one
      predicate reclaims this surface; or COG-7 compaction brings production
      non-comment lines below the pinned baseline
  - phase: onboarding-three-entry-modes
    budget: framework_production_noncomment_lines
    additional: 386
    reason: >-
      the three entry modes and the First Window's coverage honesty, both
      inside framework/onboarding/journey.py. ZERO new modules
      (framework_production_modules unchanged at 244) — the entry classifier
      lives in the module that OWNS the entry surface rather than in a new file
      wired back to it, which is the shape this program has twice paid for
      (substrate built ahead of a consumer). WHAT THE LINES BUY, and each is
      pinned by an arm that fails against the pre-change module. (1) ENTRY
      MODES — the welcome card offered exactly one move, "choose a folder", so
      an operator with no folder to grant had NO path at all, and the
      deep-orientation card offered pause/revoke/purge, three ways to stop and
      none to go on. Both were dead ends. entry_plan() classifies what has
      actually been granted into connected / seeded / ungranted and returns a
      non-empty next step in all eight grant combinations, with the residual
      questionnaire (rights, salience, limits, purpose — none of them "what is
      your company") and the derivability table stating, per subject, what a
      sweep may assert with a citation versus what inferring would be
      fabrication. (2) COVERAGE HONESTY — the sweep read files in ALPHABETICAL
      walk order and then told the operator it "did not find a broken
