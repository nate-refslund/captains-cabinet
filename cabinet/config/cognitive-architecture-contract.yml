  durable_store_units:
    path: .gitignore
    # A new durable store is a new organ of memory. .gitignore already IS the
    # store registry — a release is a fresh git worktree, so every positively
    # ignored path is exactly what the cabinet accumulates at runtime — and the
    # unit is the deepest wildcard-free prefix, the same reduction
    # cabinet/scripts/state-persistence-preflight.py already applies, so
    # memory/logs/*.jsonl and memory/logs/*.log are ONE store. Raw line count
    # was measured (38/39 touching commits) and rejected for the unit set.
    # OVERLAP, stated rather than hidden: the preflight already fails closed on
    # a new unaccounted unit and demands a written reason (proven by execution
    # 2026-07-27 — adding one ignored path made it exit non-zero). It asks
    # whether a store SURVIVES A DEPLOY. This asks whether the org grew another
    # memory at all, which no gate asked before.
    #
    # 96 -> 97 (2026-07-27): instance/onboarding/access-records/ — the per-source
    # record of a completed read (root, ownership class, authority basis, charter
    # and manifest hashes, entry count, every refusal with its class). A true
    # positive of exactly the kind this pin is kept for, and a PERMANENT organ,
    # so it is a maximum bump rather than a temporary_allowances row: an
    # allowance would promise a deletion gate that will never fire. It is the
    # one store that must SURVIVE the purge of the data it describes, so it sits
    # outside instance/onboarding/v2/ and is carried by runtime-provision.sh's
    # INSTANCE_PERSISTENT_DIRS. Content-free by construction (hashes and counts,
    # never excerpts), and the purge redacts its root. Shrink-only resumes here.
    maximum: 97
