    merge_refuted: >-
      framework/onboarding/research.py::probe_connectors — the nearest existing
      organ and the obvious fold target: it IS the connector registry and this
      module ranks across exactly those connectors. Refused on three properties
      of that function rather than on preference. Different arity: probe_connectors
      answers a per-source BOOLEAN (did this source answer, and if not why),
      while rank answers a cross-source ORDERING over entity names — folding one
      into the other gives the registry a second output whose shape has nothing
      to do with its first. Different inputs: every probe there is a bounded
      LOCAL FILE READ by explicit design, because "a probe that needed a
      credential would be the first brick of the engine that was refuted", and a
      ranker consuming rows a credentialed sweep may have produced would erase
      the distinction that header exists to hold. Different failure mode:
      probe_connectors is fail-closed per source, while a ranking's failure is a
      CONFIDENT WRONG over an estate it only partly reached, and its defences
      (escape hatch, not-reached line, offer refusing a coverage-less ranking)
      are meaningless inside a boolean contract. Second candidate refused:
      framework/onboarding/estate.py::proposed_lanes derives lanes from ONE
      ratified window's directory markers and never sees a second system, which
      is the only place recurrence exists.
