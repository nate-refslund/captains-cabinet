    tier: T0
    replay: ledger
    base: 850
    codex:
      represents: "Completed work items in org_events — the org's shipped-work mass; E2 tiles these into ratified-outcome sectors (growing toward the Captain)."
      mechanism_path: "cabinet/cache/org-runtime.sqlite3"
      day0: "unplowed ground"
  - id: subagents_lifetime
