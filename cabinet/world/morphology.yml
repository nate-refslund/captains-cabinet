    represents: "Library main wing height — the org's memory row mass"
    source_binding: "jq -r -s 'last | .memory_rows_total' shared/interfaces/world-chronicle.jsonl"
    scope: org-global
    tier: T0
    replay: ledger
    base: 80
    codex:
      represents: "Rows in cabinet_memory summed over source types, read from the daily census keyframe (which lifts them from the falsifier memory_ingestion block — no DB creds in the render path)."
      mechanism_path: "cabinet/scripts/world-census.py"
      day0: "empty shelves, sealed genome case"
  - id: evolved_skills
    represents: "Forge tool wall — one hung tool per evolved skill"
    source_binding: "jq -r -s 'last | .evolved_skills' shared/interfaces/world-chronicle.jsonl"
    scope: org-global
    tier: T0
    replay: ledger
    base: 1
    codex:
      represents: "Files in memory/skills/evolved/ — skills the org grew beyond its shipped genome."
      mechanism_path: "cabinet/scripts/world-census.py"
      day0: "bare wall, pegs drawn"
  - id: consequence_ledger
    represents: "Ledger lectern book thickness — acted/proposed consequence rows"
    source_binding: "jq -r -s 'last | .consequence_ledger_lines' shared/interfaces/world-chronicle.jsonl"
    scope: org-global
    tier: T0
    replay: ledger
    base: 70
    codex:
      represents: "Lines across consequence-events-*.jsonl — the act-with-undo economy's durable record."
      mechanism_path: "cabinet/scripts/world-census.py"
      day0: "blank ledger"
  - id: commits
