# =============================================================================
# morphology.yml v2 — Cabinet World growth morphology (GRAMMAR AS LAW)
# =============================================================================
# world_at(T) = f_v(state_at(T)) — a PURE, VERSIONED function from censused
# state to structure. No LLM anywhere between ledger and pixel (ratified
# 2026-07-07: "the moment rendering can vary independently of state, a glance
# stops being evidence"). NO change to this file auto-merges — every base,
# anchor, and mapping change is a PR the Captain merges, gated by the
# binding-executor validator (cabinet/scripts/world-binding-validator.py:
# read-only allowlisted sandbox, errors/empty output = cannot merge).
#
# BINDINGS read the E0a census keyframe series (shared/interfaces/
# world-chronicle.jsonl via jq -s 'last') or fenced local files directly —
# the census writer already did the estate reads under its own PII fence,
# so the render path holds no DB creds and no Redis (§2 Stage 1).
# NB: leading-dash grep patterns use `-e` (grep eats them as options otherwise).
#
# LOCKED, FOREVER (law: block below): semantic assignments, tier bases,
# district compass anchors (no mirror/rotate), reserved salience palette +
# dual coding, honest-zero renders, rate-routing, the archetype set.
#
# v2 delta (world-alive direction 2026-07-08, Captain ratified "go all in"
# in-session; docs/plans/world-alive-direction-2026-07-08.md §5.2): appends
# the growth entries for the Street (Z1) and Island (Z0) scenes plus two
# Wardroom growth surfaces. The law: block and every v1 entry are
# byte-untouched. Rate-routed TEXTURE-class entries (noticeboard pins,
# street liveliness) are explicitly marked in their codex — volume cannot
# mint capability, ever.
version: 2

law:
  tiering: "tier_i = clamp(floor(log2(S_i / base_i + 1)), 0, 7); bases are cadence-justified per surface, never anchored to flatter today's cabinet; every base/curve change is a PR gated by day-3/30/365 fixture renders (E2)"
  hysteresis: "a tier must hold across 2 consecutive daily keyframes before its 24h construction scaffold completes"
  rate_routing: "any source >1 event/day is FORBIDDEN from creating morphology — textures only (path wear, smoke, sediment); sources <1/week are building-class; volume cannot mint capability, ever"
  district_anchors_fixed:
    note: "fixed polar anchors, never rotated or mirrored — Knowledge is always NE in every cabinet (E2 consumes; listed now as law)"
    anchors: { law: N, manor: N-beyond-law, memory: NE, works: E, fields: SE, harbor: S, signals: SW, residential: W, training: NW }
  layout_fold: "slot k = birth-order rank, total order pinned as (created_at, rowid); positions fix at birth and never move; land radius R = 24 + 6*floor(log10(total_events+1))"
  reserved_salience_palette:
    green: "verified ONLY"
    amber: "blocked/drift ONLY"
    red: "killswitch/frozen/WIP-violation ONLY"
    grey: "unmeasured ONLY"
    purple: "captain-gated ONLY"
    rule: "dual-coded with shape; WCAG-checked in the asset conformance gate; no variant pack can smuggle an alarm hue"
  honest_zeros: "zero renders prominent (dark lighthouse, empty racks) — absence of data must never read as absence of the surface"
  civic_anchor_exception: "N=3 civic anchors max, positions fixed here, each Captain-approved (Post Office placement class, §10.9) — none minted in v1"
  live_overlay: "Redis presence verbs + SSE drive ANIMATION only, never morphology (killswitch lever + officer motion are overlay surfaces, deliberately absent from this file)"

entries:
