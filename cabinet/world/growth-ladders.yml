# =============================================================================
# CABINET WORLD — GROWTH LADDERS v1 (ERA × RUNG two-axis growth, as DATA)
# =============================================================================
# Law family: morphology/show-grammar (world-data class — NEVER germlined).
# Spec of record: docs/plans/world-unified-spec-v2-2026-07-09.md §15.1–15.4
# (Captain addendum 2: balance made structural; calibration BEFORE build).
# Ledger row: WORLD-GROWTH-CALIBRATION (docs/plans/operative-egg-ledger-2026-07-07.yml).
#
# CAPTAIN-TUNABLE CONTRACT (addendum 2 §3 — "possible for me to change so
# everything doesn't have to go through you"):
#   * VALUE edits (weights, caps, thresholds, bases, rungs, vocab, hysteresis)
#     are Captain-editable DIRECTLY in this file. Run
#         python3.12 cabinet/scripts/world-growth-validate.py
#     before committing — it refuses malformed/untruthful configs (every rung
#     must cite a real census/snapshot/ledger metric).
#   * SCHEMA changes (new keys, new modes, new sources) ride the grammar-law
#     PR route (no auto-merge), exactly like morphology/show-grammar.
#   * The renderer HOT-RELOADS this file on mtime change (no restart, no
#     orchestrator in the loop). Preview: `world-preview --maturity <index|date>`
#     (and the `/world?preview=` dev param) lands with WORLD-V1A T1 so value
#     edits can be seen as stills before committing.
#   * Replay any edit against real history first:
#         python3.12 cabinet/scripts/world-growth-backtest.py \
#             --config cabinet/world/growth-ladders.yml --out /tmp/growth-bt
#
# CALIBRATION CHOICE (2026-07-09, THE CALIBRATION GATE — backtest over REAL
# history 2026-05-25 → 2026-07-09: 172k org_events by day, git commit dates,
# outcomes.yml flip dates from git, census keyframes; 3 candidates
# conservative/balanced/eager; full receipts + strips:
# scratchpad world-v1a/calibration-report.md, timelapse-{candidate}.png):
#   WINNER = balanced.
#   * Era transition camp→hamlet fires 2026-06-28 (top contributor:
#     org_events_total) — ON the June work-surge when the officer fleet was
#     hired and event volume 10×'d: a genuinely meaningful real moment.
#     Conservative deferred the same transition to 07-04 (after the surge,
#     40/46 days of tents while 60k events + 4 officers existed — felt-maturity
#     mismatch); eager fired it 06-19, ONE day after real work began (egg
#     outgrown absurdly fast) and ended in town vocabulary (cobble/streetlight)
#     with zero graduations — overstated maturity.
#   * Story: 6/7 weeks show visible growth (the 06-01 week is genuinely dead
#     in the real data); 2 jump-days, each traceable to ONE real moment (the
#     07-02/03 outcomes-flip "first shipping day" cascade; the 07-07/08
#     keyframe-ledger birth + first completed self-improvement loop).
#   * Current-day render = late-hamlet @ 0.359 — matches the ratified "VILLAGE
#     + WORKING QUAY, lighthouse dark" felt maturity (not yet a town; no light).
#   * Structural honesty: with cells_graduated weighted 0.20, the era index
#     without ANY graduation tops out at 0.80 = exactly the beyond_bay
#     threshold — "grown far beyond the bay" is unreachable until real
#     graduations exist, true by construction (torches before streetlights).
#
# SEMANTICS (implemented by cabinet/scripts/world-growth-backtest.py replay
# and the WORLD-V1A renderer):
#   era index  = Σ weight_i · norm_i over the basket;
#                norm: linear = min(v/cap, 1); logN = min(logN(v+1)/logN(cap+1), 1)
#   era        = highest threshold ≤ index, with MANDATORY hysteresis: advance
#                only after `advance_hold_evals` consecutive daily keyframes at
#                or above the next threshold (the ratified 2-keyframe law);
#                demote only below threshold − demote_margin, same hold.
#   rung modes = tier:  clamp(floor(log2(v/base + 1)), 0, len(rungs)−1)
#                count: clamp(v, 0, len(rungs)−1)      (one rung per real thing)
#                flag:  v ≥ at (default 1)             (exactly 2 rungs)
#                per_lane: v1 isle rings from outcomes.yml — retired&inactive =
#                reef_buoy (Captain ruling 2026-07-09), ever-ratified = dock_r0,
#                ≥1 achieved = warehouses_r1 (r2/r3 gated on P3/P5 feeds)
#   hysteresis = a rung must hold `hysteresis_evals` consecutive evals before
#                the VISIBLE rung moves (the 24h crewed scaffold shows the wait)
#   vocab      = ERA selects the sprite family a rung renders with (tent →
#                hut → cottage; torch → lantern → streetlight); RUNG stays the
#                honest magnitude — era never hides a count, only styles it.
#   unmeasured = a metric with no real measurement yet renders its baseline
#                rung with a grey "unmeasured" card — never interpolated.
# =============================================================================
schema: cabinet.world.growth-ladders/v1
version: 1
candidate: balanced
calibrated:
  date: '2026-07-09'
  winner: balanced
  gate: WORLD-GROWTH-CALIBRATION
  report: scratchpad world-v1a/calibration-report.md (session artifact; receipts
    also in this header and the ledger row note)

era:
  names: [camp, hamlet, town, beyond_bay]
  basket:
    org_age_days:      {weight: 0.15, curve: linear, cap: 365, source: org_events_db}
    org_events_total:  {weight: 0.25, curve: log10, cap: 10000000, source: census_keyframe}
    outcomes_achieved: {weight: 0.25, curve: log2, cap: 16, source: outcomes_yml}
    cells_graduated:   {weight: 0.20, curve: log2, cap: 16, source: census_keyframe}
    active_lanes:      {weight: 0.15, curve: linear, cap: 8, source: outcomes_yml}
  thresholds: {camp: 0.0, hamlet: 0.25, town: 0.55, beyond_bay: 0.80}
  hysteresis: {advance_hold_evals: 2, demote_margin: 0.03}

ladders:
