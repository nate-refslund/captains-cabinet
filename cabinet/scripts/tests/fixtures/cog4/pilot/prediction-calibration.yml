# COG-4 S0 pilot organ fixture — the prediction-calibration projection/
# measurement row (contract §9.3 pilot set). Read-only Brier + calibration-bin
# measurement over acted cards vs ground truth. §4.2 shape; PARITY-CLEAN
# (declared members == matrix derivation for the declared action_type, §4.3
# N-d). Sibling of cabinets/ — the §12 N8 token sweep never reaches it.
name: prediction-calibration
version: "1.0.0"
kind: organ
action_types: [investigation_run]
risk_classes: [read_only_dispatch]
undo_contract: none
entrypoints: {}
inputs: [prediction/acted-cards, prediction/ground-truth]
outputs: [prediction/calibration-series]
domain_operations:
  - prediction/brier.measure
  - prediction/bins.append
descriptor:
  action_type: investigation_run
  risk_class: read_only_dispatch
  ceiling: []
  undo_contract: none
permissions: [acted-cards/read, ground-truth/read]
idempotency:
  prediction/brier.measure: "series-date"
  prediction/bins.append: "series-date"
state_ownership: [prediction/calibration-series]
cost_model:
  units_per_wake: 1
starvation_bound:
  max_wakes: 6
freshness_needs:
  max_staleness_seconds: 86400
  expected_output: prediction/calibration-series
trigger_policy:
  mode: periodic
  parameters:
    interval_s: 86400
health_proof:
  probe: "the calibration-series carries today's Brier + bins line"
  expectation: ok
fallback: skip
dependencies:
  organs: []
  capabilities: [acted-cards/read, ground-truth/read]
