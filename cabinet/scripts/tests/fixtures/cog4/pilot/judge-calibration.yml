# COG-4 S0 pilot organ fixture — the judge-calibration projection/measurement
# row (contract §9.3 pilot set). Read-only agreement measurement plus one
# idempotent atomic rewrite of the calibration-status artifact — a reversible
# LOCAL edit, declared per-operation to exercise BOTH legs' organ-block +
# per-operation OVERRIDE merge (leg a _merged_members, leg b _leg_b_declared).
# §4.2 shape; PARITY-CLEAN (declared members == matrix derivation, §4.3 N-d).
# Sibling of cabinets/ — the §12 N8 token sweep never reaches it.
name: judge-calibration
version: "1.0.0"
kind: organ
action_types: [investigation_run, local_edit]
risk_classes: [read_only_dispatch, reversible]
undo_contract: none
entrypoints: {}
inputs: [judge/verdict-pairs]
outputs: [judge/calibration-status]
domain_operations:
  - judge/agreement.measure
  - judge/status.rewrite
descriptor:
  action_type: investigation_run
  risk_class: read_only_dispatch
  ceiling: []
  undo_contract: none
  operations:
    judge/status.rewrite:
      action_type: local_edit
      risk_class: reversible
      undo_contract: "delete_window(86400)"
permissions: [verdict-pairs/read, calibration-status/write]
idempotency:
  judge/agreement.measure: "measure-date"
  judge/status.rewrite: "status-date"
state_ownership: [judge/calibration-status]
cost_model:
  units_per_wake: 1
starvation_bound:
  max_wakes: 6
freshness_needs:
  max_staleness_seconds: 86400
  expected_output: judge/calibration-status
trigger_policy:
  mode: periodic
  parameters:
    interval_s: 86400
health_proof:
  probe: "the calibration-status carries today's agreement measurement"
  expectation: ok
fallback: skip
dependencies:
  organs: []
  capabilities: [verdict-pairs/read]
