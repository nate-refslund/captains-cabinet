# Portfolio-wide default context config.
#
# Unlike the lane files (polads.yml, stephie.yml, ...), this file is NOT a lane
# declaration — it has no slug and starts no warroom/officer routing. It carries
# portfolio-DEFAULT settings that every lane inherits unless its own context
# file overrides them. A lane overrides by declaring the same block in its own
# instance/config/contexts/<lane>.yml.
#
# investigation_sources — the concrete per-situation source inventory that
# instantiates the investigation bar in .claude/rules/courses-of-action.md §1.
# The rule is the durable principle ("assemble every source the situation
# implicates; if you can't, name the gap instead of proposing"); the per-lane
# source list lives HERE so it scales across lanes and presets without editing
# the germline rule. Each key is a situation-type; its value is the sources the
# bar must assemble for that situation. `always` applies to every situation.
investigation_sources:
  # situation-type -> sources the bar must assemble for it.
  message_reply:
    - full_thread_with_to_cc        # every message + complete To/CC audience
    - person_intel                  # brain MCP person-intel, each counterparty
    - open_commitments_both_ways    # owed-by / owed-to the Captain, this person/topic
  technical_change:
    - codebase_pillar               # indexed architecture/commits/deployment/schema
    - task_board_state              # lane backlog + the tracked item touched
  tracked_item:
    - task_board_state
    - open_commitments_both_ways
  # always, every situation (judgment inputs — never quoted outbound,
  # see .claude/rules/brain-bridge.md):
  always:
    - drafting_lessons
    - captain_model
