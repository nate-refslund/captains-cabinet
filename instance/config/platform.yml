# =============================================================
# Founder's Cabinet — Platform Configuration (shared)
# =============================================================
# Settings that stay the same across ALL projects.
# Officer personalities, voice, research tools, embeddings.
# This file is merged with the active project config to produce
# instance/config/product.yml — do not edit product.yml directly.
# =============================================================

# Founder's name — used in voice messages and officer communication
# (public-tree scrub 2026-07-12: personal values live in the deployment's
# untracked overlay / cabinet/.env, never in this tracked file)
captain_name: Captain                 # Default: "Captain" if not set

# Founder's role/title — framework code (e.g. the fidelity decision cell) names
# the Captain's role via framework.env.captain_role(). Default: "the Captain".
captain_role: Head-of-Tech

# Founder's timezone — ALL officer communication uses this timezone.
# Officers display times in this timezone, never UTC or ambiguous abbreviations.
# Uses IANA timezone identifier (e.g., Europe/Berlin, America/New_York, Asia/Tokyo).
# Scripts can resolve: TZ=<this value> date +%H:%M
# If unset, framework.env.captain_timezone() falls back to UTC and says so
# LOUDLY on stderr (quiet-hours + briefing-slot math shifts with this value).
captain_timezone: Europe/Berlin       # CEST/CET — auto-adjusts for DST

# Twice-daily briefing wall-clock slots (Captain-local "HH:MM" — KEEP THE
# QUOTES: an unquoted time whose hour starts 1-9 like 19:30 is YAML sexagesimal
# and loads as an int (1170), while a leading-zero 07:30 stays a string; the
# resolver rescues the ints, but quoting every slot is the documented shape).
# THE one source
# of truth for briefing times (silent-defaults audit C, 2026-07-18):
#   - cabinet/scripts/generate-plists.py stamps the frontdoor-briefing
#     plist's StartCalendarInterval from this key;
#   - the attention gate + comms-surface engine read it as the
#     CABINET_BRIEFING_TIMES default (framework.env.briefing_times());
#   - cabinet/services.yml's calendar row + instance/config/watchdog.yml's
#     briefing: block are MIRRORS — keep them in sync (parity-pinned by
#     cabinet/scripts/tests/test_briefing_time_parity.py).
briefing_times: ["07:30", "19:30"]

# Founder's Telegram chat ID — used by hooks to detect Captain conversations
# Find yours: look at the chat_id field in incoming Telegram messages
# Synthetic placeholder (public-tree scrub 2026-07-12): the real chat id is
# deployment-local and never belongs in this tracked file.
captain_telegram_chat_id: "0000000000"

# =============================================================
# Org identity — internal email domains + Monday board ids
# =============================================================
# Instance-specific identifiers the universal-base framework reads via
# framework.env resolvers (they are NOT hardcoded in framework/).
#
# org_domains — the org's internal email domains, and the ALLOWLIST of what
# counts as internal. The action classifier (framework/authority/classifier.py)
# treats a recipient at one of these as internal_comms; everything else is
# external_comms (the always-gated ceiling). framework.env.org_domains() reads
# this list and fails closed to EMPTY (a deployment with none set treats every
# recipient as external). Domains are matched case-insensitively, and — since
# 2026-07-27 — EXACTLY: a subdomain you want treated as internal gets its own
# line here, because a bare domain silently claiming its whole subdomain
# namespace claimed subdomains nobody had checked and subdomains that did not
# exist yet. instance/config/recipient-exclusions.yml holds the two carve-backs
# on this list: `subdomain_matching: inherit` restores the old unbounded rule,
# and its denylist names addresses/domains that are NOT internal despite
# sitting at a domain listed here (an alias or distribution list that fans out
# to non-employees is the case org_domains cannot express).
org_domains:
  - stepnetwork.dk
  - jfmedier.dk
  - jysk-fynske-medier.dk
  - polads.eu
  - refslund.ai
  - step.dk

# tasks_board — the Monday board id lane-created tasks land on (action_exec's
# DEFAULT_TASKS_BOARD + the act-first canary's synthetic probe board).
# framework.env.tasks_board() reads this (env CABINET_TASKS_BOARD overrides) and
# fails closed to "" (the executor's isdigit() guard then refuses rather than
# landing on another deployment's board).
tasks_board: "5091706356"

# lane_default — the lane stamped on action-lane proposals whose LLM output
# omitted a lane (framework/acting/action_lane.py propose_actions). A Captain
# ruling encoded as INSTANCE data (PolAds-first ruling; moved here from the
# framework signature default by PC-E-LOCKSTEP pair (e) — the framework reader
# lands at the germline ceremony, until then this key is declared-but-unread).
# framework.env.lane_default() reads this and fails closed to "" (the acting
# runner's lane normalization then files the card under the stable "adhoc"
# catch-all — never another deployment's lane).
lane_default: polads

# =============================================================
# Flavor-A source paths — the screenpipe estate this instance senses through
# =============================================================
# Instance+flavor-specific filesystem paths the universal-base framework reads
# via framework.env resolvers, so framework/ carries no launcher's .screenpipe
# path (source-adapter boundary, docs/plans/source-adapter-boundary-2026-07-05.md
# §5 — Tier-2 credential/path reparents). A clean-room / Flavor-B deployment
# omits these keys and the resolvers fail closed to "" (no credentials loaded,
# no retrodiction scoring lib — never a crash, never a foreign path).
#
# shared_env_path — the shared credentials .env file the action lane loads
# MONDAY_API_TOKEN / MONDAY_API_KEY from (framework/frontdoor/action_exec.py
# _load_shared_env + framework/frontdoor/actfirst_canary.py env-perms check).
# framework.env.shared_env_path() reads this (env CABINET_SHARED_ENV overrides)
# and fails closed to "" (a deployment with none set loads no shared credentials
# — Monday calls then fail with a clear "not set" error rather than reading
# another launcher's file). A leading ~ is expanded by the caller.
shared_env_path: ~/.screenpipe/pipes/_shared/.env

# retro_pipe_dir — the retrodiction SCORING pipe dir (holds lib.py) the fidelity
# EvaluationEngine (framework/fidelity/retro.py) loads its leak-safe scoring
# logic from. framework.env.retro_pipe_dir() reads this (env
# CABINET_RETRO_PIPE_DIR still overrides in retro.py) and fails closed to ""
# (retro_available() then False; the scoring stub raises with guidance on first
# use). The SCORING functions live in framework — only this PATH is
# instance-bound. A leading ~ is expanded by the caller.
retro_pipe_dir: ~/.screenpipe/pipes/retrodiction

# vault_dir — the brain/Obsidian VAULT dir the fidelity decision-cell reads its
# held-out Decisions corpus from (framework/fidelity/decision_cell.py _vault_dir).
# framework.env.vault_dir() reads this (env CABINET_VAULT_DIR overrides) and
# fails closed to "" (a deployment with no vault set → the Decisions corpus is
# empty → no cases, never a crash, never a foreign vault). ~ is expanded by the
# resolver.
vault_dir: ~/obsidian/screenpipe-brain

# state_dir — the personal-source runtime-STATE dir (the fidelity decision-cache
# + autonomy-outcomes ledger; the outcome-watchdog's watched brain-pipe dir).
# framework.env.state_dir() reads this (env CABINET_STATE_DIR overrides) and
# fails closed to "" (cache/outcomes callers substitute a generic ~/.cabinet/state;
# the watchdog treats "" as nothing-to-watch — the Flavor-B degrade). ~ is
# expanded by the resolver.
state_dir: ~/.screenpipe/state

# git_repos — the Captain's product/infra repos the fidelity decision-cell
# mines for git-derived DecisionCases (framework/fidelity/decision_cell.py
# build_decision_corpus's "git" source). framework.env.git_repos() reads this
# list and fails closed to EMPTY (a deployment with none set mines no git
# corpus — decisions-only, never a crash, never another launcher's repos).
# Each entry is ~-expanded by the resolver.
git_repos:
  - ~/v0-politiske-annoncer
  - ~/dev-tasks

# =============================================================
# Spending Limits — daily caps on Anthropic API spend
# =============================================================
# Per-officer and cabinet-wide caps enforced by pre-tool-use.sh.
# Framework ships safe defaults at framework/defaults/spending-limits.yml;
# this block overrides them for THIS Cabinet.
#
# CAPTAIN RULING 2026-07-26 — "unlimited spending". Both caps are OFF on this
# deployment. The word `unlimited` is deliberate: `0` also disables a scope,
# but a config line reading `daily_per_officer_usd: 0` says the opposite of
# what is meant, and a very large number would surprise whoever eventually
# crossed it. Refined the same day: money is not the scarce resource here (the
# work rides a Max x20 subscription), Captain ATTENTION is — so a dollar
# threshold would page him with noise.
#
# Removing the cap did NOT remove the measurement, and that distinction is the
# whole point. session-stop.sh still meters every turn, framework/cost/meter.py
# still counts the non-session lanes, and the briefing still carries a per-lane
# line. The subscription's own limit is now the real ceiling; see
# cabinet/cron/limit-reset-watchdog.sh.
#
# NOT YET TRUE, stated here so nobody reads the line above as coverage:
# NOTHING alarms on spend. framework/watchdog/registry.py carries no spend,
# cost or meter row (grep it), so with the caps off, an unmetered or runaway
# lane is measured and then noticed by nobody. The anomaly rows that would
# close this — spend with no output, a lane 20x its own trailing median, a
# lane that never billed suddenly billing, a silent meter — are NOT
# IMPLEMENTED, and were WITHHELD PENDING A TWO-MODEL DIRECTION GATE rather
# than forgotten: per the 2026-07-27 scope ruling, deciding what counts as
# anomalous and interrupting the Captain is new behaviour, not a repair, so it
# does not ride a fix. Until one lands, the meter's liveness is a MANUAL check
# (docs/runbooks/observe-only-dogfood.md).
#
# Background: FW-002 in shared/cabinet-framework-backlog.md; incident
# 2026-04-17 — CoS bricked for ~15 min by silent over-cap block.
spending_limits:
  daily_per_officer_usd: unlimited
  daily_cabinet_wide_usd: unlimited
  coordinating_officer_multiplier: 3.0  # CoS routing overhead carve-out; cabinet-wide cap still wins
  telegram_whitelist_enabled: true    # Always-on safety net, cheap to keep enabled
  telegram_whitelist_hourly_cap: 10

# =============================================================
# Dashboard — Consumer Mode (Spec 032)
# =============================================================
# The Consumer/Advanced toggle surfaces a 4-card natural-language dashboard
# for non-developer founders, while Advanced keeps the current admin UI.
# Consumer is the default for first-time users. Once a user toggles to
# Advanced, the toggle stays there permanently (no re-defaulting — CRO v3
# pressure-test: Home Assistant saw 14% of users never find the toggle).
#
# Set consumer_mode_enabled: false to disable the feature entirely — the
# dashboard behaves exactly as pre-Spec-032, full admin nav only.
dashboard:
  consumer_mode_enabled: true         # Master switch for the toggle + Consumer UI
# consumer_mode_default is reserved — will be wired when the first-visit
# default-mode selection lands end-to-end in a follow-up PR. Setting it now
# has no effect.

# =============================================================
# Founder Accountability — how officers push on blocking issues
# =============================================================
# Officers ask the Captain for commitment dates on founder-action items,
# then remind and escalate if missed. Adjust cadence to your preference.
accountability:
  reminder_before: 2h          # How long before deadline to send a reminder (e.g., 2h, 1d, 30m)
  follow_up_after: 1h          # How long after a missed deadline to follow up
  escalation_after: 24h        # When ALL officers start including it as #1 in every DM
  tone: direct                 # direct | gentle | balanced
  # direct: "You committed to X. You missed it. New date?"
  # gentle: "Hey, just checking in on X — still planning to get to it today?"
  # balanced: "Reminder: X is overdue. What's your new timeline?"

# =============================================================
# Communication Preferences — how officers communicate with the founder
# =============================================================
# Controls DM frequency, research visibility, and notification style.
# Founders who want fewer messages adjust these settings.
communication:
  research_visibility: full      # full | summary | minimal
  # full: Every research finding DM'd with action/no-action classification
  # summary: Batch findings into daily briefing, only DM [ACTIONABLE] items
  # minimal: Only DM critical/urgent findings, everything else in briefing

  briefing_frequency: 2x_daily   # 2x_daily | daily | weekly
  # 2x_daily: Morning + evening briefings (the wall-clock slots come from
  # `briefing_times` above — fleet default 07:30/19:30)
  # daily: Morning briefing only
  # weekly: One weekly summary (Monday morning)

  officer_dm_policy: proactive   # proactive | on_request | minimal
  # proactive: Officers DM founder with status updates, proposals, blockers
  # on_request: Officers only DM when founder asks or when [ACTIONABLE]
  # minimal: Officers post to warroom only, DM only for founder-action items

  tech_radar_routing: captain    # captain | cos_only | silent
  # captain: Tech radar items DM'd to founder with action classification
  # cos_only: Route to CoS, include in briefing but don't DM separately
  # silent: Log to tech-radar.md only, no notifications

# =============================================================
# Officer Types — fulltime vs consultant
# =============================================================
# fulltime: always-on, persistent session, supervisor auto-restarts
# consultant: on-demand, starts via cron/trigger, supervisor does NOT restart
#
# Consultant officers have full identity (role def, memory, Telegram, tools)
# but aren't always running. They activate on schedule or when triggered,
# do their work, then sit idle. Designed for low-frequency, non-interactive
# roles (research sweeps, periodic audits, compliance checks).
#
# To configure: add officer key with type field. Officers not listed default to fulltime.
# IMPORTANT: Use inline YAML format (single line per officer, 2-space indent).
# The supervisor parses this with grep — multi-line block style will not be detected.
# officers:
#   cos: { type: fulltime }
#   cto: { type: fulltime }
#   cpo: { type: fulltime }
#   coo: { type: fulltime }
#   cro: { type: consultant, schedule: "0 */4 * * *" }
#
# -------------------------------------------------------------------------
# Comms Officer registration — PREPARED 2026-06-24, NOT YET ACTIVE.
# -------------------------------------------------------------------------
# Domain officer (portfolio/hq deployment): owns the Captain's Outlook + Teams comms
# end-to-end. Telegram-DARK (no bot, no Captain DM — surfaces ONLY through the
# Chair via cabinet:frontdoor:intake + the captain-attention queue). Model
# claude-opus-4-8[1m] (fleet default; comes from CABINET_MODEL /
# start-officer-mac.sh + the role-def frontmatter, NOT parsed from here).
#
# DO NOT UNCOMMENT until the ACTIVATION CHECKLIST is met
# (shared/interfaces/comms-officer-activation-2026-06-24.md): comms-officer
# hired in cabinet/mcp-scope.yml (PROPOSED make+brain+telegram scope, germline
# — Captain applies) + its rows in cabinet/officer-capabilities.conf + the
# Make folder-WRITE scenario edit landed + the gather fix landed.
#
# NOTE on the spawn parser (cabinet/scripts/cabinet-spawn.sh): introducing a
# LIVE `officers:` block REPLACES the fallback roster (cos cto cpo coo cro).
# This portfolio deployment currently runs cos (Chair) + polads-ceo +
# stephie-ceo. If/when you activate this block, list the FULL live roster too
# so spawn doesn't drop the Chair or a lane CEO. The `type: fulltime` and the
# officer key MUST be on the SAME line (inline-YAML), key may contain hyphens.
#
officers:
  cos: { type: fulltime }              # Chair (Lead — the only Telegram voice)
  polads-ceo: { type: fulltime }       # lane CEO (Telegram-dark)
  stephie-ceo: { type: fulltime }      # lane CEO (Telegram-dark)
  comms-officer: { type: fulltime }    # Telegram-dark domain officer; model claude-opus-4-8[1m] (activated 2026-06-24)

# =============================================================
# Model routing — concrete IDs + lineage (principle lives in CLAUDE.md §"Model Routing")
# =============================================================
# The LLM model is NOT parsed from this file — it comes from CABINET_MODEL /
# start-officer-mac.sh (Mac) / start-officer.sh (Docker), the CABINET_MODEL env
# in the officer LaunchAgent, DEFAULT_MODEL in generate-instance.py, and the
# `model:` frontmatter in each agent def. This block records the current values
# + lineage so CLAUDE.md can carry only the tiering principle.
#
#   officer_default:  claude-opus-4-8[1m]  + --effort max   (single-quote where
#                     it reaches a shell — the [1m] suffix would otherwise glob)
#                     STANDING (Captain ruling 2026-07-07): claude-opus-4-8[1m]
#                     IS the fleet standard — default mode, no fast-mode toggle,
#                     and NO flip-back-to-Fable clause. Do not route officers to
#                     claude-fable-5 even if account access returns.
#   crew_default:     claude-sonnet-4-6  (cost-efficient parallel execution);
#                     escalate individual crew to claude-opus-4-8 for
#                     judgment-heavy work (adversarial review, architecture,
#                     security). Spawning officer's situational call
#                     (Captain directive 2026-06-12).
#   advisor:          bash cabinet/scripts/advisor-crew.sh (one-shot) or
#                     Task(model="claude-opus-4-8", ...) (adversarial / fresh-context).
#   rollback (one):   CABINET_MODEL=claude-sonnet-4-6 bash start-officer-mac.sh <officer>
#   rollback (fleet): change MODEL default in start-officer-mac.sh / start-officer.sh
#                     (+ DEFAULT_MODEL in generate-instance.py for future lanes).
#
# Lineage: Opus 4.7 → Fable 5 ratified 2026-05-24 (msg 2687) → Opus 4.8 1M
# fleet standard (2026-06-23 fallback → made STANDING by Captain ruling 2026-07-07).

