# instance/config/officer-emails.yml
# Assignee resolution for Linear email + GH login → officer slug.
# Two top-level keys: `emails` (Linear assignee.email) and `github_logins`
# (GH Issues assignee.login). Map source identifier → Cabinet officer slug
# (or 'captain' — ETL sets founder_action=TRUE when slug='captain').
emails:
  # Map officer/captain emails to slugs
  # Example:
  #   cos@yourcompany.com: cos
  #   founder@yourcompany.com: captain
github_logins:
  # Map GitHub logins to officer slugs
  # Example:
  #   your-cos-bot: cos
  #   your-github-username: captain
