# instance/config/officer-emails.yml
# Spec 039 §5.4 — assignee resolution for Linear email + GH login → officer slug.
# Two top-level keys: `emails` (Linear assignee.email) and `github_logins`
# (GH Issues assignee.login). Map source identifier → Cabinet officer slug
# (or 'captain' — ETL sets founder_action=TRUE when slug='captain').
#
# Public-tree scrub 2026-07-12: the captain rows below are synthetic
# placeholders — real personal addresses/logins are deployment-local and
# never belong in this tracked file (Linear is a read-only archive
# post-Spec-039 cutover, so the live mapping burden is nil).
emails:
  cos@sensed.internal: cos
  cpo@sensed.internal: cpo
  cto@sensed.internal: cto
  coo@sensed.internal: coo
  cro@sensed.internal: cro
  # Captain's personal email → placeholder (see scrub note above)
  captain@example.invalid: captain
github_logins:
  sensed-cos: cos
  sensed-cpo: cpo
  sensed-cto: cto
  sensed-coo: coo
  sensed-cro: cro
  example-captain: captain
