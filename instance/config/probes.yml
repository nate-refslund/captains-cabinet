# =============================================================
# instance/config/probes.yml — outcome-probe product map (lane-supply 2026-07-05)
# =============================================================
# Read by framework/probes/runner.py (the probe __main__ shell). Instance
# layer: THIS deployment's products; edit freely — a wrong/missing entry makes
# the probe SKIP that product with a printed reason (fail-closed: no verdict,
# never a fabricated observation). No secrets belong here: tokens live in
# cabinet/.env / ~/.screenpipe/pipes/_shared/.env and reach the probes via
# environment only (cabinet/scripts/run-probes.sh sources them).
#
# SCHEMA
#   github:   list of {repo: <owner/name gh slug>, checkout: <abs local path>}
#   vercel:   list of {app: <vercel app name>, checkout: <abs local path>}
#             (team scoping is hardcoded load-bearing in probe_vercel.TEAM_ID —
#              the v9 projects list truncates ids, so probes query by app)
#   sentry:   {org: <sentry org slug>, projects: [{project, checkout}]}
#
# WHY checkout is required per product: the probes' freshness guard and the
# B2.1 trailer fallback read LOCAL git (commit messages carry
# Cabinet-Proposal-Id) — the runner chdirs there before each probe cycle. A
# missing checkout = that product is skipped this run.
#
# Seeded 2026-07-05 with PolAds only (identity from the screenpipe codebase
# pillar: vercel_app v0-politiske-annoncer, Neon restless-king-62586913; Sentry
# org step-network per step-network.sentry.io; project slug from the live
# Sentry workspace — VERIFY on first live run, a wrong slug degrades to
# skips/empty reads, never to false verdicts). Add stephie/jobdanmark lanes
# when their acted cards start carrying deploy-shaped chains.

github:
  - repo: STEP-Network/v0-politiske-annoncer
    checkout: /Users/nate/v0-politiske-annoncer

vercel:
  - app: v0-politiske-annoncer
    checkout: /Users/nate/v0-politiske-annoncer

sentry:
  org: step-network
  projects:
    - project: sentry-step-polads
      checkout: /Users/nate/v0-politiske-annoncer
