# instance/config/watchdog.yml — outcome-watchdog instance data (egg plan R017).
#
# The deployment-specific tables framework/watchdog/registry.py used to
# hardcode live HERE now: the briefing slot times, the fulltime-officer
# roster, the brain pipe-freshness table, and WHICH expectation rows are
# enabled. The registry keeps the MACHINERY (verify fns, tiers, the router
# contract) and reads this file at import with a NARROW stdlib parser
# (survival contract: no PyYAML) — so edit ONLY in the exact shapes used
# below: top-level `section:` keys, 2-space `key: <int>` scalars under
# briefing:, 2-space `- <slug>` list items, and 4-space `log:` /
# `max_stale_s:` fields under a 2-space pipe name. Unknown lines are ignored
# per-entry; a missing or unparseable file degrades to generic defaults
# (briefing 07:30/19:30 +45m grace, EMPTY roster, EMPTY pipe table, ALL
# expectations enabled) — a bad config can narrow the watchdog's inputs,
# never blind the sweep itself.

# Briefing delivery slots (Captain-local wall clock) + grace minutes before
# the outcome is asserted. MIRRORS the one source of truth —
# instance/config/platform.yml `briefing_times` (which generate-plists.py
# stamps into the frontdoor-briefing plist; cabinet/services.yml's calendar
# row is the other mirror) — keep in sync if that cadence changes; the parity
# suite (cabinet/scripts/tests/test_briefing_time_parity.py) fails on drift.
# (This file keeps its own no-PyYAML parser — survival contract — so it
# cannot read platform.yml itself.)
briefing:
  am_hour: 7
  pm_hour: 19
  minute: 30
  grace_min: 45

# Fulltime officers expected to reflect within 48h of doing work
# (verify_officer_reflection). Keep in sync with the officer rows in
# cabinet/services.yml.
fulltime_officers:
  - cos
  - polads-ceo
  - stephie-ceo
  - comms-officer

# Brain ingestion pipes: log filename under the brain state dir
# (framework.env.state_dir()) + max staleness seconds. Thresholds account for
# each pipe's ACTUAL cadence AND the Mac's overnight gap: all pipes pause
# when the MacBook sleeps / work-hours gates close (~19:00-08:00), so a
# threshold shorter than that window false-alarms every morning (observed
# 2026-07-01 flood + 07-03 teams-graph). Cadences per the Graph cost
# optimization: msgraph HOURLY (07-19 work-hours-gated + 14h overnight
# catchup), teams-graph DAILY (86400s). Keep in sync with the pipe plists if
# a cadence changes.
pipe_freshness:
  msgraph-incremental:
    log: msgraph-incremental.log
    max_stale_s: 54000     # hourly, work-hours-gated + overnight gap (15h)
  teams-graph-incremental:
    log: teams-graph-incremental.log
    max_stale_s: 100800    # DAILY cadence (86400s) + buffer (28h)
  embeddings:
    log: embeddings.log
    max_stale_s: 54000     # frequent but pauses on overnight sleep (15h)

# Expectation rows enabled on THIS deployment (registry catalog ids, in
# check order). An absent or EMPTY list enables every catalog row — the
# watchdog can be narrowed, never silently zeroed. Unknown ids are ignored.
expectations:
  - briefing-delivered
  - officer-reflection
  - captain-decisions-logged
  # Inbound Captain contact — the SECOND leg of the contact dead-man, shipped
  # STAGED DARK like the Phase-4 rows below. Uncomment to arm. The PRIMARY
  # inbound detector is the off-machine watcher configured in
  # instance/config/liveness.yml: it alarms on the ABSENCE of a heartbeat and
  # therefore survives the outage that would silence this row, so arming this
  # one is an addition, never the thing that closes inbound silence. What it
  # adds is attribution the external watcher cannot give — the inbound poller
  # dead while the rest of the cabinet is healthy. Arm it only once the Chair
  # is reliably reading its stream, since a quiet Captain and a broken lane
  # look identical from here and both page the Chair.
  # - captain-inbound-contact
  - no-silent-cron-failure
  - pipes-fresh
  # Phase-4 evidence-plane rows shipped STAGED DARK (shadow law — whole-cabinet
  # evidence design 2026-07-16 §3 Phase 4) and the Captain's 2026-07-26
  # arm-the-cabinet ruling executed that ceremony for the two SHADOW rows
  # (evidence-shadow-detectors + evidence-recompute are now enabled in
  # cabinet/services.yml). Each id below is armed ONLY where arming it cannot
  # cry wolf — the enable instruction said "uncomment these ids in the same
  # step", and two of the four would page daily on a cabinet whose evidence
  # plane was never activated:
  #
  #   * evidence-store-invariants — ARMED. verify_evidence_store_invariants
  #     returns skipped=True when the store is not observable
  #     (registry.py:1396), so an unactivated plane is silent by construction.
  - evidence-store-invariants
  #   * evidence-anchor-export-fresh — STAYS DARK: its producer, the
  #     `evidence-anchor` service row, was NOT in the Captain's enable list and
  #     is still parked. Arming a freshness floor over a surface nobody
  #     produces is a manufactured page. Uncomment when evidence-anchor is
  #     enabled (needs instance/config/evidence-anchor.yml — only .example
  #     ships today).
  # - evidence-anchor-export-fresh
  #   * evidence-shadow-detector-liveness — STAYS DARK UNTIL THE STORE EXISTS.
  #     Its skip arm only covers "row disabled" (registry.py:1519); with the
  #     row now ENABLED and no store at instance/evidence/v1 the detector
  #     correctly writes NOTHING ("plane not activated; nothing to detect" —
  #     the detector module's store-absent arm) and the never-appended-journal
  #     arm would FAIL every single day. Uncomment in the same step that
  #     activates the evidence store. (Module path spelled out only in the
  #     services.yml row, which the shadow-law reference proof allowlists —
  #     naming it here would trip that proof on prose.)
  # - evidence-shadow-detector-liveness
  #   * evidence-recompute-liveness — ARMED as a forward-arm. NOTE (verified
  #     2026-07-26): there is still NO catalog row for this id in
  #     framework/watchdog/registry.py, so it is an ignored unknown id today
  #     and covers nothing; it starts covering the moment the catalog row
  #     lands, with no second config edit.
  - evidence-recompute-liveness
