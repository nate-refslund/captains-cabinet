# =============================================================================
# act-first surfaces — per-board cascade verdicts + act-first knobs  (TI-0)
# =============================================================================
#
#   ██  DRAFT — NOT ENFORCING.  The Captain ratifies before the act-first flip. ██
#
# This file is the INSTANCE draft produced by the Wave-1 L3 cascade audit
# (docs/cascade-audit-2026-07-04.md, 2026-07-04). It records, per Monday board,
# whether the act-first lane may execute unattended writes there, and carries the
# instance act-first knobs (confidence floor + caps). It is officer-landable and
# advisory ONLY. The ENFORCING germline allowlist lands separately in GERM-2
# (framework/policies/act-first-surfaces.yml, Captain-applied). Until then the
# executor's hard fallback allowlist is {5091706356} (SEC-3), and nothing in this
# file grants unattended execution by itself.
#
# Verdict vocabulary (Nate's 2026-07-04 ruling folded in):
#   allow       — audited; no outbound-to-external-human cascade found on the
#                 acted path. Monday NATIVE notifications are HARMLESS and never
#                 block a board (2026-07-04 ruling). Still Captain-gated at flip.
#   blocked     — a real outbound cascade is present or near-certain (Make email
#                 scenario, @-mention email to a non-Nate human, external webhook,
#                 support/CRM email automation). NEVER act-first here.
#   unverified  — cannot be positively cleared. Make.com scenarios are invisible
#                 to this audit (no Make creds; Monday's webhooks() API never
#                 reveals a webhook's destination URL). A "0 webhooks" board is
#                 NOT proven clean — a Make poll-trigger or native email automation
#                 leaves no API-visible trace. unverified ⇒ EXCLUDED from act-first
#                 (default-deny), not "clean".
#
# DEFAULT-DENY: any board not listed `allow` below is excluded from act-first.
# =============================================================================

version: 0
status: draft                     # draft | ratified — Captain flips to ratified
audit_ref: docs/cascade-audit-2026-07-04.md
audited_at: "2026-07-04"
audited_by: L3-cascade-audit (trust-inversion Wave 1)

# --- account / identity the audit ran under (see report §agent-token) --------
# The MONDAY_API_TOKEN in ~/.screenpipe/pipes/_shared/.env resolves to the
# full-privilege "STEPhie" user (id 48307552) which can read/write 534 active
# boards across the ENTIRE STEP org (CRM, Invoices, Bookings, AdSales, onboarding).
# Unattended act-first MUST NOT ride this token — see recommended MONDAY_AGENT_TOKEN.
audited_identity:
  monday_user_id: "48307552"
  scope_observed: "full-org (534 active boards, all workspaces)"
  recommendation: use a dedicated scoped agent user — MONDAY_AGENT_TOKEN (design in report)

# --- instance act-first knobs (consumed by the runner/executor once wired) ----
confidence_floor: 0.65            # proposer confidence below this ⇒ propose-only

caps:                             # honest, conservative starters — tighten never loosen
  estate:
    max_acts_per_run: 5           # across all boards+kinds in one lane run
    max_acts_per_day: 40
  per_kind:
    max_acts_per_day: 20          # per action_type (e.g. monday_task_create)
  per_board_default:              # applies to any allow board without its own caps
    max_acts_per_run: 3
    max_acts_per_day: 15

# --- executor obligations (hard, deterministic; enforced in the L1 executor) --
# These are NOT knobs — they are invariants the executor must hold on EVERY
# act-first write regardless of board verdict. Documented here so the allowlist
# and the obligations travel together; the code home is SEC-3 in action_exec.py.
executor_obligations:
  - id: no-at-mention
    rule: >
      NEVER emit Monday @-mention syntax (@name, @team, or a raw Monday user-id
      mention token) in any create_update / note body. A mention notifies AND
      EMAILS the mentioned user — a real outbound cascade the board verdict does
      not capture. Strip @-tokens from all lane-written Monday bodies. [RT-A8]
  - id: provenance-banner
    rule: >
      Every lane-created artifact carries a loud human-legible "🤖 cabinet:"
      prefix + the cid footer, so a cascade that DOES fire is unmistakably
      machine-authored.
  - id: create-not-mention-people
    rule: >
      Reject any payload/set key matching people|person|assignee|subscriber|
      owner — assigning/subscribing a human on a Monday item emails them.

# =============================================================================
# ALLOWLIST — boards where act-first MAY execute (still Captain-gated at flip).
# Start of one. Everything else is default-denied.
# =============================================================================
allowlist:
  - board_id: "5091706356"
    name: "Tasks"
    workspace: "AI Workspace"
    verdict: allow
    kinds: [monday_task_create]   # CREATE only — see caveat on the update path
    caps:
      max_acts_per_run: 3
      max_acts_per_day: 15
    why: >
      Nate's private AI-Workspace Tasks board — the action_exec DEFAULT_TASKS_BOARD
      and the SEC-3 fallback board. Webhook snapshot: NO create_item subscriber, so
      creating an item fires no cascade. This is the lowest-blast landing surface.
    caveats:
      - >
        UPDATE path is NOT clear. The board carries a `change_column_value`
        webhook (id 157255553) + a `change_subitem_column_value` webhook
        (id 157257050). Monday's API does not reveal their destination, so a
        monday_task_update (status/priority/due) on this board triggers an
        UNIDENTIFIED subscriber. monday_task_update stays propose-only on this
        board until that webhook's destination is identified and cleared.
      - >
        permissions=everyone (org-visible, 1813 items) — not a throwaway scratch
        board. Provenance banner + @-mention stripping are load-bearing here.

