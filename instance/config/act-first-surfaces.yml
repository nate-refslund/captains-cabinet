# =============================================================================
# act-first surfaces — ACCESS INVERSION (Captain-ruled 2026-07-04)
# =============================================================================
#
# DEFAULT-ALLOW. The Captain: "you have autonomous access to ALL boards in
# Monday — we should not have an allowlist, rather a denylist... for now there
# is no denylist, keep it empty." Access is granted first and narrowed only by
# explicit exclusion — the access-axis mirror of earn-demotion. Safe because
# default-allow ≠ default-act: every act-first step still needs a registered
# inverse (48h undo), and the six hard ceilings (incl. external comms — the
# Captain owns ALL outbound) are unchanged on every board.
#
# Two sections gate a board, both Captain-owned, mechanically identical:
#   denylist:      — explicit Captain exclusions. EMPTY by the 2026-07-04
#                    ruling. Connect-time interviews of new critical-info tools
#                    ("what may this NOT touch?") append here.
#   cascade_gated: — NOT an access denial. Audit-proven boards where a write
#                    mechanically fires outbound mail/Teams to a human (TI-0
#                    cascade audit, docs/cascade-audit-2026-07-04.md) — acting
#                    there = sending, so the write stays propose-first under
#                    the UNCHANGED external-comms ceiling. The Captain lifts
#                    any entry by deleting it (one line).
#
# Corruption honesty: this file ABSENT ⇒ empty denylist (the ruled posture).
# This file PRESENT but unparseable ⇒ every board gated until repaired (an
# unreadable Captain exclusion list is never ignored).
#
# The previous default-deny allowlist draft (TI-0, ratification pending) is
# SUPERSEDED by the inversion ruling; its audit evidence lives on below as the
# cascade_gated whys. Boards the audit called "unverified" (People &
# Relationships 5096013693, Reflections & Research 5096013783, Products
# 5091839409, Activities 5091999365, …) are now ALLOWED — the Make.com
# blind-spot risk on private AI-Workspace boards is accepted by the ruling.
# =============================================================================

version: 1
status: ruled                     # Captain ruling 2026-07-04 (access inversion)
audit_ref: docs/cascade-audit-2026-07-04.md
ruled_at: "2026-07-04"

# --- acting identity (Captain-ruled 2026-07-04) -------------------------------
# "Use my existing Monday API key with full privilege as the agent token —
# I want the cabinet to be able to act like me." MONDAY_API_TOKEN (fallback
# MONDAY_API_KEY) from ~/.screenpipe/pipes/_shared/.env is the acting
# credential — full-privilege user 48307552, org-wide. The earlier scoped-
# agent-user recommendation is superseded by this ruling. Names only — never
# values — in any file or log.
acting_identity:
  monday_user_id: "48307552"
  credential_env: MONDAY_API_TOKEN   # fallback: MONDAY_API_KEY
  scope: full-org (by Captain ruling)

# --- instance act-first knobs --------------------------------------------------
confidence_floor: 0.65            # proposer confidence below this ⇒ propose-only

caps:                             # honest, conservative starters — tighten never loosen
  estate:
    max_acts_per_run: 5           # across all boards+kinds in one lane run
    max_acts_per_day: 40
  per_kind:
    max_acts_per_day: 20          # per action_type (e.g. task_create)
  per_board_default:
    max_acts_per_run: 3
    max_acts_per_day: 15

# --- executor obligations (hard, deterministic; enforced in action_exec) ------
# Invariants on EVERY act-first write regardless of board — these, not board
# lists, are what keep default-allow safe. Code home: SEC-3 in action_exec.py.
executor_obligations:
  - id: no-at-mention
    rule: >
      NEVER emit Monday @-mention syntax (@name, @team, or a raw Monday user-id
      mention token) in any create_update / note body. A mention notifies AND
      EMAILS the mentioned user — a real outbound cascade the board gate does
      not capture. Strip @-tokens from all lane-written Monday bodies. [RT-A8]
  - id: provenance-banner
    rule: >
      Every lane-created artifact carries a loud human-legible "🤖 cabinet:"
      prefix + the cid footer, so a cascade that DOES fire is unmistakably
      machine-authored.
  - id: create-not-mention-people
    rule: >
      Reject any payload/set key matching people|person|assignee|subscriber|
      owner — assigning/subscribing a human on a Monday item emails them.

# =============================================================================
# DENYLIST — explicit Captain exclusions. EMPTY per the 2026-07-04 ruling.
# (Connect-time interviews of new critical-info tools append rows here:
#  {board_id: "...", kinds: [...optional...], why: "..."} — no kinds = whole board.)
# =============================================================================
denylist: []

