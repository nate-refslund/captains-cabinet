    captain_ratified: true
    measurable_criteria:
      - node_id: polads-001-ci
        title: "Unblock staging CI — required jobs green"
        owner_role: polads-ceo
        acceptance_criteria:
          - "The required CI jobs pass on the staging branch for 3 consecutive PR runs"
          - "No open PR on staging is merge-blocked by those jobs"
        evidence_required: "Links to 3 consecutive green CI runs on staging PRs"
