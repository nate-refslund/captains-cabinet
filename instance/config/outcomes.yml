# =============================================================
# LIVE MISSION FILE — the compiler reads this file by name.
# Activated by the Captain 2026-06-10 (renamed from .draft).
# =============================================================
# PUBLIC-TREE SCRUB 2026-07-12: outcome VALUES below are neutralized to
# generic example-org wording — real product strategy prose, colleague
# names, work-tracker item ids and repo/host identities were removed
# because this repository is public. STRUCTURE is live and untouched:
# outcome ids, node ids, statuses, roles, dependencies and the deployment
# gate are the real execution state that the compiler, ledgers and
# graduation math key on. The deployment's real mission text lives in the
# untracked instance overlay (same schema — see below); pre-scrub text
# survives only in this repository's pre-publication git history.
#
# Schema: framework/schemas/outcome.schema.json (Mission Compiler v2 rich
# criteria). Validated with jsonschema before commit.
#
# SAFETY — two gates, both OPEN for the outcomes below:
#   1. FILENAME gate: the compiler (framework/missions/session_bridge.py)
#      reads instance/config/outcomes.yml — this file.
#   2. STATUS gate: the compiler compiles only outcomes with status: active
#      (captain_ratified is a human record the compiler does NOT read).
#      To pause one, flip its status to draft.
#
# AUTONOMY CEILING (applies to every criterion marked risk_level: high):
#   external_comms / production deploys / spending are ALWAYS propose-only.
#   Outbound messages go via the approval queue -> Captain approval;
#   production deploys and enforcement flips need explicit Captain
#   approval. This mirrors the R4 hard ceiling — graduation never lifts
#   these here.
#
# WORK MODEL (Captain-agreed 2026-06-10) — products are LANES, not
# outcomes. Three work classes per lane; full contract:
# framework/docs/work-model.md.
#   1. STREAM — continuous product work on the lane's canonical backlog;
#      never wrapped in outcomes. Propose-first until a lane graduates.
#   2. MISSIONS — this file. A ROLLING WINDOW of 1-2 active bounded
#      outcomes per lane — not a roadmap. Inclusion test: the outcome
#      describes a verifiable STATE CHANGE, never an activity. Lifecycle:
#      draft -> active (Captain-ratified) -> achieved -> retired. When one
#      achieves, its slot refills via the RENEWAL LOOP (lane product-owner
#      drafts a successor -> coordinating role consolidates -> Captain
#      ratifies).
#   3. INTAKE — machinery, not a mission: a scheduled coordinating-officer
#      routine sweeps the to-do surface + unclassified stream items,
#      classifies to lane, and proposes-only. See
#      framework/docs/work-model.md (Intake).
#
# Lanes: polads | stephie-stepnetwork | system-self
# (lane is encoded in the outcome id/description; the schema has no lane key)

# DEPLOYMENT GATE — this file is pinned to the hq-macbook cabinet. The
# compiler (compile_from_yaml) skips the WHOLE file with a stderr warning
# on any deployment whose CABINET_ID env does not equal this value, so
# another machine pulling this branch never compiles hq's missions and
# never double-executes cos-owned system-self tasks. hq must run with
# CABINET_ID=hq-macbook for these outcomes to compile (default CABINET_ID
# is "main").
# AMENDMENT 2026-07-02 (Captain-ratified derivation card,
# docs/plans/outcome-derivation-2026-07-02.md): outcomes below are
# AI-DERIVED from Captain-owned directions (instance/config/directions.yml)
# and Captain-RATIFIED — per the directions-layer ruling.
deployment: hq-macbook

