  - id: outcome-polads-001
    name: "Lane product v1.0 staging closeout and production release"
    description: >
      Close the staging/UAT blockers on the lane product's staging
      deployment and ship its v1.0 production release. Grounded in live
      tracker state at authoring time (staging CI broken and blocking PR
      merges; an open UAT bug class; a v1.0 production target).
