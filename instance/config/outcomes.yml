          - "Each fix lands with a regression test"
        evidence_required: "Merged PR links + passing regression tests + UAT retest note on the staging deployment"
        verifier_role: stephie-ceo
        risk_level: medium
        rollback_note: "Per-fix revert via git; staging-only until polads-001-prod"
      - node_id: polads-001-prod
