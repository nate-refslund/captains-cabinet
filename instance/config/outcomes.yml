# LIVE MISSION FILE — the compiler reads this file by name.
# Activated by the Captain 2026-06-10 (renamed from .draft).
# =============================================================
# R2 prep (clone-convergence plan, docs/clone-convergence-plan-2026-06-09.md).
# Authored 2026-06-10 from live grounding:
#   - 9-Codebases/{PolAds,STEPhie,stepnetwork-dk}/architecture.md + deployment.md
#   - 0-Inbox/todos-live.md (open work as of 2026-06-09)
#   - Monday item ids cited inline where the work is already tracked
#     (June UAT wave pulled live via dev-tasks 2026-06-10).
#
# Schema: framework/schemas/outcome.schema.json (Mission Compiler v2 rich
# criteria). Validated with jsonschema before commit.
#
# SAFETY — two gates, both now OPEN for the six outcomes below:
#   1. FILENAME gate: the compiler (framework/missions/session_bridge.py)
#      reads instance/config/outcomes.yml — this file.
#   2. STATUS gate: the compiler compiles only outcomes with status: active
#      (captain_ratified is a human record the compiler does NOT read).
#      The Captain ratification pass (2026-06-10) ALREADY set 5 of the 6
#      outcomes below to status: active / captain_ratified: true
#      (polads-001, stephie-001, stepnetwork-001, system-self-001,
#      system-self-002), and the Captain ratified outcome-polads-003 on
#      2026-06-10 — ALL SIX are status: active. This file is live: the
#      compiler will mission-compile all six once the runtime is deployed.
#      To pause one, flip its status to draft.
#
# AUTONOMY CEILING (applies to every criterion marked risk_level: high):
#   external_comms / production deploys / spending are ALWAYS propose-only.
#   Outbound messages go via the brain MCP queue_draft -> Telegram approval;
#   production deploys and enforcement flips need explicit Captain approval.
#   This mirrors the R4 hard ceiling — graduation never lifts these here.
#
# WORK MODEL (Captain-agreed 2026-06-10) — products are LANES, not outcomes.
# Three work classes per lane; full contract: docs/work-model.md.
#   1. STREAM — continuous product work. The Monday Tasks board 5091706356
#      (per-product filter via the dev-tasks plugin) is the canonical
#      backlog; officers claim, execute, close back to Monday. Stream work
#      is NEVER wrapped in outcomes. Propose-first per the autonomy
#      manifest (vault 6-Areas/autonomy-manifest.md) until a lane graduates.
#   2. MISSIONS — this file. A ROLLING WINDOW of 1-2 active bounded
#      outcomes per lane — not a roadmap. Inclusion test: the outcome
#      describes a verifiable STATE CHANGE, never an activity. Lifecycle:
#      draft -> active (Captain-ratified) -> achieved -> retired. Products
#      never finish — outcomes do: when one achieves, its slot refills via
#      the RENEWAL LOOP (the lane's product-owner role — the lane-CEO in
#      the portfolio preset, CPO in the functional preset — drafts a
#      successor from its lane's epic queue + stream pressure -> the
#      coordinating role (Chair/CoS) consolidates the proposal into its
#      briefing's decision queue -> Captain ratifies -> successor goes
#      active). Marking 'achieved': CoS proposes when every criterion
#      carries verified evidence; Captain confirms.
#   3. INTAKE — machinery, not a mission: a scheduled CoS routine (cron
#      trigger -> sweep Monday Nate's-Todos 5098236573 + unclassified
#      stream items -> classify to lane -> propose-only via brain
#      ask_nate). Removed from this file — see docs/work-model.md (Intake).
#
# Lanes: polads | stephie-stepnetwork | system-self
# (lane is encoded in the outcome id/description; the schema has no lane key)

# DEPLOYMENT GATE — this file is pinned to the hq-macbook cabinet. The
# compiler (compile_from_yaml) skips the WHOLE file with a stderr warning
# on any deployment whose CABINET_ID env does not equal this value, so
# another machine pulling this branch (e.g. the Mac Mini soak) never
# compiles hq's missions and never double-executes cos-owned system-self
# tasks. hq must run with CABINET_ID=hq-macbook for these outcomes to
# compile (default CABINET_ID is "main").
