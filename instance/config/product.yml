# =============================================================
# Founder's Cabinet — Product Configuration (Example)
# =============================================================
# This file defines the product a Cabinet operates on.
# Replace placeholder values with your actual product details.
# =============================================================

product:
  name: "Example Product"
  description: "A placeholder product configuration for the Cabinet runtime"
  repo: https://github.com/example-org/example-product
  repo_branch: main
  mount_path: /workspace/product
  captain_name: Captain

# =============================================================
# Notion — Business Brain
# =============================================================
# Replace with your Notion workspace IDs.
# Use notion-search to discover page/database IDs.
notion:
  cabinet_hq_id: "00000000-0000-0000-0000-000000000000"

  dashboard:
    page_id: "00000000-0000-0000-0000-000000000001"
    decision_queue_db: "00000000-0000-0000-0000-000000000002"
    daily_briefings_db: "00000000-0000-0000-0000-000000000003"
    weekly_reports_db: "00000000-0000-0000-0000-000000000004"

  business_brain:
    page_id: "00000000-0000-0000-0000-000000000010"
    vision_id: "00000000-0000-0000-0000-000000000011"
    strategy_brief_id: "00000000-0000-0000-0000-000000000012"
    brand_guidelines_id: "00000000-0000-0000-0000-000000000013"

  research_hub:
    page_id: "00000000-0000-0000-0000-000000000020"
    research_briefs_db: "00000000-0000-0000-0000-000000000021"

  product_hub:
    page_id: "00000000-0000-0000-0000-000000000030"
    product_roadmap_db: "00000000-0000-0000-0000-000000000031"
    feature_specs_db: "00000000-0000-0000-0000-000000000032"

  engineering_hub:
    page_id: "00000000-0000-0000-0000-000000000040"
    architecture_decisions_db: "00000000-0000-0000-0000-000000000041"

  cabinet_ops:
    page_id: "00000000-0000-0000-0000-000000000050"
    decision_journal_db: "00000000-0000-0000-0000-000000000051"
    improvement_proposals_db: "00000000-0000-0000-0000-000000000052"

# =============================================================
# Linear — Execution Backlog
# =============================================================
linear:
  team_key: example
  workspace_url: https://linear.app/example

# =============================================================
# Neon — Product Database
# =============================================================
neon:
  project: example

# =============================================================
# Telegram — Project Group Chat
# =============================================================
telegram:
  bot_mode: single_ceo

# =============================================================
# Platform-level settings
# =============================================================

captain_timezone: UTC

captain_telegram_chat_id: "0000000000"

# =============================================================
# Spending Limits
# =============================================================
spending_limits:
  daily_per_officer_usd: 75
  daily_cabinet_wide_usd: 300
  coordinating_officer_multiplier: 3.0
  telegram_whitelist_enabled: true
  telegram_whitelist_hourly_cap: 10

# =============================================================
# Dashboard
# =============================================================
dashboard:
  consumer_mode_enabled: true

# =============================================================
# Founder Accountability
# =============================================================
accountability:
  reminder_before: 2h
  follow_up_after: 1h
  escalation_after: 24h
  tone: balanced

# =============================================================
# Communication Preferences
# =============================================================
communication:
  research_visibility: summary
  briefing_frequency: daily
  officer_dm_policy: proactive
  tech_radar_routing: cos_only

# =============================================================
# Organizational Health
# =============================================================
organizational_health:
  audit_cadence: auto
  cross_validation: true
  trigger_ack_warning: 60
  correction_tracking: true

# =============================================================
# Research APIs
# =============================================================
research:
  apis:
    - perplexity
    - brave

# =============================================================
# Embeddings
# =============================================================
embeddings:
  provider: voyage
  models:
    storage: voyage-4-large
    query: voyage-4-lite
  dimensions: 1024

# =============================================================
# Voice (disabled by default)
# =============================================================
voice:
  enabled: false
  provider: elevenlabs
  model: eleven_flash_v2_5

# =============================================================
# Image Generation (disabled by default)
# =============================================================
image_generation:
  enabled: false
