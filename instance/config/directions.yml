# =============================================================
# instance/config/directions.yml — Captain-owned DIRECTIONS (the layer above outcomes)
# =============================================================
# Ratified 2026-07-02 (Captain confirmed the model + these drafts verbatim).
# CONTRACT (recorded in captain-decisions.md + docs/plans/EXECUTION-STATUS.md):
#   - Directions are CAPTAIN-AUTHORED, durable, few; revised ~quarterly.
#     The org derives outcomes FROM directions; it NEVER authors directions.
#   - Outcomes stay bounded verifiable state changes (work-model semantics
#     unchanged) but flip to AI-DERIVED → Captain-ratified. Every proposed
#     outcome must cite the direction bet it serves + expected instrument delta.
#   - instruments are TREND INSTRUMENTS for the direction-drift retro check
#     ("outcomes achieving, instruments flat ⇒ regenerate outcomes"),
#     NOT deadline targets.
#   - Window cap (1-2 active outcomes/lane) and Captain ratification stay.
# Consumed by: the renewal loop (manual one-shot derivation first; automated
# per plan addendum "Directions layer" at its planned slot post-B4.11/M2).
#
# PUBLIC-TREE SCRUB 2026-07-12: mission/bets VALUES below are neutralized to
# generic example-org wording (real product strategy removed — the repo is
# public). Lane keys, instrument names and the schema shape are live and
# unchanged; the deployment's real direction text lives in the untracked
# instance overlay.
# EXCEPTION (Captain-ratified 2026-07-17): the org: apex block at the bottom
# of this file is REAL ratified text, not neutralized — it is deliberately
# generic (no personal/product data), so the TRACKED file carries it.

directions:
  stephie:
    mission: >
      The best 24/7, fast, on-demand customer service surface for ordering
      and booking the lane's product offering.
    instruments:
      - request_to_live_lead_time          # from request/booking to live delivery
      - self_served_booking_rate           # % bookings completed end-to-end with no human touch
      - campaign_performance_vs_benchmark  # delivered performance vs benchmark
      - repeat_booking_rate                # customers coming back
      - service_availability               # 24/7 responsiveness of the service surface
    bets:
      - generalize the proven creator flow into the booking front-door
      - officer-backed 24/7 service desk (order/book/adjust on demand)
      - performance-optimization loop (measure -> adjust -> report per engagement)
    not_goals:
      - "TODO-CAPTAIN: confirm not-goals (e.g. 'not a generic design tool'; 'not replacing human relationships')"

  polads:
    mission: >
      Compliant-by-construction regulatory transparency — the lane's
      customers get effortless regulation compliance, self-serve,
      launch-grade by the ratified launch date.
    instruments:
      - v1_live                            # binary: v1.0 in production
      - self_serve_registration_completion # customers finishing flows unassisted
      - compliance_report_correctness      # regulation-grade reporting accuracy
      - support_load_per_customer          # inbound support volume per active customer
      - basic_to_pro_conversion            # subscription upgrade rate
    bets:
      - subscription & billing finalization (tiered)
      - customer dashboard
      - registration flow
      - AI-based support
    not_goals:
      - no adjudicating regulated status (platform is a conduit — Captain ruling 2026)
      - no out-of-region markets yet

  system-self:
    # Captain-owned like all directions; the org proposes outcomes against it.
    #
    # RE-WORDED 2026-07-25. The old mission read "verified outcomes per
    # Captain-minute trending up", which is a shrink-the-denominator goal:
    # the fewer minutes the Captain spends, the better the org looks. That is
    # the opposite of the ruling that the cabinet runs the company TOGETHER
    # WITH him, and the code was wired the wrong way to match (see the
    # instrument comment below). The goal is now the QUALITY of his minutes,
    # with under-asking counted as a failure.
    mission: >
      A self-improving org that compounds: the Captain's minutes going to
      decisions only he could make, every must-ask decision actually reaching
      him, escalation noise trending down, evidence never starving.
    instruments:
      # THE north-star instrument. Share of measured Captain minutes spent on
      # decisions only he could make, with a MUST-ASK FLOOR: a hard-ceiling
      # action that executed without his verdict reads RED however good the
      # share looks, and a window of org activity with zero Captain touches is
      # itself a breach. Computed by cabinet/scripts/attention-well-spent.py;
      # runbook docs/runbooks/attention-well-spent.md.
      - attention_well_spent
      # SUPERSEDED by attention_well_spent (2026-07-25) and RETAINED only
      # because cabinet/dashboard/src/lib/world/directions.test.ts:115 pins
      # this literal string, and editing a test to make a change pass is not
      # allowed here. It is computed NOWHERE. What IS computed points the other
      # way: framework/ovi/compute.py counts Captain input as
      # captain_attention_cost with direction `inverse`
      # (framework/ovi/components.yml), and org_runtime.py's burden_index takes
      # --captain-attention-minutes as a DECLARED input defaulting to 0. Do not
      # revive this wording; retire the string with its test.
      - verified_outcomes_per_captain_minute
      - escalation_rate
      - autonomy_coverage        # % actions in graduated cells
      - repeat_incident_rate
      - ledger_liveness
    bets:
      - the two master plans (docs/plans/) executed to their milestone ladders
    not_goals:
      - never self-author directions; never lift the hard ceiling; never edit its own judge

  # stepnetwork: lane dormant by Captain ruling 2026-07-02 ("someone else is
  # doing this") — website mini-tasks + direction question parked as a future
  # lane decision. No direction authored; outcome stepnetwork-001 retires.

# ── ORG APEX (Captain-ratified 2026-07-17; recorded in captain-decisions.md) ──
# The direction ABOVE the lane directions. Text is deliberately generic (no
# personal/product data) so the TRACKED file carries the real ratified text
# (choice noted in the PR). Additive-safe: framework readers fold only the
# `directions:` key (framework/acting/action_lane.py:232,297,541).
org:
  apex:
    mission: >
      Prove that one founder plus an AI org can run a real multi-product
      business — run this portfolio so well, so autonomously, and so
      auditably that the cabinet earns its public launch.
    instruments:
      - attention_well_spent                   # org roll-up of the system-self instrument
      - verified_outcomes_per_captain_minute   # SUPERSEDED 2026-07-25 — see system-self
      - escalation_rate
      - publication_gate_greens                # egg publication-gate green runs
      - per_lane_instrument_rollup             # each lane's instruments, rolled up
    bets: []       # the lanes carry the bets — apex holds none of its own
    not_goals: []  # apex-level not-goals stay with the lane directions
