# proxy/deploy/docker-compose.yml — FW-121 refslund.ai backend deploy stack.
#
# WHY: net-new deploy automation for the refslund.ai SaaS backend. Spec basis:
#   - Spec 050 L16  — Docker baseline for the SaaS backend ("Docker stays").
#   - Spec 051 §Topology — proxy.refslund.ai on a Hetzner Frankfurt EU VPS behind
#     Cloudflare (public TLS terminates at Cloudflare → forwards to THIS origin).
#   - Spec 052 CTO#2 — audit-server is a SEPARATE service (not a litellm callback),
#     behind the reverse-proxy on a separate port.
#   - Spec 052 CTO#3 + AC#7 — audit-server runs NON-ROOT; chattr +a is provision-side.
#
# Stack: litellm proxy (FW-096) + audit-server (FW-097) + ingest sidecar + Redis
# (cap-state, Spec 051 L209) + Caddy (LOCAL origin reverse-proxy → internal ports).
#
# DEPLOY-GATED: brought up by provision.sh on the VPS (#191, Captain founder-action).
# SECRETS: never inline — all via .env (chmod 600, written by provision.sh). See .env.example.

name: refslund-backend

services:
  # ── LiteLLM proxy (FW-096) — the proxy.refslund.ai/v1 endpoint ────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable   # DEPLOY: pin a digest after validating config.yaml schema
    restart: unless-stopped
    working_dir: /app
    # The audit callback in config.yaml is `proxy.audit_logger.CabinetAuditLogger`; PYTHONPATH=/app
    # + the proxy/ dir mounted at /app/proxy makes it importable (namespace package, no __init__.py).
    command: ["--config", "/app/proxy/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      PYTHONPATH: /app
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_MARGIN_PCT: ${LITELLM_MARGIN_PCT:-100}
      LITELLM_CAP_USD: ${LITELLM_CAP_USD:-50.0}
      DATABASE_URL: ${DATABASE_URL:-}
      # FW-096 audit_logger writes <root>/<slug>.jsonl → point at the proxy-audit subdir of the volume.
      LITELLM_AUDIT_LOG_ROOT: /data/logs/proxy-audit
      # Redis-backed cap-state (survives proxy restart so the daily cap can't reset on crash-restart).
      # NOTE: litellm budget↔redis wiring is version-specific — validate against the pinned image at deploy.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ../:/app/proxy:ro              # repo proxy/ → /app/proxy (audit_logger + config.yaml; code read-only)
      - ./data/logs:/data/logs          # shared audit volume — litellm writes proxy-audit/<slug>.jsonl
    depends_on:
      redis:
        condition: service_started
    networks: [backend]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Audit-server (FW-097, Spec 052 CTO#2) — separate service, separate port ───
  audit-server:
    build:
      context: ..                      # build context = proxy/ (COPYs audit-server/ + deploy/)
      dockerfile: deploy/Dockerfile.audit-server
    image: refslund-audit-server:fw121
    restart: unless-stopped
    environment:
      AUDIT_API_KEY: ${AUDIT_API_KEY:?set AUDIT_API_KEY in .env}
      # audit-server + ingest read LITELLM_AUDIT_LOG_ROOT as the PARENT of audit/ + proxy-audit/
      # (different level than the litellm callback above — both point into the same shared volume).
      LITELLM_AUDIT_LOG_ROOT: /data/logs
    volumes:
      - ./data/logs:/data/logs          # reads + APPENDS the SSOT audit/<slug>.jsonl (non-root, append-only)
    networks: [backend]
    expose: ["8000"]
    # Runs as the non-root `audit` user (set in the Dockerfile) — Spec 052 CTO#3.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Ingest sidecar — FW-096 proxy-audit stream → Spec 052 SSOT (periodic) ─────
  ingest:
    image: refslund-audit-server:fw121 # same image as audit-server; command overrides to the loop
    restart: unless-stopped
    command: ["/app/ingest-loop.sh"]
    environment:
      LITELLM_AUDIT_LOG_ROOT: /data/logs
      INGEST_INTERVAL: ${INGEST_INTERVAL:-60}
    volumes:
      - ./data/logs:/data/logs          # reads proxy-audit/, writes audit/ (hash-chained SSOT)
    depends_on:
      audit-server:
        condition: service_started      # ensure the image is built; ordering only
    networks: [backend]

  # ── Redis — per-cabinet daily-cap state (Spec 051 L209, survives restart) ─────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # ── Caddy — LOCAL origin reverse-proxy (Cloudflare terminates PUBLIC TLS) ──────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin-certs:/etc/caddy/origin-certs:ro   # Cloudflare Origin CA cert+key (provision.sh, chmod 600)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      litellm:
        condition: service_started
      audit-server:
        condition: service_started
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  # GDPR audit logs are a BIND mount (./data/logs, see services above) — NOT a named volume — so
  # provision.sh can chattr +a the audit/ SSOT (AC#7) on a known host path + the daily git-mirror
  # checkpoint (Spec 052) + backups can read it directly.
  redis-data:      # cap-state persistence
  caddy-data:      # Caddy state (origin cert store / OCSP)
  caddy-config:
