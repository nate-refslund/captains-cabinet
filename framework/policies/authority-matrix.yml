# Authority Matrix — the Captain authority matrix as DATA (the FLOOR).
#
# Canonical, Captain-readable policy document: risk-class rows × confidence-
# state columns → verdict. This is the FRAMEWORK FLOOR (germline, read-only to
# officers/loops). Presets may NARROW autonomy (never widen); the instance
# layer binds lanes → risk-classes and tunes per-cell bars within the floor.
# Merged by name via load_policies() (framework → preset → instance).
#
# Realizes docs/authority-matrix-design-2026-06-19.md §1 Component 1, §2 table,
# FIX-6 (deploy_nonprod/deploy_prod split — prod is always-gated, no carve-out),
# FIX-7 (all six HARD_CEILING_TOUCHES members covered), and the Reconciliation
# table. Validated by framework/authority/matrix.py against the ONE shared
# classifier enum (framework/authority/classifier.py ACTION_TYPES) and the
# code-level hard-ceiling backstop (framework/learning/capability_gaps.py
# HARD_CEILING_TOUCHES).
#
# FAIL-SAFE is the spine, in TWO postures since the trust-inversion ruling
# (CAPTAIN-RULING 2026-07-03/04 earn-demotion, REINFORCED + VERIFIED 2026-07-04,
# widened to the reversible beachhead by fix wave wsqzqfpt5):
#   * EARN-UP rows (internal_comms, deploy_nonprod, draft_only): until F
#     provides a per-cell confidence score, the cell is propose_only.
#   * TRUST-FIRST rows (reversible, pm_write, calendar_write → act_with_undo;
#     read_only_dispatch → notify_after): trust is GRANTED at unmeasured and
#     lost only on demotion EVIDENCE (demote → propose_only) — never pre-earned.
#     act_with_undo grants nothing by itself: the policy_engine allow-branch
#     grants it ONLY when action_undo.py registers a deterministic inverse for
#     the action_type AND the undo-journal path is reachable; otherwise the
#     call falls through to propose-only (Corridor-confirmed invariant).
# Hard-ceiling classes are always_gated regardless of confidence — F can never
# lift them. NO row maps a prod/ceiling class to auto. matrix.py's
# _validate_act_first_floor makes earn-up re-introduction on a trust-first row
# (propose_only@unmeasured) a hard validation error, so no future preset or
# instance merge can silently restore it.
version: 1
policies:
  - name: authority-matrix
    type: authority_matrix
    message: "Below the autonomy bar for this (lane × action-type) — proposing instead."

    # action_type -> risk_class. The action_type strings are the ENUM the shared
    # classify_action() emits and compute_ratios() keys cells on [FIX-1]. They
    # MUST equal the classifier's ACTION_TYPES minus the AMBIGUOUS backstop
    # (CI-asserted): an ambiguous/unknown action has NO risk_class and falls
    # through to propose-only (fail-safe).
    risk_classes:
      # reversible — act_with_undo (trust-first) since 2026-07-04 (fix wave
      # wsqzqfpt5, per the EARN-DEMOTION ruling): exactly the four kinds whose
      # deterministic inverse the undo plane can register. draft_only and
      # investigation_run MOVED OUT the same day — draft_only to its own
      # earn-up class (CAPTAIN-RULING: outbound-adjacent), investigation_run to
      # read_only_dispatch (read-only ⇒ no inverse exists or is needed, so
      # keeping it here would falsely claim reversibility-with-undo).
      reversible:
        action_types: [task_status_move, label, tier2_note, local_edit]
      read_only_dispatch:                                             # notify_after (read-only, act-and-tell)
        action_types: [investigation_run]
      draft_only:                                                     # CAPTAIN-RULING 2026-07-04: NOT widened (earn-up kept)
        action_types: [draft_only]
      pm_write:                                                       # act_with_undo (reversible-with-undo)
        action_types: [task_create, board_status]
      calendar_write:                                                 # act_with_undo (reversible-with-undo)
        action_types: [calendar_event_create]
      internal_comms:
        action_types: [internal_message, internal_email, officer_dispatch]
      external_comms:                                                 # HARD CEILING: external_comms
        action_types: [external_message, external_email]
      deploy_nonprod:
        action_types: [vercel_deploy_preview, git_push_nonmain]
      deploy_prod:                                                    # HARD CEILING: production
        action_types: [vercel_deploy_prod, git_push_main]
      spend:                                                          # HARD CEILING: spending
        action_types: [purchase, provision_paid, billing]
      secrets:                                                        # HARD CEILING: secrets
        action_types: [secret_read, secret_write, env_write]
      network_write:                                                  # HARD CEILING: network_write
        action_types: [mcp_post, mcp_put, mcp_delete]
      credentials_grant:                                              # HARD CEILING: credentials_grant
        action_types: [oauth_grant, token_grant]

    # Hard ceiling — always-gated regardless of confidence. MUST cover every
    # member of HARD_CEILING_TOUCHES (CI-asserted) [FIX-7].
    hard_ceiling: [external_comms, deploy_prod, spend, secrets, network_write, credentials_grant]

    # Map each hard_ceiling risk_class -> the HARD_CEILING_TOUCHES frozenset
    # member it satisfies. Coverage CI test asserts
    # set(ceiling_frozenset_map.values()) == HARD_CEILING_TOUCHES (the full six,
    # NOT a self-fulfilling "mappable subset") [FIX-7].
    ceiling_frozenset_map:
      external_comms: external_comms
      deploy_prod: production
      spend: spending
      secrets: secrets
      network_write: network_write
      credentials_grant: credentials_grant

    # Verdict table: risk_class -> { confidence_state -> verdict }.
    # confidence_state in {unmeasured, propose_only, eligible, graduated, demote}
    #                   (hard-ceiling rows use the "*" wildcard).
    # verdict in {auto, act_with_undo, auto_with_veto_window, notify_after,
    #            propose_only, always_gated, classifier}.
    # NO prod/ceiling cell may be `auto` (CI-asserted) [FIX-6]. NO trust-first
    # row may be propose_only at unmeasured (CI-asserted, invariant #3 —
    # matrix.py:_validate_act_first_floor).
    verdicts:
      # reversible — INVERTED 2026-07-04 (was earn-up: propose_only@unmeasured,
      # auto@graduated). EARN-DEMOTION doctrine: trust granted from day one,
      # lost on demotion evidence — mirrors the pm_write row below. The undo
      # journal (48h window, per-step undo handle on the receipt) is the
      # Captain's control surface; the engine still falls through to
      # propose-only for any action_type without a registered inverse.
      # Guarded by matrix.py:_validate_act_first_floor — propose_only@unmeasured
      # here is a hard validation error (no silent earn-up re-introduction).
      reversible:
        graduated: act_with_undo
        eligible: act_with_undo
        propose_only: act_with_undo
        unmeasured: act_with_undo
        demote: propose_only
      # read_only_dispatch — act-and-tell from day one (2026-07-04): the run is
      # READ-ONLY evidence gathering (PRO-7), so there is nothing to undo and
      # nothing to gate — the notification IS the oversight surface. Demotion
      # evidence still drops it to propose-only (an officer abusing dispatch
      # framing for writes is classifier/ceiling territory, not this row).
      read_only_dispatch:
        graduated: notify_after
        eligible: notify_after
        propose_only: notify_after
        unmeasured: notify_after
        demote: propose_only
      # CAPTAIN-RULING 2026-07-04: draft_only KEEPS the old reversible earn-up
      # ladder (Captain judgment — a draft is outbound-ADJACENT: its content
      # exists to leave the machine, so it earns autonomy rather than getting
      # it granted; actual sending stays behind the external_comms ceiling).
      draft_only:
        graduated: auto
        eligible: propose_only
        propose_only: propose_only
        unmeasured: propose_only
        demote: propose_only
      pm_write:                          # EARN-DEMOTION: trust granted, lost on evidence
        graduated: act_with_undo
        eligible: act_with_undo
        propose_only: act_with_undo
        unmeasured: act_with_undo
        demote: propose_only
      calendar_write:
        graduated: act_with_undo
        eligible: act_with_undo
        propose_only: act_with_undo
        unmeasured: act_with_undo
        demote: propose_only
      internal_comms:
        graduated: auto_with_veto_window      # + notify_after implied (the notification IS the veto handle)
        eligible: propose_only
        propose_only: propose_only
        unmeasured: propose_only
        demote: propose_only
      # CAPTAIN-RULING 2026-07-04: deploy_nonprod stays earn-up, deliberately
      # NOT widened in the trust-inversion wave (prod-adjacent: a preview
      # deploy/non-main push has no deterministic inverse and leaks build
      # output off-machine — Captain kept the classifier-gated earn-up path).
      deploy_nonprod:
        graduated: classifier                 # -> low-risk auto / else gated (NON-PROD target only) [FIX-6]
        eligible: classifier
        propose_only: propose_only
        unmeasured: propose_only
        demote: propose_only
      external_comms:    { "*": always_gated }
      deploy_prod:       { "*": always_gated }
      spend:             { "*": always_gated }
      secrets:           { "*": always_gated }
      network_write:     { "*": always_gated }
      credentials_grant: { "*": always_gated }

    # POSTURE TABLES — posture is a SELECTION dimension of this ONE matrix,
    # never a second enforcement story (sovereign build spec 2026-07-04 §0 +
    # §2.1). The root `verdicts` table above IS guardian and stays byte-frozen;
    # the validator REJECTS a `postures.guardian` key. Each entry below is a
    # FULL per-posture verdicts table — auditable whole, no overlay merging
    # (kills the widening-merge bug class). Posture SELECTION lives in the
    # Captain-locked instance/config/posture.yml (absent/corrupt/unlocked/
    # mismatched resolves guardian; env may only NARROW, never widen).
    # `standing_grant` on a hard-ceiling row means: auto IFF a Captain-signed,
    # schg-locked, unexpired, unrevoked standing grant with a satisfied
    # hard-scope predicate exists — else file a NEED and gate this step while
    # the chain proceeds. NO ceiling row is ever `auto` in ANY posture, and
    # demote is posture-invariant (every non-ceiling demote cell must equal
    # the root table's) — evidence beats posture.
    postures:
      # earn_up — L1, the cautious captain's start (axes spec 2026-07-05 §1,
      # leader-leader). STATIC floor: every non-ceiling class propose_only at
      # ALL five confidence states; the six ceilings stay always_gated (never
      # standing_grant — grants are a sovereign surface). ALL autonomy above
      # this floor comes from the trust-ladder overlay at run time (AX-2:
      # would-like-to → intend-to → ive-done → ive-been-doing, each rung
      # Captain-granted per lane), NEVER from this table. Machine-checked by
      # matrix.py:_validate_earn_up_narrows: earn_up may only narrow vs the
      # root/guardian table, which is what makes it selectable WITHOUT
      # attestation (narrowing is always safe).
      earn_up:
        verdicts:
          reversible:         { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          read_only_dispatch: { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          draft_only:         { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          pm_write:           { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          calendar_write:     { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          internal_comms:     { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          deploy_nonprod:     { graduated: propose_only, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          external_comms:     { "*": always_gated }
          deploy_prod:        { "*": always_gated }
          spend:              { "*": always_gated }
          secrets:            { "*": always_gated }
          network_write:      { "*": always_gated }
          credentials_grant:  { "*": always_gated }
      sovereign:
        verdicts:
          reversible:        { graduated: auto, eligible: auto, propose_only: auto, unmeasured: auto, demote: propose_only }
          # RECONCILE 2026-07-05: kept both — main's fix-wave risk-class split
          # (read_only_dispatch + draft_only moved OUT of reversible) + the
          # sovereign posture axis. The posture table must cover the FULL
          # RISK_CLASSES enum, so the two new rows are added here MIRRORING
          # the root/guardian rows (fail-safe: read_only_dispatch is already
          # act-and-tell — auto would drop the tell; draft_only keeps the
          # CAPTAIN-RULING 2026-07-04 earn-up ladder — outbound-adjacent, a
          # posture never silently widens a Captain-ruled row). Demote stays
          # posture-invariant (propose_only) per §2.1.
          read_only_dispatch: { graduated: notify_after, eligible: notify_after, propose_only: notify_after, unmeasured: notify_after, demote: propose_only }
          draft_only:        { graduated: auto, eligible: propose_only, propose_only: propose_only, unmeasured: propose_only, demote: propose_only }
          pm_write:          { graduated: act_with_undo, eligible: act_with_undo, propose_only: act_with_undo, unmeasured: act_with_undo, demote: propose_only }
          calendar_write:    { graduated: act_with_undo, eligible: act_with_undo, propose_only: act_with_undo, unmeasured: act_with_undo, demote: propose_only }
          internal_comms:    { graduated: notify_after, eligible: notify_after, propose_only: notify_after, unmeasured: notify_after, demote: propose_only }
          deploy_nonprod:    { graduated: notify_after, eligible: notify_after, propose_only: notify_after, unmeasured: notify_after, demote: propose_only }
          external_comms:    { "*": standing_grant }
          deploy_prod:       { "*": standing_grant }
          spend:             { "*": standing_grant }
          secrets:           { "*": standing_grant }
          network_write:     { "*": standing_grant }
          credentials_grant: { "*": standing_grant }

    # internal_comms deferred-send delay (Component 5). Open-decision #1: default 7 (spec range 5-10).
    veto_window_minutes: 7

    # Mechanical low-risk deploy classifier inputs (Component 6, NON-PROD only).
    deploy:
      safe_globs:
        - "**/*.md"
        - "docs/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "tsconfig.json"
        - ".eslintrc*"
      high_risk_globs:
        - "**/migrations/*.sql"
        - "**/schema*.sql"
        - "**/*_schema.*"
        - "auth/**"
        - "authentication/**"
        - "**/jwt/*"
        - "**/oauth*"
        - "payment*"
        - "stripe/**"
        - "billing/**"
        - "**/checkout*"
        - "**/subscription*"
        - "neon.json"
        - "**/neon/**"
        - "vercel.json"
        - ".vercelignore"
        - ".env*"
        - "policies/**"
        - "framework/schemas-base.sql"
        - "cabinet/init.sql"
        - "presets/*/schemas.sql"

    # Per decision-type graduation bar (irreversible types carry a higher bar).
    # F2's graduation.evaluate IMPORTS these -- it does NOT hardcode its own
    # [FIX-1 reconcile]. Open-decision #2.
    bars:
      default:        { match_rate: 0.85, samples: 20, max_divergent_last10: 1, recency_clean_days: 14 }
      internal_comms: { match_rate: 0.90, samples: 30, max_divergent_last10: 0, recency_clean_days: 21 }
      deploy_nonprod: { match_rate: 0.95, samples: 30, max_divergent_last10: 0, recency_clean_days: 21 }

    # Anti-flap cooldown for a demoted cell (Component 4). Open-decision #3.
    cooldown_days:
      default: 14
      internal_comms: 21
      deploy_nonprod: 21
