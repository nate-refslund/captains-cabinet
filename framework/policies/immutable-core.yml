# immutable-core.yml — THE single source of Ring-0 paths (FI-5, sovereign spec
# docs/plans/sovereign-build-spec-2026-07-04.md §1/§4 SOV-9).
#
# Ring-0 = the enforcer + judge plane: every path an officer/loop must never
# write, because writing it would forge a judge, widen an act surface, or
# disable the perimeter itself. Two consumers, both read-only:
#
#   1. gate.ratify S0 (framework/learning/gate.py, SOV-8): REFUSES any
#      self-improvement code-diff that touches ANY entry in this file —
#      every class, not just the locked ones. Germline changes reach the
#      tree only via a Captain amendment in an unlock window, never via the
#      gate. (eval-019.)
#   2. framework/tests/test_germline_lockstep_consistency.py: drives the four
#      germline enforcement lists off this enumeration and diffs them — the
#      single mechanism for every germline-list addition (SOV-C8). The four
#      lists, by the names used in `pending:` below:
#        germline-lock  cabinet/scripts/germline-lock.sh  FILES/DIRS/SKIP arrays
#        hook-s5        cabinet/scripts/hooks/pre-tool-use.sh §5 germline case arm
#        hook-s5b       cabinet/scripts/hooks/pre-tool-use.sh §5b GERM_PATH_RE
#        base-safety    framework/policies/base-safety.yml germline-readonly patterns
#
# CLASSES describe the filesystem-lock discipline ONLY (gate refusal covers
# all of them equally):
#   files             — schg-locked single files (germline-lock FILES).
#   dirs              — schg-locked -R directories (germline-lock DIRS); any
#                       path under one is Ring-0 by dir-cover, including this
#                       file itself (framework/policies/ ⇒ auto-covered by all
#                       four lists — no list additions needed for it).
#   runtime_appended  — hook-blocked for direct officer Edit/Write/bash writes
#                       but DELIBERATELY NOT schg-locked (germline-lock SKIP):
#                       a sanctioned same-uid Python API appends at runtime
#                       (veto_registry.py / action_lessons.py / needs.py / the
#                       evidence recorder). Entries may be one file or a
#                       trailing-slash runtime directory.
#                       Locking these breaks the demotion/learning/needs loops;
#                       forging one only demotes or records — fail-safe.
#   hook_protected    — hook/policy-blocked Captain-owned instance config that
#                       is not lock-listed (file is deployment-created; hard
#                       ceilings carry a code backstop in capability_gaps.py).
#
# `pending:` names the lists an entry is NOT wired into yet — the mechanism
# for FUTURE germline additions: enumerate here first (pending all four),
# wire each list, delete the flag in the same commit, and the meta-test's
# xfail for that pair flips into a hard assert. As of the sovereign-posture
# amendment (2026-07-05) every entry is fully wired (no pending remain): the
# new sovereign germline files entered all four lists and the enforcer-triad
# base-safety lag was closed. The cabinet-axes amendment (2026-07-05) keeps
# that state: its new set entered all four lists in the same change (and
# cleared axes-allowlist.yml's `pending: AX-8` flag — eval-020's flip
# discipline). An entry with no `pending` is asserted hard.
#
# EDIT DISCIPLINE: this file is itself Ring-0 (dir-cover). Officers/loops
# propose changes to the Captain; only the Captain applies them in a
# germline-lock unlock window.

version: 1

# Canonical vocabulary for `pending:` values — the meta-test validates against
# this exact set.
lists: [germline-lock, hook-s5, hook-s5b, base-safety]

files:
  # --- enforcer plane: forging any of these disables/subverts the perimeter.
  #     In germline-lock FILES + hook §5/§5b since 2026-07-04; base-safety
  #     lag closed by the sovereign amendment ("enforcer-triad lag closure"). ---
  - path: .claude/settings.json
  - path: cabinet/scripts/policy-shadow.py
  - path: cabinet/scripts/kill-switch.sh
  - path: cabinet/scripts/germline-lock.sh

  # --- judged authority code (grants authority / renders judgment) ---
  - path: framework/authority/classifier.py
  - path: framework/authority/lane.py
  - path: framework/authority/matrix.py
  - path: framework/authority/veto.py
  - path: framework/authority/deploy_classifier.py
  - path: framework/fidelity/graduation.py
  - path: framework/authority/policy_engine.py
  - path: framework/frontdoor/action_exec.py
  - path: framework/frontdoor/action_undo.py
  - path: framework/frontdoor/actfirst_canary.py
  - path: framework/frontdoor/veto_registry.py
  - path: framework/frontdoor/tell_surface.py
  - path: framework/frontdoor/calendar_template.py
  - path: framework/acting/action_lane.py
  - path: framework/acting/run_action_lane.py

  # --- ONE-DOOR transport floor (attention-gateway P3, 2026-07-09,
  #     cp-final review): the allow_sends gate + token scrub + feed
  #     journaling moved INTO channel.py, and situation/feed/acted_overlay
  #     feed the suppression + act-once judgments — an officer edit to any
  #     of them widens its own send/quiet surface. Wired into all four
  #     lists in the same change (lockstep). ---
  - path: framework/frontdoor/channel.py
  - path: framework/attention/situation.py
  - path: framework/attention/feed.py
  - path: framework/attention/acted_overlay.py

  # --- WAR-ROOM census + admission plane (command-center Stage 1,
  #     2026-07-10): situations/queue decide WHAT THE CAPTAIN SEES (the
  #     situation fold, the admission law, the ranked census every skin
  #     renders); hygiene RETIRES cards/streams (closure verb); queue_card
  #     is a standing Captain-DM sender. An officer edit to any of them
  #     re-weights its own visibility or silently closes its own asks —
  #     judge-plane by construction. Wired into all four lists in the same
  #     change (lockstep). Files land via the master merge; the lock skips
  #     absent paths until then. ---
  - path: framework/attention/situations.py
  - path: framework/attention/queue.py
  - path: framework/attention/hygiene.py
  - path: framework/attention/queue_card.py

  # --- judged config (NOT runtime-written) + rules ---
  - path: instance/config/act-first-surfaces.yml
  - path: cabinet/mcp-scope.yml
  - path: cabinet/officer-capabilities.conf
  - path: .claude/rules/brain-bridge.md
  - path: .claude/rules/courses-of-action.md

  # --- NEW sovereign-posture germline (amendment §5 new-file set) — code that
  #     resolves posture, mints/loads grants, or applies gate output. Wired
  #     into all four lists by the sovereign amendment (2026-07-05). ---
  - path: framework/authority/posture.py
  - path: framework/authority/grants.py
  - path: framework/authority/needs.py
  - path: framework/learning/gate.py
  - path: framework/learning/apply_watch.py
  - path: cabinet/scripts/grant-apply.sh
  # ROOT-EXECUTED apply lane (D15, SOV-9a): cmd_apply/cmd_watch run as root
  # (the Captain's `sudo bash gate-apply.sh apply` + the DARK
  # com.cabinet.gate-apply daemon), and the plist's ProgramArguments run as
  # root on load — forging either turns an officer write into root code.
  # The watch ledger is files-class, NOT runtime_appended: cmd_watch executes
  # each row's revert_plan as a root `git apply -R`, so a forged row MINTS a
  # root write — the runtime_appended fail-safe rationale (forge only
  # demotes/records/files) does not hold. Born at the first Captain-armed
  # apply; enumerated + wired before it exists (germline-lock skips absent).
  - path: cabinet/scripts/gate-apply.sh
  - path: cabinet/launchd/com.cabinet.gate-apply.plist
  - path: shared/interfaces/gate-apply-watch.jsonl
  # Captain-locked posture selection + ceiling grants (FI-1/FI-2). Created per
  # deployment at apply time (§8 step 5), locked in step 7 — enumerated now so
  # the lists are wired before the files ever exist.
  - path: instance/config/posture.yml
  - path: instance/config/standing-grants.yml
  # This enumeration itself: dir-covered by framework/policies/ in all four
  # lists already — the meta-test asserts that hard today (FI-5 auto-cover).
  - path: framework/policies/immutable-core.yml

  # --- CABINET-AXES germline (amendment 2026-07-05, docs/proposals/
  #     germline-amendment-cabinet-axes-2026-07-05.md): the axes contract's
  #     kernel surfaces. trust_ladder.py is the earn_up rung-ladder overlay —
  #     a forged rung map LIFTS verdicts (mints authority), exactly the
  #     judged-authority-code class (this entry also clears the
  #     `pending: AX-8` flag on its axes-allowlist.yml row — eval-020).
  #     The allowlist + linter pair IS the sanctioned branching surface
  #     (widening it must be a Captain act); the extension manifest schema +
  #     validate-extension.sh are the captain-instance gate (a forged schema
  #     or gate script admits axis-branching extensions). ---
  - path: framework/learning/trust_ladder.py
  # dir-covered by framework/policies/ (like immutable-core.yml itself);
  # enumerated so eval-020's allowlist ⊆ immutable-core check is explicit.
  - path: framework/policies/axes-allowlist.yml
  - path: .claude/rules/axes-contract.md
  - path: framework/schemas/extension-manifest.schema.json
  - path: cabinet/scripts/validate-extension.sh
  # Captain-locked live rung grants (created at the first `grant rung` —
  # deployment-created like posture.yml; germline-lock skips absent). Rung
  # grants MINT authority (propose_only → … → auto per cell), so the live
  # file is files-class, never SKIP; instance/config/trust-ladder.yml.example
  # stays unlocked (suffix-anchored hook arms + exact-path lock don't match).
  - path: instance/config/trust-ladder.yml

  # --- EVIDENCE RECORDER v1 trusted integration seam (2026-07-15): the
  #     canonical onboarding writer and the server-side Dashboard/Telegram
  #     seams are part of the audit plane. If an officer can rewrite one, it
  #     can suppress or counterfeit the evidence about its own work. The
  #     browser observation payload remains explicitly untrusted, but its
  #     shipped collection seam is protected against officer mutation. ---
  - path: framework/onboarding/journey.py
  - path: framework/schemas/evidence-event.schema.json
  - path: cabinet/dashboard/src/lib/onboarding/bridge.ts
  - path: cabinet/dashboard/src/lib/onboarding/telegram.ts
  - path: cabinet/dashboard/src/app/api/telegram/provisioning-webhook/route.ts
  - path: cabinet/dashboard/src/components/onboarding/journey-card.tsx
  - path: cabinet/companion/main.swift
  - path: cabinet/scripts/evidence-read.sh
  # DELIBERATELY NOT ENUMERATED: instance/config/posture-narrow — the
  # narrow-only runtime cap (single word guardian|earn_up) read by
  # resolve_posture as a CAP after file+env resolution. It can only NARROW
  # (min by permissiveness), so tampering is fail-safe by construction, and
  # the Captain's binder verb writes it at runtime — locking or hook-blocking
  # it would break the instant-downgrade surface (axes spec §1).
  # ALSO NOT ENUMERATED: cabinet/scripts/generate-services-cron.py — renders
  # operational schedule rows only (no verdict/grant/authority content),
  # render-only (never installs); same class as its unlocked launchd twin
  # generate-plists.py. Justified in the cabinet-axes amendment doc.

dirs:
  - path: cabinet/scripts/hooks/
  - path: framework/policies/
  - path: memory/golden-evals/
  # D8: the instance policy-layer dir joins the germline/schg set so no officer
  # can drop a widening policy layer (load_policies refuses matrix overrides;
  # the lock closes the file-drop vector too).
  - path: instance/config/policies/
  # Cabinet-axes (2026-07-05): the shipped posture presets are pre-filled
  # axis points captains copy into posture.yml — a forged preset seeds a
  # widened ruling at the very moment a captain ratifies one, so the dir is
  # locked -R like the policy layer (no officer may drop or edit a preset).
  - path: instance/config/posture-presets/
  # The recorder, independent verifier, redactor, repair policy, and bounded
  # Captain CLI are one audit-plane package. The Dashboard API directory is
  # its server-side transport seam (including tests that pin the contract).
  - path: framework/evidence/
  - path: cabinet/dashboard/src/app/api/onboarding/

runtime_appended:
  - path: shared/interfaces/captain-vetoes.yml
  - path: shared/interfaces/action-lessons.yml
  # ONE needs-ledger (FI-3): O_APPEND JSONL written by needs.py; DATA is
  # SKIP-class, the CODE (needs.py above) is locked.
  - path: shared/interfaces/needs-ledger.jsonl
  # Sanctioned append/purge only through EvidenceRecorder. Direct officer
  # writes are blocked by both hook paths and typed policy; schg would break
  # append, recovery, retention, export, and Captain-typed purge.
  - path: instance/evidence/v1/

hook_protected:
  - path: instance/config/autonomy.yml
