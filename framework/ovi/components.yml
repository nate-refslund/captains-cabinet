version: 2
# OVI (Outcome Value Index) — weighted multi-component composite measuring
# organizational outcome value. Weighted sum, normalized 0–1, weekly snapshot.
#
# Phase 1.3 (2026-05-26): Default data source is the event ledger via
# `framework.ovi.compute.gather_from_events()`. The legacy `database` SQL
# queries below remain as Phase 1.2+ targets — once mission_supervisor.sh
# persists missions/work_graph_nodes to Postgres, those queries become the
# faster, indexed path. Until then, event-replay is authoritative.

components:
  - name: task_throughput
    description: "Tasks completed per measurement period"
    weight: 0.25
    source: events
    direction: normal
    default_range: [0, 50]
    derivation: "count(work_item_completed events in window)"
    legacy_db_query: "SELECT count(*) FROM work_graph_nodes WHERE status='done' AND completed_at > NOW() - interval '7 days'"

  - name: outcome_progress
    description: "Fraction of touched outcomes with at least one task completed"
    weight: 0.30
    source: events
    direction: normal
    default_range: [0, 1]
    derivation: "|outcomes_with_completion| / |outcomes_touched| (mission_created OR work_item_completed)"

  # ATTENTION WELL SPENT (Captain ruling 2026-07-25; polarity fixed 2026-07-26).
  #
  # WAS: `captain_attention_cost`, weight 0.20, direction INVERSE, range [0,20]
  # — "Captain interventions required (fewer = better)". That treated the
  # Captain as a cost to minimise, which is the formal opposite of working
  # together with him. Measured consequence on the real ledger: the term read a
  # perfect 1.00 in EVERY window — 7d, 30d and 365d — including a 7d window
  # with 0.0 throughput and 0.0 verification. A week of delivering nothing and
  # never once speaking to the Captain scored full marks on this term. The
  # cabinet has emitted ZERO captain_* events in its entire life (0 of 43,894),
  # so 1.00 was not a lucky reading — it was the only reading the term could
  # ever produce.
  #
  # NOW: the share of the Captain's spent attention that went on decisions only
  # he could make. Under-asking is a failure exactly as much as over-asking, so
  # BOTH ends read 0.0 and only genuinely well-spent attention reads 1.0:
  #   * no contact at all      -> 0.0  the org went quiet / decided for him
  #   * contact, none of it his -> 0.0  the org spent his minutes on noise
  #   * contact, all of it his  -> 1.0  every minute was a decision only he could make
  # Silence is NOT safe and no longer scores as if it were.
  #
  # RIDER (standing, Captain 2026-07-25): OVI is a Captain-FACING instrument
  # and must NEVER become a selection input. Enforced by
  # framework/tests/test_ovi_never_a_selection_input.py.
  - name: captain_attention_well_spent
    description: "Share of spent Captain attention that went on decisions only he could make (0.0 when the org never asked at all — going quiet is a failure, not a win)"
    weight: 0.20
    source: events
    direction: normal
    default_range: [0, 1]
    derivation: "decisions / (decisions + captain_gate_bounced) in window, where decisions = count(captain_decision_logged + captain_boundary_set + captain_outcome_ratified + captain_goal_declared); 0.0 when there was NO Captain contact at all"
    legacy_db_query: "SELECT count(*) FROM decision_log WHERE decided_at > NOW() - interval '7 days'"

  - name: learning_rate
    description: "Novel experience records per DAY (window-invariant rate)"
    weight: 0.15
    source: events
    direction: normal
    default_range: [0, 5]
    derivation: "count(experience_recorded events in window) / window_days (per-day rate; §4.2 growth-metrics fix 2026-07-09 — range rescaled from 0-30/window to 0-5/day)"
    legacy_db_query: "SELECT count(*) FROM experience_records WHERE created_at > NOW() - interval '7 days'"

  - name: verification_pass_rate
    description: "Completed tasks passing verification vs total completed"
    weight: 0.10
    source: events
    direction: normal
    default_range: [0, 1]
    derivation: "count(work_item_verified) / count(work_item_completed) in window; 0 if no completions"
