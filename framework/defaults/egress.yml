# =============================================================
# Captain's Cabinet — Egress Allowlist (framework default)
# =============================================================
# OPT-IN enforced outbound-network allowlist for the officer runtime.
#
# SHIPPED DEFAULT = ALLOW ALL. `enforce: false` means NO restriction is
# installed and officers reach the network exactly as they do today. Nothing
# in this file changes behaviour until a captain sets `enforce: true` (via the
# override twin instance/config/egress.yml.example during Captain provisioning).
#
# WHY THIS EXISTS
#   Officers ingest untrusted content (email, web pages, Sentry issues) AND
#   hold outbound tools (Bash curl/wget, web MCPs, python requests). With no
#   egress boundary a single prompt-injected instruction can move captain-
#   private data off-box. This control lets a captain deny outbound egress by
#   default and permit only an explicit allowlist — the classic containment
#   posture. The live instance override becomes Captain-owned germline policy.
#
# HOW ENFORCEMENT WORKS (only when enforce: true)
#   `cabinet/scripts/egress-guard.sh apply` starts a small local forward proxy
#   (cabinet/scripts/egress-proxy.py — python3 stdlib, bound to 127.0.0.1) that
#   permits HTTP CONNECT + HTTP forwarding ONLY to resolved-allowlist hosts and
#   returns 403 for everything else, then writes an HTTP_PROXY/HTTPS_PROXY/
#   NO_PROXY export file loaded by both officer launchers. This catches curl,
#   python-requests, and every MCP/client that honours proxy env vars. The Mac
#   launcher additionally installs a Seatbelt rule denying direct external
#   TCP/UDP, so raw socket bypasses fail at the kernel boundary.
#
#   FAIL-CLOSED: if the proxy cannot be installed or verified, the guard errors
#   non-zero and installs NOTHING (it never silently leaves egress open when a
#   captain asked to enforce).
#
#   HONEST RESIDUAL: Linux/Docker has no Seatbelt equivalent here, so raw
#   sockets need a host/container network policy. Existing sessions require a
#   restart, and localhost services remain outside the officer boundary.
#   Full coverage-vs-residual: docs/runbooks/egress-allowlist.md.
#
# OVERRIDE MODEL
#   Instance config wins over this framework default (same pattern as
#   framework/defaults/spending-limits.yml). Copy instance/config/
#   egress.yml.example -> instance/config/egress.yml during provisioning. Once
#   locked, enable/disable require the Captain unlock/edit/relock ceremony.
#   MERGE RULES: `enforce`, `proxy_port`, `allow_product` are scalar — the
#   instance value replaces this default. `allow_hosts` is UNIONED (the
#   framework floor below always survives) so enabling enforcement can never
#   accidentally sever the officer<->captain control plane.
# =============================================================

# Master switch. false = allow all (no restriction installed — the default).
# true = install the allowlisting proxy and FAIL CLOSED if it cannot be verified.
enforce: false

# Local forward-proxy bind port (always 127.0.0.1). Only consulted when
# enforce: true. Change if 8899 collides on your box. macOS requires a fixed
# 1–65535 value because launchd crash/login restarts must preserve the endpoint
# already projected to officers. Value 0 is legacy child/test mode only.
proxy_port: 8899

# Auto-include the captain's OWN product hosts, resolved generically from THIS
# deployment's instance config: the `org_domains` list in
# instance/config/platform.yml (else product.yml / nested product.org_domains)
# — the same source framework/env.py org_domains() reads. Each domain and its
# subdomains are allowed (suffix match), so e.g. `acme.example` also covers
# `xtest.acme.example`. NO captain- or industry-specific host is hardcoded in the
# framework; a deployment with no org_domains simply contributes none.
allow_product: true

# Always-needed control-plane hosts every deployment requires, regardless of
# captain or industry. Deliberately minimal — this is the floor, not a
# convenience list. If you enable enforcement, ADD the hosts your own MCPs and
# tools call (exa/perplexity/brave/vercel/neon/monday/github/...): see the
# runbook's host table. Officers needing more will 403 until you add them.
allow_hosts:
  - api.anthropic.com     # Claude API — the officer runtime itself
  - api.telegram.org      # Captain<->officer control channel (approvals, SOS)
