    scope: all_officers
    added: 2026-06-24
    added_by: cos
    excerpt: "Before changing any SHARED resource multiple consumers depend on (Make scenario/webhook, shared pipe/lib, proxy, fleet-read DB), ENUMERATE its consumers first (assume more than you can see). Prefer an ADDITIVE/CLONE change over modifying in place. After any change, VERIFY existing consumers still work. Never break what's working because you didn't know all the consumers."
    full_ref: shared/interfaces/captain-patterns.md#P-Protect-Shared-Infra
  - id: P-Report-State-Once
    source: captain-patterns.md
    section: pattern
    title: "Report current state once, never re-stale"
    trigger_words: ["pipe health", "broke", "dead token", "stale", "resolved", "fixed long ago", "already reported", "re-surface", "remind again", "health item", "delete the stale fact"]
    scope: all_officers
    added: 2026-06-25
    added_by: cos
    excerpt: "Once any health/infra/status item is RESOLVED and reported once, NEVER re-mention it to Nate. If a stale 'X broke / dead token' fact keeps prompting the mention, DELETE the stale fact at its source (the screenpipe memory store) — don't keep 'correcting' it. Reading a 'broke/stale' fact → verify current state; if resolved, stay SILENT. Surface a health item ONLY on a NEW, currently-true failure — never as a resolved-status correction."
    full_ref: shared/interfaces/captain-patterns.md#P-Report-State-Once
  - id: P-Verify-And-Fix
    source: captain-patterns.md
    section: pattern
    title: "Verify and fix before escalating"
    trigger_words: ["doesn't work", "broken", "dead token", "rotate", "needs rotation", "access lacking", "403", "blocked deploy", "failing integration", "root cause", "verify", "escalate", "founder-action"]
    scope: all_officers
    added: 2026-06-25
    added_by: cos
    excerpt: "For ANY 'doesn't work' (missing access, dead/needs-rotation token, broken pipe, blocked deploy, failing integration) — never forward the symptom or an officer's claim. (1) deep-dive to the REAL root cause, (2) VERIFY by testing (never infer), (3) ship a PROPER durable fix (no quickfixes), (4) verify the fix. Also CHECK the decision trail (already decided/removed/killed?). Escalate ONLY the genuine residual that only the Captain can provide, framed as 'here's what was wrong + the fix I shipped' or 'I dug in fully and I'm blocked on X.'"
    full_ref: shared/interfaces/captain-patterns.md#P-Verify-And-Fix
  - id: proposals-are-actual-work
    source: captain-patterns.md
    section: operating-posture
    title: "Proposals carry the actual work, not just PM/tracking"
    trigger_words: ["create a task", "create the task", "add to backlog", "monday task", "just create", "actionable proposal", "solve the task", "fix the task", "action proposal", "PM", "PO", "track it", "look into it"]
    scope: all_officers
    added: 2026-07-03
    added_by: cos
    excerpt: "Every action proposal must carry the EXACT steps that SOLVE the task, so the Captain's approve = the task is actually done — not just a tracking card. Route the situation to the owning lane, which returns the exact solution (entity + precise change + per-step gate); read-only verify first, high-blast steps Captain-gated. Not 'look into it' — the ready solution."
    full_ref: shared/interfaces/captain-patterns.md#proposals-are-actual-work
