schema_version: cognitive-phase-rollback/v1
phase: COG-2
# S0 pin (§12.1): origin/master at COG-2 implementation start == the parent of
# the first implementation commit (unit 1, 7f44a3ed) == the phase-2 contract
# commit. The extended files restore here; restoring
# cabinet/config/cognitive-architecture-contract.yml to it removes the COG-2
# temporary_allowances rows (allowance_removal below). Self-ratified per the
# 2026-07-07 full-autonomy grant + the 2026-07-20 cognitive-masterplan grant.
baseline_sha: b393f41b579c5ff4723f4502b006df58e9664cf1

# --- closed-range footprint seal (C1 retrofit, 2026-07-23) --------------------
# The committed-footprint ratchet closes over a CLOSED range
# baseline_sha..done_flip_sha, so it never sweeps LATER phases' commits into the
# COG-2 footprint. The open-ended baseline_sha..HEAD range is the named
# anti-pattern (BACKLOG :1551-1555; contract §16): once COG-3/COG-4 landed,
# `git diff baseline..HEAD` picked up their edits (e.g. .gitleaks.toml, modified
# by cog3 wave 3 at 61e1f87a) and this un-extendable prior-phase manifest RED'd
# on a full clone. done_flip_sha is the COG-2 DONE-FLIP commit — the ledger row
# COG-2 → done ("phase-complete shipped") — the exact end of the COG-2 footprint.
# Derived from git history 2026-07-23 (baseline_sha..754998f8 = exactly the
# 46-file COG-2 footprint, zero strays).
done_flip_sha: 754998f8174e8e092d3f14663d10ccf33dbb9861

# --- runtime inverses (§12.4 — each ONE command, no data surgery) ------------
# COG-2 is shadow-only (contract Runtime posture): it writes NO authoritative
# store, emits NO events, adds NO services.yml row, edits NO germline path, and
# is imported by NO authority/action code. So unlike COG-1's live cutover the
# runtime footprint is only a DISPOSABLE projection + an additive read-only DB
# role + a read pointer that is `none` for the entire phase — every inverse is
# safe by construction, never a careful ordered cutover.
runtime_inverses:
  - name: read_pointer
    command: >-
      echo none > ~/.cabinet/state/cog2-read-pointer
    effect: >-
      force the shadow read pointer to `none` — no consumer reads Cortex. The
      pointer is `none` for the ENTIRE phase (§9 risk 8), so this is the
      fail-safe default, not a cutover to invert; the shadow never becomes a
      second authority
    reversible_by: >-
      (no forward cutover exists this phase — the read pointer never leaves
      `none`; a later consumer-wiring phase owns any forward flip and its own
      inverse)
  - name: projection
    command: rm -rf cabinet/cache/cortex
    effect: >-
      delete the disposable belief projection (beliefs.jsonl + the SQLite query
      index + fold-manifest.json). ALWAYS SAFE BY CONSTRUCTION at a frozen
      source state (§7.3 retention contract) — the projection is a pure function
      of the authoritative sources and loses nothing on delete
    reversible_by: >-
      python3.12 cabinet/scripts/cog2-rebuild.py --dsn <outbox> --cache-dir cabinet/cache/cortex
  - name: provision_ro
    command: >-
      psql "<outbox-admin-dsn>" -c 'DROP ROLE IF EXISTS cortex_ro'
    effect: >-
      drop the read-only shadow role (SELECT-only on officer_tasks_outbox +
      officer_tasks, §7.2). Additive and idempotent, so the drop is clean and
      no authoritative row is touched
    reversible_by: python3.12 cabinet/scripts/cog2-rebuild.py --provision-ro

# --- code inverse: remove new COG-2 files -------------------------------------
# The COG-2 footprint: the committed units 1-4 (baseline_sha..HEAD "A") plus the
# unit-5 landing wave (working-tree new files, committed in the landing commit).
# cabinet/scripts/tests/test_cognitive_phase2_rollback.py::
# test_manifest_covers_committed_cog2_footprint is the ratchet that catches an
# un-extended manifest against the ACTUAL committed footprint.
