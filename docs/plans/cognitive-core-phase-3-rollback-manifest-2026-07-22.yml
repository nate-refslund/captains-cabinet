schema_version: cognitive-phase-rollback/v1
phase: COG-3
# S0 pin (§12.1): origin/master at COG-3 implementation start == the parent of
# the first implementation commit (wave 1, 83009ce1) == the phase-3 contract
# commit (b2890f19, which added the contract doc + opened the COG-3 ledger row).
# The extended files restore here; restoring
# cabinet/config/cognitive-architecture-contract.yml to it removes the COG-3
# temporary_allowances rows (allowance_removal below). Self-ratified per the
# 2026-07-07 full-autonomy grant + the 2026-07-20 cognitive-masterplan grant.
baseline_sha: b2890f19e1be2c4a267659e61f1bb8f216e57dca

# --- closed-range footprint seal (C1 retrofit, 2026-07-23) --------------------
# The committed-footprint ratchet closes over a CLOSED range
# baseline_sha..done_flip_sha, so it never sweeps LATER phases' commits into the
# COG-3 footprint. The open-ended baseline_sha..HEAD range is the named
# anti-pattern (BACKLOG :1551-1555; contract §16): once COG-4 landed, `git diff
# baseline..HEAD` picked up its edits and this manifest RED'd on a full clone.
# done_flip_sha is the COG-3 DONE-FLIP commit — the ledger row COG-3 → done
# ("phase-complete shipped") — the exact end of the COG-3 footprint. Derived
# from git history 2026-07-23 (baseline_sha..e7f95d5a = exactly the 65-path
# COG-3 footprint, 50 added + 15 modified, zero strays; the flip commit itself
# touches only the two retained operative ledgers).
done_flip_sha: e7f95d5aeced91ea30a0099ea08820bf60a69706

# --- runtime inverse (§12.4 — ONE command, no data surgery) ------------------
# COG-3 (the "Objectives" causal graph) is shadow-only (contract §1 / §7.2): it
# writes NO authoritative store, emits NO events, adds NO services.yml row, edits
# NO germline path, is imported by NO authority/action code, and — UNLIKE COG-2 —
# creates NO read-pointer file (§7.4: no pointer this phase; its mere existence is
# a verify-cognitive-phase3.sh tripwire) and adds NO Postgres role (§2.1: no new
# reads/roles; cortex_ro inherited transitively). So the ONLY runtime footprint is
# a DISPOSABLE projection cache — every inverse is safe by construction.
runtime_inverses:
  - name: objectives_cache
    command: rm -rf cabinet/cache/objectives
    effect: >-
      delete the disposable objectives projection cache — graph.jsonl +
      graph-manifest.json + the objectives-index.sqlite3 AND the predictions/ +
      counterfactuals/ subtrees. ALWAYS SAFE BY CONSTRUCTION (§7.3 delete-cache-
      always-safe): the canonical graph is a pure function of the authoritative
      roots + cortex store and loses nothing on delete; the ONE honest consequence
      is forecast-history loss under predictions/ (§4.3 — expendable in shadow by
      declaration, durable re-home is a named flip-time obligation) and each
      counterfactuals/<digest>/ branch is separately replayable
    reversible_by: >-
      python3.12 cabinet/scripts/cog3-rebuild.py --cutoff <canonical-ts>
      --cache cabinet/cache/objectives

# --- code inverse: remove new COG-3 files -------------------------------------
# The COG-3 footprint: the committed waves 1+3 (baseline_sha..HEAD "A") plus the
# wave-4 phase-complete landing (working-tree new files, committed in the landing
# commit). framework/objectives + framework/schemas/domains/objectives are named
# as DIRECTORIES (wholesale) so the sibling-built adapters/ subtree
# (framework/objectives/adapters/*, absent at THIS clone but present post-
# integration) is deleted with the rest — the §12.4 "delete framework/objectives/"
# instruction. cabinet/scripts/tests/test_cognitive_phase3_rollback.py::
# test_manifest_covers_committed_cog3_footprint is the ratchet that catches an
# un-extended manifest against the ACTUAL committed footprint (dir-prefix aware).
remove:
  # framework surface (DIRS — wholesale, incl. the sibling-built adapters/):
  - framework/objectives
  - framework/schemas/domains/objectives
  # Committed COG-3 scripts + instruments (waves 1/2, baseline_sha..HEAD "A"):
  - cabinet/scripts/cog3-rebuild.py
  - cabinet/scripts/cog3-graph-hash.py
  - cabinet/scripts/cog3-staleness.py
  # Committed COG-3 tests-first corpus (wave 3, baseline_sha..HEAD "A"):
  - cabinet/scripts/tests/lib_cog3_fixtures.py
  - cabinet/scripts/tests/lib_cog3_import_ast.py
  - cabinet/scripts/tests/lib_cog3_no_scalar.py
  - cabinet/scripts/tests/test_cog3_adapters.py
  - cabinet/scripts/tests/test_cog3_census_wall.py
  - cabinet/scripts/tests/test_cog3_exit_fixtures.py
  - cabinet/scripts/tests/test_cog3_import_gate.py
  - cabinet/scripts/tests/test_cog3_no_scalar_ratchet.py
  - cabinet/scripts/tests/test_cog3_objectives_ast_pin.py
