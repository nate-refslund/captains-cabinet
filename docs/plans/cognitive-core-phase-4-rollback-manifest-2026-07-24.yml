# --- runtime inverse (§16 — ONE command, no data surgery) ---------------------
# COG-4 is SHADOW-ONLY (contract §1/§7): the scheduler holds no authority, the
# dispatcher executes nothing, and NO pointer file exists this phase —
# ~/.cabinet/state/cog4-dispatch-pointer existing AT ALL is a
# verify-cognitive-phase4.sh tripwire (§7.3; the COG-3 §7.4 idiom), so there is
# no pointer to invert. The ONLY runtime footprint is the disposable scheduler
# projection cache; the inverse is safe by construction.
runtime_inverses:
  - name: scheduler_cache
    command: rm -rf cabinet/cache/scheduler
    effect: >-
      delete the disposable shadow-scheduler cache — snapshot.json +
      schedule.jsonl + schedule-manifest.json + the shadow decision log.
      ALWAYS SAFE BY CONSTRUCTION (§7.1-§7.2): the snapshot and schedule are
      pure functions of DECLARED versioned inputs (cortex/objectives manifest
      hashes, organ registry hash, services manifest hash, versioned
      parameters — never env/clock), so delete->rebuild reproduces the
      identical chained hash (the N1 gate). The ONE honest loss is the shadow
      decision record (would_dispatch/refused rows) — expendable in shadow by
      declaration (§16), stated here.
    reversible_by: >-
      python3.12 cabinet/scripts/cog4-snapshot.py --scope <scope> --cutoff
      <canonical-ts> <declared-input flags> && python3.12
      cabinet/scripts/cog4-schedule.py --snapshot <snapshot.json>

