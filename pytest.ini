# pytest.ini — rootdir anchor for the test-ledger fence (2026-07-04).
#
# WHY this file exists: pytest only loads conftest.py files between the ARG
# directory and confcutdir (= rootdir). Without an ini file anywhere, an
# invocation like `python3 -m pytest framework/ -q` (the CI shape in
# .github/workflows/cabinet-ci.yml) or `cd cabinet/scripts/lib && pytest tests/`
# computes rootdir at the arg's directory — and the repo-root conftest.py
# (the fence that redirects CABINET_EVENT_LOG_DIR/CABINET_UNDO_DIR away from
# the live audit ledger) would silently NOT load. This empty [pytest] section
# pins rootdir to the repo root for every in-repo invocation, so the fence is
# always on the conftest collection path.
#
# Deliberately NO options below (defaults preserved — norecursedirs keeps its
# default, which skips hidden dirs like .claude/worktrees/). Do not delete
# this file without also rethinking conftest.py's loading guarantee.
[pytest]
