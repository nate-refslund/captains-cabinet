# manifest.yml — Cabinet extension manifest for the Agent Teams capability pack.
# Schema: framework/schemas/extension-manifest.schema.json; validated by
#   bash cabinet/scripts/validate-extension.sh packs/agent-teams-pack
# instance/config/extensions.yml is the governed path that points officers at
# this pack (see cabinet/docs/cabinet-plugin-installation.md § Capability packs).
# Pure skill bundle: emits no action_types, so no risk classes and no undo
# surface.
name: agent-teams-pack
version: "0.1.1"
kind: skill
action_types: []
risk_classes: []
undo_contract: none
axis_compat:
  autonomy_level: [earn_up, guardian, sovereign]
  flavor: [personal, org]
  deployment_target: [macbook, mac_mini, docker]
entrypoints:
  skill_agent_team_workflow: skills/agent-team-workflow/SKILL.md
