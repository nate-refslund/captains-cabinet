name: Bug report
description: Something broke, misbehaved, or lied in its receipts.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fastest route to a useful bug issue is the
        feedback helper:

        ```bash
        bash cabinet/scripts/cabinet-feedback.sh --dry-run
        ```

        It gathers `cabinet-doctor` output, the latest hatch flight-log tail,
        and version info into ONE bundle, passes **every line** through the
        leak-scrub suite, and prints the redacted result for your review.
        Run it without `--dry-run` and it can open this issue prefilled —
        only after showing you the exact bundle and getting your explicit
        y/N consent. It never posts anything on its own.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: Ran `bash cabinet/scripts/hatch.sh` and step 4 failed with…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Diagnostic bundle (redacted)
      description: >-
        Paste the output of `bash cabinet/scripts/cabinet-feedback.sh
        --dry-run` here. Review it first — the scrubber is a safety net,
        not a substitute for your own eyes.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "`git rev-parse --short HEAD` in your checkout, or the egg release tag."
    validations:
      required: false
