name: Cabinet CI

# FW-026 Option 3 — belt-and-suspenders CI for Cabinet framework code.
# Additive to the pre-push gate (`scripts/pre-push-gate.sh`): local hook catches
# 99% of regressions pre-push, this workflow catches the 1% where officers push
# from host shell or where a `--no-verify` bypass slipped through.
#
# Runs: syntax checks (bash -n) + shell unit tests + Python tests + golden evals.
# Does NOT run: Dockerfile rebuilds, deploy-triggering ops, MCP integration.
# Minimal by design — expand once signal justifies.

# F0.3 (2026-07-02): retargeted at the live integration branch — CI had been
# structurally dead since master froze 2026-06-12 while all fidelity/authority/
# acting/frontdoor work landed on feat/fidelity-harness-design.
#
# 2026-07-28: feat/fidelity-harness-design DROPPED from both trigger lists. It
# is fully merged and dead — measured at ca86c31c: 0 commits ahead of master,
# 894 behind, last commit 2026-07-11, no push since. While it was live it was
# a MIRROR of master, not a divergent branch: 42 SHAs in the 30-day window were
# pushed to both refs and paid for two identical full runs (330 billable
# minutes of provably duplicate work). Keeping a dead ref in the trigger list
# costs nothing today and re-opens that duplicate lane the day anyone force-
# pushes it. Real work resumes on master + PRs, both still triggered.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # CI-audit 2026-07-09: nightly sweep — catches environment drift
  # (runner image, action resolution, date-sensitive fixtures) on quiet
  # days, and is the event gitleaks uses for its FULL-HISTORY scan.
  # 03:17 UTC — odd minute avoids the top-of-hour scheduler crunch.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # Master pushes must ALWAYS run to completion (each gets a unique
  # per-sha group), so a rapid push train can never cancel the run that
  # would have caught a regression on the default branch. PR/branch runs
  # keep the ref-scoped group + cancel-in-progress (newest push wins).
  group: cabinet-ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # ── tree-dedupe (2026-07-28) ────────────────────────────────────────────────
  # COST, not coverage. Measured over the 30 days to 2026-07-28 against the
  # Actions API (765 runs, 5,026 job-runs, billable = ceil(per-job seconds/60),
  # which is how GitHub charges): 18,672 billable minutes, of which master-push
  # runs are 7,300 (39.1%). Of those, 122 runs / 3,943 minutes (21.1% of the
  # whole bill; 25.8% over the last 7 days, 83% of master-push spend) ran on a
  # git TREE that a non-push run had already taken to green. Every merge here is
  # a PR merge and branch protection has `strict: true` (a PR must be up to date
  # with master before it can merge), so the merge commit's tree is byte-
  # identical to the `refs/pull/N/merge` tree the PR run already tested. Testing
  # it a second time buys nothing.
  #
  # This job decides that, and ONLY that. It skips nothing on its own; the eight
  # gate jobs read its output.
  #
  # THE SAFETY ARGUMENT, which is the whole design (a cheaper CI that catches
  # less is not a saving):
  #
  #  1. A pull_request or schedule run can NEVER be skipped. Each gate job's
  #     condition leads with `github.event_name != 'push'`, which is true for
  #     every non-push event before anything about this job is consulted. That
  #     matters more than it looks: GitHub reports a job skipped by an `if:` as
  #     SUCCESS to branch protection, so a bug that skipped a required check on
  #     a PR would read as a green merge button over an ungated tree. The
  #     event guard makes that unreachable rather than unlikely.
  #  2. It fails CLOSED in every direction. `skip` is written exactly once, at
  #     the end, and is `true` only on the single path that proves a match; any
  #     non-zero exit, empty variable, API error or unresolved tree leaves it
  #     `false` and everything runs. The gate jobs carry `!cancelled()`, so if
  #     THIS job fails outright they still run — a broken dedupe costs a full
  #     run, never a skipped one.
  #  3. Evidence is only ever accepted from a `pull_request` run, which is a
  #     class this job can never have skipped. That closes the chain where a
  #     skipped (and therefore "successful") run becomes the evidence for
  #     skipping the next one.
  #  4. It compares the TREE, not the commit. A tree is the complete content of
  #     the checkout; two commits with one tree cannot make any gate here
  #     answer differently. The two history-sensitive gates were checked
  #     individually: gitleaks on push scans the pushed range, which under
  #     `strict: true` is the same commit set the PR run scanned, and the
  #     nightly full-history sweep is a schedule run and never skipped; the
  #     architecture baseline ratchet compares base→head, and its push base
  #     (`github.event.before`) equals the PR base for an up-to-date branch.
  #  5. A run-level `success` is a STRONGER claim than the required-check set —
  #     it means all eight jobs ran and passed, including `cognitive-phase4`,
  #     which branch protection does not require. That equivalence is NOT a
  #     property of GitHub, which concludes a run `success` when jobs are merely
  #     SKIPPED. It holds here only because of point 1: no gate job's condition
  #     can go false on a pull_request, so a successful PR run cannot be hiding
  #     one. Points 1 and 5 are therefore the same claim, and both are pinned by
  #     evaluating these very `if:` expressions in
  #     cabinet/scripts/tests/test_ci_dedupe_cannot_skip_a_pr.py — including
  #     mutation arms that strip the event guard from each gate job in turn and
  #     require the check to fail. A precondition nobody tests is a precondition
  #     that expires the next time someone adds a condition here.
  #
  # Not touched, deliberately: master's per-SHA concurrency group. Cancelling
  # superseded master runs would be cheaper and would leave master commits that
  # no gate ever ran. That is coverage traded for cost, which is out of scope
  # here by construction.
  tree-dedupe:
    # Push-only. On pull_request/schedule this job does not exist, so it costs
    # nothing on the two thirds of runs it could never help.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # read this workflow's own run history
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      # No checkout: the pushed commit's tree is resolved through the API, so
      # this job is a handful of seconds and one billable minute — the floor for
      # any job. Against 3,943 minutes it is a 304-minute/month tax.
      - name: Has this exact tree already gone green?
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: cabinet-ci.yml
        run: |
          set -uo pipefail
          SKIP=false
          # Single write, at exit, whatever happens below.
          trap 'echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"; echo "DEDUPE skip=${SKIP}"' EXIT

          TREE="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.tree.sha' 2>/dev/null)"
          if [ -z "${TREE}" ]; then
            echo "could not resolve the tree of ${HEAD_SHA} — running everything"
            exit 0
          fi
          echo "pushed tree: ${TREE}"

          # Newest successful pull_request runs of THIS workflow. The match is
          # normally the first candidate (the merge happens minutes after the
          # PR run goes green); the loop is bounded so a miss costs seconds.
          CANDIDATES="$(gh api \
            "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=pull_request&status=success&per_page=40" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"${REPO}\") | .head_sha" 2>/dev/null)"
          if [ -z "${CANDIDATES}" ]; then
            echo "no successful pull_request runs to compare against — running everything"
            exit 0
          fi

          n=0
          while IFS= read -r sha; do
            [ -n "${sha}" ] || continue
            n=$((n + 1))
            [ "${n}" -le 40 ] || break
            t="$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.tree.sha' 2>/dev/null)"
            if [ -n "${t}" ] && [ "${t}" = "${TREE}" ]; then
              echo "tree ${TREE} already green on ${sha} (pull_request run) — skipping the re-test"
              SKIP=true
              exit 0
            fi
          done <<< "${CANDIDATES}"

          echo "tree ${TREE} not found green in the last ${n} successful PR runs — running everything"
          exit 0

  ci:
    needs: [tree-dedupe]
    # Runs unless this exact tree is already proven green by a PR run. The
    # leading `!cancelled()` is load-bearing: without it a FAILED tree-dedupe
    # would skip this gate instead of forcing it. See tree-dedupe's header.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.tree-dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    # RE-BUDGETED 2026-07-28, first time since eac1c4a4 created this job. 15 was
    # the value this file was born with, when the job was a handful of shellcheck
    # passes; it has never been revisited while the job grew to the whole
    # dashboard suite plus the world pixel gate. It stopped fitting on run
    # 30350363875, where "Hook regression harnesses" was CANCELLED mid-step at
    # 15m12s — a timeout-minutes hit reports as `cancelled`, which is why this
    # read as a mystery cancellation and not as a budget.
    #
    # Measured the honest way — off MASTER's own green run of this job at
    # 6ec81460 (30351195519), which is the same job doing the same work minus
    # this branch: 12m10 end to end, of which vitest is 33s and the hook
    # regression harnesses 5m59 (that step grew ~1m in #249, which added the
    # 540-line dependency-preflight harness). This branch's vitest measured
    # 5m43 on run 30350363875 against master's 33s, so this job lands near
    # 17m30. The earlier estimate written here was ~16m50 off the pre-#249
    # step timings and was stale within the hour; 17m30 is the number.
    #
    # The growth is real work arriving, not a hang — the vitest step went
    # 34s (30230120417) -> 2m16s (30264672004) -> 5m43s as the world capture
    # pixel gate and the harbour/planting content landed.
    #
    # 25 matches framework-tests' budget and leaves ~30% headroom over that
    # 17m30. It is a resource bound, not a threshold: no arm is skipped,
    # relaxed or widened by it, and a genuinely hung step still dies here.
    # If the job ever creeps past ~22m, re-budget again rather than letting a
    # cancellation be read as a test result — that is what cost this round.
    timeout-minutes: 25

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # pre-compact.sh, stop-hook.sh, run-golden-evals.sh read REDIS_HOST directly.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # pre-tool-use.sh + post-tool-use.sh PREFER REDIS_HOST/PORT and fall
      # back to deriving host/port from REDIS_URL; set the full triple so no
      # resolution path can reach the (non-existent on GH runner) `redis`
      # Docker-DNS default. First CI run (2485561…) failed
      # EVAL-001/008/015/016 on exactly this endpoint-resolution class.
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          path: founders-cabinet
          persist-credentials: false

      - name: Mount checkout at /opt/founders-cabinet
        # Many scripts hardcode /opt/founders-cabinet paths; symlinking is cheaper
        # than refactoring CABINET_ROOT usage across the codebase.
        run: sudo ln -s "$GITHUB_WORKSPACE/founders-cabinet" /opt/founders-cabinet

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools jq

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          # Python tests stub requests/yaml/psycopg2 via sys.modules, so real
          # packages are optional. Install anyway to match officer container.
          # pillow: cabinet/dashboard/src/lib/world/capture.test.ts renders a
          # real world frame and runs the twelve invariants in
          # cabinet/scripts/world-capture/mirror/checks over its pixels. That
          # test FAILS rather than skips without Pillow, on purpose — a skipped
          # world check is a disabled sensor, and the whole point is that CI
          # cannot go green without a frame having been judged.
          pip3 install psycopg2-binary requests pyyaml pytest pillow

      - name: Setup Node
        # FW-048: dashboard typecheck needs node + npm. Node 20 matches
        # Next.js 15 requirements.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: founders-cabinet/cabinet/dashboard/package-lock.json

      - name: Bash syntax check — hooks
        if: ${{ !cancelled() }}
        run: |
          set -e
          for f in /opt/founders-cabinet/cabinet/scripts/hooks/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Bash syntax check — lib
        if: ${{ !cancelled() }}
        run: |
          set -e
          for f in /opt/founders-cabinet/cabinet/scripts/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Bash syntax check — scripts top-level
        if: ${{ !cancelled() }}
        # 56 scripts at cabinet/scripts/*.sh (create-officer, resume-officer,
        # notify-officer, record-experience, org-health-audit, etc.) are on the
        # hot path for officer provisioning + day-to-day comms. Prior coverage
        # was hooks/ + lib/ only — top-level syntax regressions would slip
        # through every other step (which reads config via these scripts).
        run: |
          set -e
          for f in /opt/founders-cabinet/cabinet/scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Bash syntax check — remaining subdirs (git-hooks, gates)
        if: ${{ !cancelled() }}
        # Catches bash scripts in deeper subdirs the earlier globs miss:
        # - git-hooks/pre-commit + pre-push (no .sh extension, safety rails for
        #   force-push refusal + checkpoint-review gate, FW-007 + FW-019)
        # - gates/*.sh (library-write gates, FW-021 idempotency-hash)
        # Selects by shebang instead of extension so new subdirs are caught too.
        # -mindepth 2 avoids re-checking top-level (covered by previous step).
        run: |
          set -e
          while IFS= read -r f; do
            echo "bash -n $f"
            bash -n "$f"
          done < <(find /opt/founders-cabinet/cabinet/scripts -mindepth 2 \
                     \( -path '*/hooks/*' -o -path '*/lib/*' \) -prune -o \
                     -type f -print \
                   | while IFS= read -r ff; do
                       head -1 "$ff" 2>/dev/null | grep -qE '^#!.*bash' && echo "$ff"
                     done)

      - name: Bash syntax check — cron
        if: ${{ !cancelled() }}
        # 15 scripts at cabinet/cron/*.sh (~1.8k lines) ran in NO CI step until
        # 2026-07-26: every syntax-check glob above is rooted at
        # cabinet/scripts, and the find-based step is `-mindepth 2` under that
        # same root, so cabinet/cron was outside all four. That directory holds
        # the Captain's briefing path (briefing.sh), the limit-reset watchdog
        # and the self-improvement driver — a stray brace in any of them was a
        # silent runtime-only failure. Own step (not folded into the find
        # above) so a cron break stays step-attributable.
        run: |
          set -e
          for f in /opt/founders-cabinet/cabinet/cron/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck hooks + lib + scripts root + cron (severity=error)
        if: ${{ !cancelled() }}
        # FW-054: static analysis gate for the 12 hook + lib scripts.
        # FW-055: extended to cover the 57 root-level cabinet/scripts/*.sh files
        # (officer lifecycle, cost tooling, orchestration). 2 SC2045 instances
        # found in the FW-055 survey 2026-04-24 (resume-officer.sh + suspend-
        # officer.sh) were fixed in PR #48 (commit 677275e) before this gate
        # widening so the expanded surface is green on first run.
        # --severity=error catches genuine bugs (SC2064 trap-in-subshell,
        # SC2090 array-quoting, SC2094 read/write same file, etc.) without
        # noise from style warnings. ubuntu-latest has shellcheck pre-installed.
        # Widened 2026-07-26 to the 15 cabinet/cron/*.sh files (the same blind
        # spot the cron syntax step above closes). All 15 were verified clean at
        # --severity=error AND --severity=warning before this widening, so the
        # expanded surface is green on first run (the FW-055 precedent above).
        run: |
          shellcheck --version
          shellcheck --severity=error --shell=bash \
            /opt/founders-cabinet/cabinet/scripts/hooks/*.sh \
            /opt/founders-cabinet/cabinet/scripts/lib/*.sh \
            /opt/founders-cabinet/cabinet/scripts/*.sh \
            /opt/founders-cabinet/cabinet/cron/*.sh

      - name: Layer-separation gate (FINAL-C)
        if: ${{ !cancelled() }}
        # Three-layer dependency direction enforcement:
        #   framework/ → cannot reference instance/ or presets/
        #   presets/   → cannot import code from instance/
        #   instance/  → may reference anything
        # Baseline-ratchet: known violations are committed to
        # .layer-separation-baseline; CI fails only on NEW violations beyond
        # the baseline. Cleanup PRs can ratchet the baseline down via
        # `cabinet/scripts/check-layer-separation.sh --update-baseline`.
        # Growing the baseline requires Captain approval (file is reviewed
        # in PR diff). Script also runs locally as a pre-commit safety net.
        run: bash /opt/founders-cabinet/cabinet/scripts/check-layer-separation.sh

      - name: State-persistence preflight (deploy would not lose state)
        if: ${{ !cancelled() }}
        # A release is a FRESH `git worktree`: it holds tracked files and
        # nothing else, so every gitignored path — the cabinet's accumulated
        # runtime state — survives a deploy ONLY if runtime-provision.sh's
        # lists symlink it into shared/. Those hand-maintained lists drifted
        # from .gitignore and silently discarded ratified Captain rules
        # (memory/skills/evolved/), the tier-3 decision log, the tool-call log
        # and the append-only foundry archive. Nothing errored; the health gate
        # passed; the old release kept the only copy until prune rm -rf'd it.
        #
        # This gate DERIVES the durable set from .gitignore rather than adding
        # a fourth hand-maintained list, and fails on any path that is neither
        # carried nor declared disposable WITH A WRITTEN REASON. It runs here
        # so drift is caught at review time; cabinet-deploy.sh runs the same
        # checker in --slot mode against the real release before promote.
        run: python3 /opt/founders-cabinet/cabinet/scripts/state-persistence-preflight.py --repo /opt/founders-cabinet

      - name: Shell unit tests — triggers.sh
        if: ${{ !cancelled() }}
        run: bash /opt/founders-cabinet/cabinet/scripts/test-triggers.sh

      - name: Shell unit tests — memory.sh
        if: ${{ !cancelled() }}
        run: bash /opt/founders-cabinet/cabinet/scripts/test-memory.sh

      - name: Shell unit tests — audit-framework-backlog-drift.sh
        if: ${{ !cancelled() }}
        # Guards the drift auditor (FW-002 safety net) against silent regressions.
        # 12 fixture scenarios covering fresh/stale × Proposed/Paused × SHIPPED-skip
        # × no-date-skip × env threshold overrides × missing-file handling × advisory-
        # exit invariant. If this test breaks, the auditor may still run green in CI
        # but silently hide drift classes. See scripts/test-audit-framework-backlog-drift.sh.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-audit-framework-backlog-drift.sh

      - name: Shell unit tests — start-officer.sh args (FW-073)
        if: ${{ !cancelled() }}
        # 22 assertions across 8 test groups: legacy back-compat, --project
        # arg parsing, CABINET_ACTIVE_PROJECT export contract (FW-072 trigger),
        # path-injection guard on slug, slug length cap (32 char), defensive
        # unset against env-file pollution, missing-env-file rejection, unknown
        # arg + missing officer rejections. Pins the pool-mode opt-in semantics
        # so legacy single-project deployments cannot accidentally start
        # writing per-project HSET fields without an explicit --project flag.
        run: bash /opt/founders-cabinet/cabinet/tests/start-officer/test-args.sh

      - name: Shell unit tests — start-officer CABINET_LANE export (T4 / authority FIX-4)
        if: ${{ !cancelled() }}
        # 6 assertions: pool mode (--project) exports CABINET_LANE=<slug> (the
        # load-bearing source framework/authority/lane.py resolve_lane() reads
        # first); CABINET_LANE tracks CABINET_ACTIVE_PROJECT (one source of
        # truth); legacy mode without a slug does NOT export an empty lane
        # (fail-safe fall-through to PROJECT/None → unmeasured cell); a poisoned
        # CABINET_LANE env is scrubbed by the defensive unset; a poisoned
        # active-project.txt CONTENT (shell metachars + cmd-subst) is rejected by
        # the legacy slug allowlist with no CABINET_LANE export and no injection
        # side-effect (closes the `export $EXPORT_VARS` RCE seam). Pins the lane
        # dimension of the F+A cell tuple so the authority gate's per-lane bars
        # and instance lane→risk-class bindings are not silently nulled.
        run: bash /opt/founders-cabinet/cabinet/tests/start-officer/test-lane-export.sh

      - name: Shell unit tests — start-officer-mac.sh dry-run (T4 / authority FIX-4)
        if: ${{ !cancelled() }}
        # Mac-native launch flag assembly + CABINET_LANE export contract: native
        # --agent probe, CABINET_SOURCE_REPO vs script-relative root, telegram
        # gate fallback, CABINET_LANE export from active-project.txt, fail-safe
        # omission when absent, and the slug-allowlist REJECTION path (malformed
        # + cmd-separator active-project.txt → no CABINET_LANE, no injection
        # side-effect). Previously unwired in CI — the Mac CABINET_LANE + slug
        # validation assertions never ran on PRs. deploy-mac --dry-run is
        # exercised too (renders plist via the python3 fallback; no launchctl).
        # T6 (2026-09-06) pins the runtime-constitution assembly as FAIL-CLOSED:
        # with load-preset.sh stubbed to exit 1 the launcher must refuse (exit
        # 78) before any boot step — no claude, no tmux, no assembled command —
        # and with it exiting 0 the boot command must still render. Reached via
        # CABINET_MAC_TEST_ASSEMBLY=1, which runs the assembly block that plain
        # --dry-run skips (T6c re-pins that --dry-run still skips it).
        run: bash /opt/founders-cabinet/cabinet/scripts/test-mac-dry-run.sh

      - name: Shell unit tests — post-tool-use.sh JSONL project field (FW-075)
        if: ${{ !cancelled() }}
        # 9 assertions: project field surfaces in JSONL when CABINET_ACTIVE_PROJECT
        # is set (FW-073 export contract); legacy mode emits empty field; malformed
        # slug (charset, leading hyphen, length>32) defensively falls back to empty
        # so corrupted env never produces malformed JSONL. Pins the FW-075 H3 field
        # contract so downstream dashboard/retro queries can rely on it.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-post-tool-use-jsonl.sh

      - name: Shell unit tests — cabinet-spawn.sh (FW-080)
        if: ${{ !cancelled() }}
        # 38 assertions across 8 test groups: bad slug rejection (charset + length),
        # missing/bad repo_url rejection, DRY_RUN=1 dry-run plan (no side effects,
        # no state file), --skip-create with provisioned + unprovisioned slugs,
        # --officers restriction to a subset, idempotency (re-run safe), secret
        # non-echo (GITHUB_PAT), and hyphenated slug validation.
        # All assertions use DRY_RUN=1 or pre-flight rejections — no real tmux
        # sessions, Redis writes, or create-project.sh calls are made in CI.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-cabinet-spawn.sh

      - name: Shell unit tests — cabinet-bootstrap.sh (FW-082)
        if: ${{ !cancelled() }}
        # 38 assertions across 7 test groups: bad slug rejection (charset + length),
        # missing preset rejection, DRY_RUN=1 plan-only mode (no filesystem side-effects,
        # no state file, no secrets in output), secret redaction (Neon URL password
        # stripped to [REDACTED] in all output), validate.sh hard-gate (preset with
        # failing validate.sh aborts bootstrap + no partial state), re-run resumability
        # (step_is_done guard present, 'already completed' skip message wired), and
        # bad --peer-cabinet syntax rejected (colon-count check).
        # All assertions use DRY_RUN=1 or exit-on-validation — no real filesystem writes,
        # git clones, Docker ops, Redis writes, or Neon connections are made in CI.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-cabinet-bootstrap.sh

      - name: Org runtime vertical-slice eval
        if: ${{ !cancelled() }}
        # Outcome-to-OVI branch 1: proves one Captain-ratified outcome through
        # mission/work-graph, role hat assignment, verification, OVI publish,
        # sanitized digest, append-only org_events, and source-event lineage.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-org-runtime.sh

      - name: Durable adaptive role eval
        if: ${{ !cancelled() }}
        # Branch 2: proves durable role identity, officer-session mapping,
        # memory binding, role eval evidence, deterministic recommendation,
        # Captain-ratified evolution, and append-only role history.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-org-roles.sh

      - name: Typed policy shadow parity eval
        if: ${{ !cancelled() }}
        # Shadow-only typed policy engine observes hook input and records
        # structured decisions to org_events. This branch compares a focused
        # fixture set against the live pre-tool-use.sh behavior; it does not
        # replace hook decisions yet.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-policy-shadow.sh

      - name: Shell unit tests — create-project.sh (FW-078)
        if: ${{ !cancelled() }}
        # 25 assertions across 8 test groups: bad slug charset/length rejection,
        # missing repo_url rejection, DRY_RUN=1 plan-only mode (no filesystem
        # side-effects, no state file), idempotency (re-run finds completed steps,
        # state file cleaned up on full success), mid-run failure leaves state file
        # for resumability, output yml is structurally valid YAML with correct
        # mount_path and repo URL, output env file has all required fields (no
        # GITHUB_PAT leak). Uses pre-seeded state files + invalid git URLs so no
        # real clone, Redis write, or Telegram call is made during CI.
        env:
          GITHUB_PAT: ci-stub-token
        run: bash /opt/founders-cabinet/cabinet/scripts/test-create-project.sh

      - name: Shell unit tests — pre-push hook (FW-007 + FW-025)
        if: ${{ !cancelled() }}
        # 14 scenarios / 31 assertions covering the safety-critical pre-push hook:
        # non-master fast-paths, legit fast-forward + first-create, force-overwrite
        # + delete refusal, every is_announced() rejection branch (malformed TS,
        # future TS, >300s stale, log missing, log is symlink, TS absent from log),
        # and the full success path. Eval gate (FW-025) is stubbed per-fixture.
        # Hook guards master branch integrity — regressions here would silently
        # allow force-push/delete on master. See test-pre-push-hook.sh.
        run: bash /opt/founders-cabinet/cabinet/scripts/test-pre-push-hook.sh

      - name: Python tests — cabinet/scripts/lib/tests (full lib suite)
        if: ${{ !cancelled() }}
        # Collects the ENTIRE cabinet/scripts/lib/tests directory — every
        # test file in it, no per-suite list here (a stale enumeration is
        # exactly how the old name rotted); 236 tests as of 2026-07-17.
        # The FW-023 ETL-transform tests this step was originally named for
        # were carved OUT of this directory to the Spec-039 set in f855ae96
        # (R073); of the ETL modules only etl-common.py remains in lib/,
        # covered here via test_library_mcp_client.py. The stale "ETL
        # transforms (FW-023)" step name misled a 2026-07-16 CI census into
        # concluding cabinet/scripts/lib/tests was collected by NO CI step.
        # Kept SEPARATE from the framework/ + cabinet/scripts/tests pytest
        # invocations: lib/tests imports as top-level package `tests` (lib/
        # has no __init__.py) and basename-collides under one pytest run
        # (59 collection errors, reproduced 2026-07-16; ledger row R165).
        run: |
          cd /opt/founders-cabinet/cabinet/scripts/lib
          python3 -m pytest tests/ -v

      - name: Python tests — Gate 3 idempotency hash (FW-021)
        if: ${{ !cancelled() }}
        run: |
          cd /opt/founders-cabinet/cabinet/scripts/gates
          python3 -m pytest tests/ -v

      - name: Python tests — MCP server (FW-005)
        if: ${{ !cancelled() }}
        # 20 tests: stdio + HTTP transport, bearer auth, error handling.
        # Runs as a standalone script (not pytest) — the file's __main__ block
        # drives unittest. Spec 035 Phase A shipped in #33, so this is the
        # regression net for cross-Cabinet comms.
        run: python3 /opt/founders-cabinet/cabinet/mcp-server/test_server.py

      - name: Dashboard typecheck (tsc --noEmit)
        if: ${{ !cancelled() }}
        # FW-048: catch TS errors in dashboard before they reach Captain's
        # localhost:3100. tsconfig has noEmit:true, so `npx tsc` alone is
        # pure type-check (no JS output).
        run: |
          cd /opt/founders-cabinet/cabinet/dashboard
          npm ci
          npx tsc --noEmit

      - name: Dashboard vitest
        # FW-050: run full vitest test suite (auto-discovers src/**/*.test.ts).
        # vitest.config.ts excludes .next/** mirrors so only real tests run.
        #
        # `!cancelled()` added 2026-07-29. This was the ONE test step in this
        # job without it, which is the same one-red-hides-the-next defect the
        # "Declare the redis service container disposable" step below documents
        # at length: a failing typecheck SKIPPED this suite, so a run could
        # report one red while the 138 vitest files — including the world pixel
        # gate — were never executed and nothing said so. A skipped step reads
        # as absence of red, not as green.
        if: ${{ !cancelled() }}
        run: |
          cd /opt/founders-cabinet/cabinet/dashboard
          npm test

      - name: Declare the redis service container disposable
        # RUNS EVEN AFTER A RED, and that is the whole point of the condition.
        # Every consumer below carries `if: !cancelled()` so that one red does
        # not hide the next; this step did not, so a failing vitest SKIPPED it
        # and then "Golden evals" and "FW-002 spending limits" both went red
        # with `INFRA-FAIL (gate stays closed): declared-disposable redis at
        # 127.0.0.1:6379 did not prove it is a throwaway` — a fabricated cause
        # for a run whose only real defect was three timed-out world sweeps
        # (run 30350363875, 2026-07-28). A setup step that is weaker than its
        # consumers turns one honest red into three misleading ones, which is
        # the same dead-sensor class as a check that cannot fail: you cannot
        # read the cause off the result.
        #
        # The golden-eval suite SETs/DELs cabinet:killswitch, so it refuses any
        # endpoint not PROVEN throwaway (2026-07-27). CABINET_EVALS_REDIS_DISPOSABLE=1
        # alone is no longer enough: an env var is a claim about this process's
        # intent and it travels between shells, so the declaration now has to be a
        # property of the SERVER. This step writes it on the service container —
        # which is torn down with the job — and is the only place in the repo that
        # writes that marker. NEVER add a step like this against a real fleet's Redis.
        if: ${{ !cancelled() }}
        run: redis-cli -h 127.0.0.1 -p 6379 SET cabinet:evals:disposable 1

      - name: Golden evals
        if: ${{ !cancelled() }}
        # EVAL-023 (FW-047) runs under CABINET_HOOK_TEST_MODE=1 so trigger_send
        # fan-out is suppressed. This step also exercises the full hook-probe
        # surface end-to-end.
        # CABINET_EVALS_REDIS_DISPOSABLE=1: this job's redis:7 SERVICE
        # container is a throwaway, so the suite may use it directly — the
        # declaration is what lets it skip the ephemeral-sandbox spawn it
        # now requires everywhere else (the suite sets/clears
        # cabinet:killswitch and must never touch a live Redis; the runner
        # image also has no redis-server binary to sandbox with).
        env:
          CABINET_EVALS_REDIS_DISPOSABLE: "1"
        run: bash /opt/founders-cabinet/cabinet/scripts/run-golden-evals.sh

      - name: Golden eval — FW-002 spending limits
        if: ${{ !cancelled() }}
        # run-golden-evals.sh has NO discovery — every eval is a hardcoded
        # inline block — so the standalone contract suites under
        # memory/golden-evals/ only run if something invokes them by name.
        # fw-002 had exactly one executor: framework/learning/
        # self_improvement_loop.py, unattended every 6h on the Mac. It was
        # RED there for weeks (and, worse, testing the wrong thing) and no
        # gate said so. This step is that missing gate.
        # Same disposable-endpoint declaration as the step above: this job's
        # redis:7 SERVICE container is a throwaway, and the runner image has
        # redis-cli but no redis-server to spawn an ephemeral sandbox with.
        # The eval still saves and restores every hash field it writes and
        # never writes cabinet:killswitch.
        env:
          CABINET_EVALS_REDIS_DISPOSABLE: "1"
        run: bash /opt/founders-cabinet/memory/golden-evals/framework/fw-002-spending-limits.sh

      - name: Golden eval — FW-019 checkpoint review
        if: ${{ !cancelled() }}
        # Same blind spot as the FW-002 step above, found the same way
        # (2026-07-27): run-golden-evals.sh has NO discovery, so this contract
        # suite had ZERO executors anywhere — `git grep fw-019-checkpoint-review`
        # returned the file, its own header, and a knowledge-classification row.
        # The behaviour it pins (which artifacts satisfy the pre-commit
        # checkpoint gate) was therefore unwatched the entire time the gate was
        # forgeable by `touch`. This step is that missing gate.
        # Hermetic: the eval copies the hook into its own mktemp git repo, needs
        # no Redis, no network and no cabinet state, and writes nothing outside
        # that directory.
        run: bash /opt/founders-cabinet/memory/golden-evals/framework/fw-019-checkpoint-review.sh

      - name: Captain-rules retrieval eval
        if: ${{ !cancelled() }}
        # Spec 042 Phase 3: golden eval over 5 anchor fixtures asserting
        # query.sh surfaces the expected anchors + patterns + intents
        # for synthetic Captain DMs. Catches regressions in trigger-word
        # tuning + indexer schema drift. Exits non-zero on any fixture FAIL.
        run: bash /opt/founders-cabinet/cabinet/scripts/captain-rules/eval.sh

      - name: Captain-rules encode-pipeline eval
        if: ${{ !cancelled() }}
        # Spec 048 v2: hermetic regression eval over the encode → draft →
        # ratify path (skipping API-bound classify-rule.sh). Pins the
        # draft template shape (set -u, env-var disable, JSONL log path),
        # ratify yes/no semantics (settings.json patch on yes, untouched
        # on no), audit-log entries, pending-marker cleanup, and graceful
        # values-only short-circuit. 29 assertions; any silent breakage
        # of draft-generator.sh or ratify-rule.sh fails CI.
        run: bash /opt/founders-cabinet/cabinet/scripts/captain-rules/eval-encode-pipeline.sh

      - name: Hook regression harnesses
        if: ${{ !cancelled() }}
        # FW-051 addendum: 7 permanent harnesses at cabinet/tests/hook-regression/
        # (fw041/042/043/044/045/051) snapshot each FW-0xx adversary-finding
        # validation. Runner applies per-harness tolerance for documented
        # deferrals (fw044 ≤8 = FW-051 closures labeled "deferred" pre-ship;
        # fw051-baseline ≤2 = AC-3/AC-9 dataflow-decoupled).
        # Hardcoded `-h redis` in DEL cleanup calls fails silently in CI
        # (keys aren't set in fresh CI redis anyway); hook itself reads REDIS_URL.
        run: bash /opt/founders-cabinet/cabinet/scripts/run-hook-regression.sh

      - name: Framework backlog drift audit (advisory)
        if: ${{ !cancelled() }}
        # Surfaces FW-series entries with Status: Proposed/Paused older than
        # threshold (default: Proposed≥7d, Paused≥14d). Advisory only — exits
        # 0 always, never fails CI. Catches the FW-002 drift class (shipped
        # code + stale Proposed status for 7 days unnoticed). Punch-list
        # shows in the CI run log; CTO reacts in the next /loop tick.
        run: bash /opt/founders-cabinet/cabinet/scripts/audit-framework-backlog-drift.sh

  # F0.3 (2026-07-02): the 1,343-test framework suite finally gets a CI runner —
  # it previously ran in NO CI anywhere (the newest, most safety-critical code:
  # leak fences, authority matrix, graduation, acting lane, frontdoor).
  # KNOWN-RED at introduction: 2 pre-existing date-drift failures in
  # framework/fidelity/tests/test_graduation.py (fixtures written 2026-06-19
  # with wall-clock-relative day arithmetic; rotted by 07-02). Honest red over
  # absent — fix tracked in docs/plans/EXECUTION-STATUS.md.
  framework-tests:
    needs: [tree-dedupe]
    # Skipped only on a master push whose tree a PR run already took to
    # green. `!cancelled()` keeps this gate running when tree-dedupe itself
    # fails, and the event clause makes a skipped PR check unreachable.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.tree-dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    # 15 -> 25 (2026-07-27). This job had grown to within SECONDS of its own
    # guard and started killing runs whose every step had already succeeded —
    # a false red, which is the worst signal a gate can emit. Measured, not
    # guessed: master 19d1c2e1 ran 14m49s (run 30231881685) and the very next
    # branch run took 14m57s (run 30235086502) and was cancelled at the
    # boundary with all 15 steps green, the whole delta being 5s of slower
    # container init and 6s of slower apt — the two pytest steps were a net
    # ONE SECOND faster than master's. Nothing here weakens an assertion: every
    # suite still runs and still gates; the wall-clock number was a runner
    # guard riding on ~10s of headroom, which the shared-runner variance law
    # says will flake. When the honest fix arrives (splitting cabinet/scripts/
    # tests, 11m13s of the 14m49s, into its own job), bring this back down.
    #
    # 25 -> 40 (2026-07-30). It happened again, exactly as the paragraph above
    # predicted, and this time it is not one unlucky run: over the 16 most
    # recent runs of this job the median is 24m39s and TEN finish within 60
    # SECONDS of the guard. Run 30577556956 was cancelled at 25m17s with every
    # assertion that had executed still green — a false red on a PR whose own
    # change was 78 lines of Swift and one grep test. At that distribution the
    # gate is a coin flip for every session with a PR open, and a coin-flip
    # gate teaches people to re-run rather than to read, which is how a real
    # red gets waved through. 40 restores ~62% headroom over the median, the
    # same margin the 15 -> 25 bump bought before the job grew into it.
    # NOTHING here weakens an assertion: every suite still runs and still
    # gates, and no threshold that judges anything moved. The number is a
    # runner guard, and §7-9 says a wall-clock bound on a shared runner flakes.
    # THE REAL FIX IS STILL THE SPLIT — this buys time for it, and the growth
    # itself (14m49s on 2026-07-27, 24m39s median on 2026-07-30) is the thing
    # to look at: at that rate 40 minutes is a matter of days, so a session
    # that raises this number again without splitting the job is treating a
    # symptom for the third time.
    timeout-minutes: 40
    # SPIKE (hardening loop 2026-07-11): redis service closes 23 of 24 runtime
    # skips; the 5 sovereign tests need the germline hook rc=0 on a fresh empty
    # redis — unproven on a runner, hence branch-spike before master.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      # COG-1 §9.4: the DB-plane crash-matrix sims (framework/outbox/tests,
      # framework/triggers/tests, cabinet/scripts/tests/test_cog1_*) GATE
      # (fail, not skip) once CI declares Postgres present. S0 ground finding
      # (binding, per 2026-07-07 grant): the production work store runs
      # PostgreSQL 17.10, so this pin is MAJOR 17 — the plan text said 16, S0
      # supersedes it, and lib_cog1_harness.py pins major 17 (skips anything
      # else). Cloned from the redis service block above; postgres additionally
      # needs POSTGRES_PASSWORD + a readiness probe (the job starts before the
      # container is accepting connections otherwise).
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # COG1_PG_DSN is the harness-OWN opt-in (lib_cog1_harness.ci_service_dsn):
      # its presence flips harness_available() true so the DB sims run against a
      # scratch database created on this service (no initdb needed). KEYWORD
      # conninfo, never a URI — conninfo() appends `dbname=<scratch>` and relies
      # on libpq later-key-override (lib_cog1_harness.py:284). By design it is a
      # distinct name from the live-store variables (NEON_CONNECTION_STRING /
      # DATABASE_URL) the harness fences off, so the sims can never resolve the
      # production store.
      COG1_PG_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/cabinet-ci.yml
      - name: Install test dependencies
        # pillow: test_world_asset_forge.py (+ the forge script it
        # module-loads) imports PIL; installed here so the forge tests GATE
        # in the cabinet/scripts/tests step below instead of killing its
        # collection (wave-3 2026-07-17; only user-site has PIL locally).
        # psycopg2-binary (COG-1 §9.4): the relay drain + the DB-plane sims
        # connect via psycopg2 — without it pg_available() stays false and the
        # relay/outbox sims skip instead of gating.
        run: pip install pytest pyyaml jsonschema pillow psycopg2-binary
      # redis-tools: the redis-gated test guards probe via the redis-cli
      # BINARY (test_intake.py:32) — the service container alone leaves
      # them skipping (proven on a spike run: still skipped 23).
      # postgresql-client (COG-1 §9.4, redis-tools precedent): the sim harness
      # spawns `psql` against COG1_PG_DSN to apply the DDL chain and drive the
      # kill rigs — the service container alone leaves the DB sims skipping,
      # exactly the failure class redis-tools records above.
      # redis-server at the PRODUCTION major, from Redis Ltd's own archive and
      # NOT Ubuntu's (2026-07-27 — discharges the KNOWN GAP recorded here).
      #
      # The gap: framework/cost/tests/test_meter_redis.py stands up its OWN
      # ephemeral server per test, so with redis-tools alone all 29 of its arms
      # SKIP — the meter's entire persistence layer (watermark, atomic write,
      # error-reply detection) unobserved in CI while the suite reports green.
      # A skipped test is a disabled sensor, not a pass.
      #
      # Installing the binary was tried once and reverted, because it armed 74
      # dormant tests and 4 of them failed. Those 4 have now been split by
      # actual cause, which the earlier note got wrong by lumping them:
      #   * THREE are genuine 7.0.15-vs-8.8 semantics (test_redis_backup_e2e;
      #     test_redis_state_replay's two XAUTOCLAIM arms — 7.0.15 does not
      #     create a consumer on a claim-nothing XAUTOCLAIM, 8.8 does). Only a
      #     version bump fixes these; that is this step.
      #   * ONE was NOT version-sensitive at all: the 512 KiB value crossed
      #     execve as a single argv member, over Linux's MAX_ARG_STRLEN
      #     (131072), so it failed on Linux at ANY Redis version and passed on
      #     macOS at any version. Fixed separately and already landed (PR #220,
      #     value moved to stdin via `-x`). A version bump alone would have
      #     left it red.
      #
      # Why the production major rather than Ubuntu's 7.0.15: production is a
      # brew-installed, deliberately UNPINNED redis currently at 8.8, and
      # cabinet/scripts/lib/redis-state.sh:146 fingerprints Redis-8.8-only
      # sparse arrays via ARINFO/ARNEXT. On a 7.x runner that production code
      # path cannot execute AT ALL — three arms feature-probe COMMAND INFO
      # ARSET and skip — while the arms that DO run measure semantics
      # production never sees. Arming a sensor pointed at the wrong version is
      # not coverage. Measured on one machine, same tree, only PATH varying:
      # cabinet/scripts/tests is 0 failed / 28 skipped on 8.8.0 and 3 failed /
      # 33 skipped on 7.0.15.
      #
      # STILL OPEN, deliberately and separately: the `ci` and `cognitive-phase4`
      # jobs pin `redis:7` SERVICE containers, and framework-tests' own service
      # container is redis:7-alpine. Those serve tests that dial 127.0.0.1:6379
      # rather than spawning a binary — a different mechanism, different jobs,
      # its own blast radius — so they are not bumped here. The parity gap is
      # wider than this one step and is not closed by it.
      - name: Install redis-cli + redis-server 8 + psql client + jq
        # jq (2026-07-28): this job runs `cabinet/scripts/tests`, and the shell
        # surfaces those tests exercise — memory.sh, memory-reconcile.sh, the
        # post-file-write hook, append-interface.sh — all build their JSON
        # payloads with jq and are never deployed without it. Without jq on the
        # runner those code paths take their degraded branch, so the arms
        # pointed at them were measuring an environment production never has:
        # memory-reconcile queued NOTHING (payload construction failed) while
        # logging "some queue pushes failed (redis unreachable?)" — reproduced
        # locally on one machine, same tree, only PATH varying. Same reasoning,
        # same job, as the redis-server/psql notes above: arming a sensor
        # pointed at the wrong environment is not coverage.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client curl gpg lsb-release jq
          curl -fsSL https://packages.redis.io/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          codename="$(lsb_release -cs)"
          printf 'deb [signed-by=%s] %s %s main\n' \
            /usr/share/keyrings/redis-archive-keyring.gpg \
            https://packages.redis.io/deb "${codename}" \
            | sudo tee /etc/apt/sources.list.d/redis.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-tools redis-server
      # Prove the binary is usable AND is the production major, so either a
      # packaging change or a silent downgrade to Ubuntu's 7.x degrades to a
      # loud failure here instead of re-skipping the meter arms or quietly
      # re-measuring 7.x semantics. Floating within major 8 is deliberate: it
      # mirrors production's unpinned brew formula rather than inventing a
      # parity the real deployment does not have.
      - name: Verify redis-server is runnable and matches production major
        run: |
          set -euo pipefail
          command -v redis-server
          redis-server --version
          major="$(redis-server --version | sed -E 's/^.*v=([0-9]+)\..*$/\1/')"
          if [ "${major}" -lt 8 ]; then
            echo "redis-server major ${major} < 8: CI would measure semantics" \
                 "production never runs, and redis-state.sh's ARINFO/ARNEXT" \
                 "array fingerprinting could not execute here at all." >&2
            exit 1
          fi
      # Collection census: the fidelity conftest silently collect_ignores 19
      # flavor-A-coupled modules (288 tests) when the retrodiction lib is
      # absent — true on every CI runner until plan A2.1 vendors it. This
      # line makes the collected-count visible per run so collection drift
      # is measurable, and -rs below names every runtime skip in the counts
      # (2026-07-11 hardening-loop audit: gap verified bit-exact vs local).
      #
      # ARMED 2026-07-29 — until this commit the step COULD NOT FAIL, so it was
      # a disabled sensor wearing a gate's name. GitHub's default step shell is
      # `bash -e {0}` and this file sets no `defaults.run.shell`, so with no
      # `pipefail` the pipeline's exit status is `tail`'s (always 0) and pytest's
      # exit 2 on "Interrupted: N errors during collection" was discarded.
      # Proven by execution both directions, 2026-07-29:
      #   bash -e -c 'python -c "sys.exit(2)" | tail -2'   -> step exit 0
      #   bash -e -c 'set -o pipefail; ... | tail -2'      -> step exit 2
      #   control, no pipe                                 -> rc 2
      # `set -euo pipefail` makes a collection error red HERE, where the step
      # name says what broke, instead of being re-discovered one step later.
      #
      # STILL UNASSERTED, deliberately and named rather than papered over: the
      # collected COUNT. The census prints it so drift is visible, but no floor
      # is pinned, so the 19 flavor-A-coupled modules the fidelity conftest
      # collect_ignores on every runner could grow without any gate objecting.
      # Arming the error path does not close that; see docs/plans/ci-bill-2026-07-29.md.
      - name: Collection census
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m pytest framework/ --collect-only -q | tail -2
      - name: Framework test suite
        # `!cancelled()` (2026-07-29): with the census above now able to fail,
        # an unguarded suite step would be SKIPPED behind it and the run would
        # show one red where there are two. Every other test step in this job
        # already carries the guard.
        if: ${{ !cancelled() }}
        run: python -m pytest framework/ -q -rs
        env:
          REDIS_HOST: localhost

      # Run SEPARATELY from framework/ — cabinet/scripts/tests, like
      # cabinet/scripts/lib/tests, imports as an un-packaged top-level module
      # tree named `tests` (no parent __init__.py), so combining those dirs
      # in one pytest invocation collides (59 collection errors, reproduced
      # 2026-07-16; ledger row R165). This step exists so the ledger-purge
      # criteria-parity pins (test_ledger_purge_testrows.py + test_purge_sqlite_
      # mirror.py — closure wave 2026-07-05) actually gate: without it, drift in
      # either purge script's drop criteria would merge unnoticed.
      - name: Cabinet script tests (purge parity + generate-instance)
        if: ${{ !cancelled() }}
        run: python -m pytest cabinet/scripts/tests -q

      # CI-census close (2026-07-16): the two steps below cover the ONLY
      # pytest directories in the repo that previously ran in no CI step —
      # cabinet/scripts/task_adapters/tests and
      # cabinet/scripts/world-aesthetic/tests. Both are hermetic (stdlib +
      # pytest imports only; no yaml/redis/network) and run as separate
      # invocations so failures stay step-attributable, mirroring the
      # per-dir pattern above. (task_adapters/tests is package-qualified
      # via __init__.py so it does not basename-collide; verified 2026-07-16.)
      - name: Cabinet task-adapter tests
        if: ${{ !cancelled() }}
        # CanonicalTask/TaskAdapter seam pins (test_base.py) + the adapter
        # CONFORMANCE gate (test_conformance.py, adapter kit 2026-07-17):
        # ADAPTER_REGISTRY is auto-discovered, so registering an
        # implemented adapter without a passing conformance fixture — or
        # dropping an unregistered adapter module into task_adapters/ — is
        # a red build BY DESIGN. Calibration anchors run here too: the
        # in-memory reference adapter must pass everything, the _template
        # scaffold must fail everything. All transports are faked
        # in-process (no network, no real gh).
        run: python -m pytest cabinet/scripts/task_adapters/tests -q

      - name: Cabinet world-aesthetic tests
        if: ${{ !cancelled() }}
        # 102 tests for the world-render gate: palette, label overlap, scale
        # lint, judge, PNG codec, edge continuity, clustering, runner,
        # connectivity, entrypoint, corpus reach. The calibration corpus is
        # gitignored, and the fixture MATERIALISES every member this repo can
        # rebuild from its own tracked owned pack before the arms run — so on a
        # fresh checkout expect 99 passed + 3 SKIPPED, not the 91 + 5 it was
        # before 2026-07-30. The 3 remaining skips name the held members (live
        # captures and licensed screenshots no checkout can reconstruct); a
        # corpus present but NOT matching the tracked manifest is a hard
        # failure by id, never a skip.
        run: python -m pytest cabinet/scripts/world-aesthetic/tests -q

      # MOVED to the `world-frame` job 2026-07-30, and NOT because it was
      # failing. This job runs 22.4-24.6 min on master against its own 25-min
      # guard (runs 30569780157 and 30571131626, measured) — it is hugging the
      # boundary for the second time, and the comment on `timeout-minutes`
      # above records what that costs: a CANCELLATION that reads as a red with
      # every step green. Adding ~11s of world-capture arms tipped run
      # 30579135074 over at 25m07. Raising the guard again would treat the
      # symptom; moving ~80s of tests into the job that OWNS this directory
      # (`world-frame`, ~8 min against a 15-min guard) is the fix that also
      # removes a duplication — `world-frame` was already running
      # test_frame_judge.py by itself, so half of this suite ran twice per PR.
      # The tests did not become optional: `world-frame` is a required context
      # on master (verified 2026-07-30 by `gh api .../branches/master/
      # protection`) and now runs the WHOLE directory.

      # Docs-track-code sweep (G6, hardening loop 2026-07-11): dead repo-path
      # refs + dead relative links in LIVING docs fail CI — the repo rule
      # "docs must track the code in the same commit" becomes mechanical.
      # Read-only lint; allowlist + scope documented in the script header.
      # Soaked GREEN locally across the 2026-07-11 hardening cycles first.
      - name: Docs-track-code sweep (dead refs in living docs)
        if: ${{ !cancelled() }}
        run: bash cabinet/scripts/docs-track-code-sweep.sh

      # Ledger status-parity gate (G5, hardening loop 2026-07-11): md-vs-yml
      # status-cell parity + §9 vocabulary + stale-in-flight detection over
      # the operative-egg ledger pair (A13 pins the id SET; this pins what
      # A13 is blind to). Read-only lint.
      - name: Ledger status-parity gate
        if: ${{ !cancelled() }}
        run: bash cabinet/scripts/ledger-status-parity.sh

      # World E1 grammar gate (2026-07-07): Growth doc §2 — "every mapping's
      # source_binding command executes at PR time … out-of-grammar = cannot
      # merge." The binding validator (allowlisted read-only sandbox) must run
      # PRE-merge, not just post-merge, so an out-of-grammar / dead-pixel /
      # sandbox-escaping morphology.yml is CI-red instead of resting on
      # reviewer discipline. The gate ARMS ITSELF on the first grammar merge:
      # while cabinet/world/morphology.yml is absent it prints an explicit SKIP
      # (CABINET_WORLD_REQUIRE_GRAMMAR unset → exit 0); once the file lands,
      # REQUIRE_GRAMMAR=1 makes any binding failure fail the job.
      - name: World binding gate (grammar law, arms on first merge)
        if: ${{ !cancelled() }}
        # CABINET_WORLD_DATA_OPTIONAL=1 (2026-07-09): bindings over RUNTIME
        # artifacts (chronicle jsonl, memory store) can never find data on a
        # fresh runner — grammar is validated, absent data SKIPs loudly. Live
        # boxes don't set it, so a vanished chronicle there stays a hard FAIL.
        run: |
          if [ -f cabinet/world/morphology.yml ]; then
            CABINET_WORLD_REQUIRE_GRAMMAR=1 \
            CABINET_WORLD_DATA_OPTIONAL=1 \
              python cabinet/scripts/world-binding-validator.py \
                cabinet/world/morphology.yml
          else
            echo "WORLD_BINDINGS SKIP — cabinet/world/morphology.yml absent (grammar law not yet merged; gate arms on first merge)"
          fi

  # ── clean-room-foundation + clean-room-source: DELETED 2026-07-29 ──────────
  # COST, not coverage — no assertion in this file was dropped.
  #
  # Both jobs were STRICT SUBSETS of `cabinet/scripts/null-hatch.sh`, which the
  # `null-hatch` job below runs on every event. Proven by reading both texts
  # side by side, not by name:
  #
  #   clean-room-foundation's ONLY work step (`pytest
  #     framework/tests/test_no_launcher_hardcode.py framework/tests/test_clean_room.py -q`)
  #     is null-hatch.sh stage 1/4, character for character.
  #   clean-room-source's four work steps are null-hatch.sh stages 2/4, 3/4 and
  #     4/4: the NullPersonalSource honest-empty assertions, the framework CORE
  #     import slice, and `pytest framework/sources framework/tests -q`.
  #
  # The composed gate is STRONGER on three axes, which is why this direction is
  # safe and the reverse would not have been:
  #   * it runs against the COMMITTED tree (`git archive HEAD`), not the working
  #     copy, so a working-tree-only pass cannot certify it;
  #   * it uses a throwaway $HOME, where clean-room-source ran `rm -rf
  #     "$HOME/.screenpipe"` unsandboxed against the real runner home;
  #   * its CORE import list carries `framework.evolution.contracts`, which the
  #     in-workflow copy did NOT — the hand-copied twin had already drifted
  #     WEAKER than the script, and it was the copy branch protection required.
  #     Deleting it removes a divergent duplicate, not a check.
  #
  # WHAT STILL CATCHES WHAT. A launcher name hardcoded into framework/** → the
  # ratchet in null-hatch stage 1. A captain-identity leak into the fidelity
  # prompt → test_clean_room.py, same stage. A personal-source resolver
  # regression → stage 2. A screenpipe import creeping back into framework CORE
  # → stage 3, under a present-but-UNREADABLE ~/.screenpipe, with one module
  # MORE than before. The framework meta-ratchets → stage 4.
  #
  # THE BILL. Measured over the 30 days to 2026-07-29 (869 runs, 5,836
  # non-skipped job-runs, billable = ceil(per-job seconds/60), which is how
  # GitHub charges): 23,895 billable minutes, of which these two jobs were
  # 1,643 (6.9%) for a combined ~51 seconds of real work per pass. GitHub bills
  # a whole minute per job; rounding alone is 15.1% of this workflow's bill.
  # Rounding is not a check.
  #
  # Branch protection's required-check set was updated in the same change:
  # `clean-room-foundation` and `clean-room-source` retired, `null-hatch`
  # retained. Nothing new was added to the required set — an added context
  # would have blocked every in-flight PR whose workflow could not report it.

  # A15 / P1 (2026-07-07): Proof-1 — the NULL HATCH, the operative-egg plan's
  # first acceptance event (decision D2). ONE named runnable gate composing the
  # two clean-room proofs above (the Testburg render + the SRC-5 null-source
  # job) into a single command: `bash cabinet/scripts/null-hatch.sh` — the egg
  # boots with no captain data, no screenpipe, no instance source binding,
  # adapters absent ⇒ NullPersonalSource honest-empties everywhere. The script
  # is hermetic (sandboxes the COMMITTED tree + a throwaway poisoned $HOME), so
  # the SAME command a captain runs on a laptop is what CI certifies here.
  # Exit 0 = Proof 1 holds.
  #
  # 2026-07-29: the two per-seam sibling jobs were deleted (see the block
  # above), so this is now the SOLE executor of the clean-room seams as well as
  # the composed egg-level gate. Its stages are individually attributable —
  # null-hatch.sh prints `[1/4]`…`[4/4]` with the seam name — so what was
  # per-job signal is now per-stage signal in one log. Treat a red here as a
  # clean-room regression until the stage line says otherwise.
  null-hatch:
    needs: [tree-dedupe]
    # Skipped only on a master push whose tree a PR run already took to
    # green. `!cancelled()` keeps this gate running when tree-dedupe itself
    # fails, and the event clause makes a skipped PR check unreachable.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.tree-dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/cabinet-ci.yml
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: "Proof 1 — null hatch (one gate, clean checkout)"
        run: bash cabinet/scripts/null-hatch.sh

  # 2026-07-27: the COG-4 exit gate, wired into CI because it was NOT.
  #
  # Until this job existed no workflow ran ANY verify-cognitive-phase* twin
  # (`git grep verify-cognitive-phase -- .github/` returned nothing on
  # a55dea44). The gate therefore only fired when a human remembered to run it
  # on a laptop, which is a disabled sensor with extra steps.
  #
  # It cost exactly what that always costs. The captain-availability-dial
  # landing (74374303, PR #210) changed two paths inside the frozen §15 review
  # scope without re-binding the digest, so master went RED on this gate —
  # measured on pristine checkouts: f07787fa GREEN (recorded == recomputed ==
  # 93839d99), then 74374303 / ac56ce78 / a55dea44 all BLOCK at e7fccd9b. CI
  # stayed GREEN across that merge (run 30223319204) and the tip after it
  # (30224450576) because nothing was looking, and two further merges shipped
  # on top of a red exit gate. The BLOCK itself was later discharged by an
  # unrelated wave (966470e0, PR #211) which hit the gate by running it by
  # hand and cleared a block it had not caused — luck, not a control. This job
  # is the control.
  #
  # SCOPE — COG-4 ONLY, deliberately. The phase-0/1/2/3 twins are the
  # digest-frozen HISTORICAL instances their own docstrings describe, and all
  # of them are already BLOCK on master by design (measured 2026-07-27 on
  # pristine bdd413a9: COG-1 25c2f5e3 vs fa5df501, COG-2 b38632b9 vs 3500a97e,
  # COG-3 78a7bf18 vs d00a401d; COG-0's artifact carries no digest line at
  # all, so its binder cannot verify in either direction). Wiring those in
  # would pin CI permanently red and teach everyone to ignore it. COG-4 is the
  # one LIVE binding, so it is the one gated. When a later phase freezes its
  # own review, add its twin here as a sibling step and let the older one go
  # historical.
  #
  # The job runs the twin VERBATIM — no flags, no --skip-compatibility, no
  # subsetting. The whole point is that CI runs the same command a captain
  # runs, so a local green and a CI green cannot disagree.
  cognitive-phase4:
    needs: [tree-dedupe]
    # Skipped only on a master push whose tree a PR run already took to
    # green. `!cancelled()` keeps this gate running when tree-dedupe itself
    # fails, and the event clause makes a skipped PR check unreachable.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.tree-dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # The rollback rehearsal's compatibility arm runs run-golden-evals.sh,
      # which SETs/DELs cabinet:killswitch and so refuses to touch any endpoint
      # not declared disposable. On a laptop it starts its own ephemeral
      # redis-server; the GH runner image has no redis-server binary, so the
      # service container below IS the disposable endpoint (same contract the
      # `ci` job uses).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379
      # Declares the service container throwaway. Never set this against an
      # endpoint that could be a real fleet's Redis.
      CABINET_EVALS_REDIS_DISPOSABLE: "1"
      # The gate binds COMMITTED bytes and aborts on a dirty tree; keep stray
      # bytecode out of the checkout entirely rather than relying on ignores.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # FULL history is REQUIRED, not a nicety: the rollback rehearsal
          # resolves the manifest's pinned baseline_sha (de5d16c4) and
          # done_flip_sha (c58d4a57) with `git cat-file -e` and adds a detached
          # worktree at the latter. A shallow checkout fails there — honestly,
          # but for the wrong reason, which would read as a phase defect.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/cabinet-ci.yml
      - name: Install system deps
        # redis-cli: run-golden-evals.sh drives the endpoint through it.
        # jq: present so any transitively-invoked check that degrades without
        # it runs for real here instead of skipping quietly.
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools jq
      - name: Install Python deps
        # Union of the `ci` and `framework-tests` job sets: the twin composes
        # the cog4 battery, the egg battery, the census/boundary/A13 checks and
        # the rehearsal's framework suites.
        run: pip install pytest pyyaml jsonschema pillow psycopg2-binary requests
      - name: Assert the checkout is byte-clean before the gate
        # The twin aborts on a dirty tree. If setup ever dirties the checkout,
        # fail HERE with that as the stated reason rather than letting it
        # surface as an opaque phase-gate BLOCK.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::checkout dirtied by setup; the phase gate binds committed bytes"
            git status --porcelain
            exit 1
          fi
      - name: Declare the redis service container disposable
        # The golden-eval suite SETs/DELs cabinet:killswitch, so it refuses any
        # endpoint not PROVEN throwaway (2026-07-27). CABINET_EVALS_REDIS_DISPOSABLE=1
        # alone is no longer enough: an env var is a claim about this process's
        # intent and it travels between shells, so the declaration now has to be a
        # property of the SERVER. This step writes it on the service container —
        # which is torn down with the job — and is the only place in the repo that
        # writes that marker. NEVER add a step like this against a real fleet's Redis.
        run: redis-cli -h 127.0.0.1 -p 6379 SET cabinet:evals:disposable 1

      - name: "COG-4 exit gate — verify-cognitive-phase4.sh (committed tree)"
        # WALL-CLOCK DESELECT (2026-07-28). The 06:03Z scheduled run 30333546103
        # red-lined this job on an UNCHANGED commit (8ffeae51, green on its own
        # push run 30314036148) at
        #   framework/authority/tests/test_needs.py:136
        #   assert (466.580227728 - 466.507169034) < 0.05     # i.e. 73ms
        # for an operation that costs ~0.2ms — a ~300x scheduler outlier on a
        # shared runner, not a regression. The reported line 136 is the ANCHOR
        # copy's line number (master's is 171): the test did not run at HEAD, it
        # ran inside cognitive-phase4-rollback-rehearsal.py, whose compatibility
        # battery executes in a worktree detached at the manifest's pinned
        # done_flip_sha c58d4a57. That pinning is CORRECT for a rollback proof,
        # and it is why a fix cannot live in the test: those bytes are frozen.
        #
        # WHY HERE AND NOT IN THE SCRIPT. Both the rehearsal and
        # verify-cognitive-phase4.sh are members of the frozen COG-4 review's
        # EXPECTED_SCOPE, so editing either breaks the reviewed-bytes==tested-
        # bytes digest binding (verified: the gate BLOCKs). Re-freezing that
        # digest to match new bytes would assert a review that never happened.
        # This workflow file is not digest-bound, so it is the one honest lever.
        #
        # NOT A DISABLED SENSOR — the only reason this is acceptable. The
        # framework-tests job runs `pytest framework/ -q -rs` over the LIVE
        # bytes on every push and ran this very test GREEN in this very run;
        # what is dropped is a duplicate execution of frozen bytes. Nor is
        # filing latency a property of the inverse: needs.py is in neither the
        # rollback manifest's remove nor its restore set, so the reverted tree
        # and HEAD run identical filing code. The live copy of the test was made
        # best-of-N in the same PR, and is mutation-proven to still go red on a
        # 60ms sleep and on a quadratic re-read.
        #
        # FAIL-SAFE BY CONSTRUCTION: pytest silently ignores a --deselect id it
        # cannot resolve (verified 2026-07-28), so this is a no-op for every
        # other pytest invocation inside the gate, and if the anchor is ever
        # re-pinned past this test's rename or removal the arm simply runs again
        # and any flake returns LOUDLY. No spelling of this yields a false green.
        env:
          PYTEST_ADDOPTS: "--deselect framework/authority/tests/test_needs.py::test_filing_latency_smoke"
        run: bash cabinet/scripts/verify-cognitive-phase4.sh

      # BASELINE RATCHET (2026-07-28) — the last purchase channel the expansion
      # registry left open, and the reason it lives HERE rather than in the
      # census: cabinet/config/architecture-baseline-sets.yml is a SNAPSHOT, and
      # a line added to it in the same commit as the file it names empties the
      # surplus invisibly (reproduced on master 6ec81460: ok=True, 248/248, no
      # expansion row). The census cannot see it — it is gitless by design so it
      # runs in a clean hatch — so the "before" comparison has to be a git-aware
      # step, and it lives in a job that already carries `fetch-depth: 0` and
      # already installs the census toolchain. Corrected 2026-07-28: the line
      # here used to say this was the ONLY job with full history — `gitleaks`
      # carries `fetch-depth: 0` too. It matters, because `cognitive-phase4` is
      # NOT in branch protection's required-check set (verified 2026-07-28,
      # required = ci, framework-tests, clean-room-foundation, clean-room-source,
      # null-hatch, gitleaks, zizmor), so a breach here reds this run and the
      # master push but does not itself hold the merge button. Treat a red here
      # as blocking by hand until the job is required.
      # The script REFUSES a shallow checkout rather than measuring the wrong
      # base, so moving this step to a shallow job turns it red, not quiet.
      #
      # The base is passed through env rather than interpolated into the script
      # body (zizmor template-injection doctrine). Both event shapes resolve to
      # a real commit; the HEAD^ fallback keeps schedule/dispatch runs honest
      # instead of vacuously green.
      - name: "Architecture baseline ratchet (the snapshot may not net-grow)"
        if: ${{ !cancelled() }}
        env:
          RATCHET_EVENT: ${{ github.event_name }}
          RATCHET_PR_BASE: ${{ github.event.pull_request.base.sha }}
          RATCHET_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${RATCHET_EVENT:-}" in
            pull_request) BASE="${RATCHET_PR_BASE:-}" ;;
            push)         BASE="${RATCHET_PUSH_BEFORE:-}" ;;
            *)            BASE="" ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "architecture baseline ratchet base: $BASE"
          python3.12 cabinet/scripts/baseline-set-ratchet.py --base "$BASE" --check

  # CI-audit 2026-07-09: secret scanning with the EXISTING committed
  # .gitleaks.toml (gitleaks auto-detects it at repo root). Event-native
  # scan depth: push scans the pushed commit range, pull_request scans the
  # PR commits, and the nightly schedule run is the FULL-HISTORY sweep
  # (fetch-depth: 0 makes the history available). Action SHA-pinned per
  # zizmor doctrine. Repo owner is a User account — no GITLEAKS_LICENSE
  # needed (v2 requires one only for Organization repos).
  #
  # ── the `zizmor` job was FOLDED IN HERE, 2026-07-29 ────────────────────────
  # COST, not coverage. Both zizmor invocations still run, once each, in this
  # run, on this tree, with the same flags and the same pinned version — the
  # only thing deleted is a second JOB WRAPPER. Measured over the 30 days to
  # 2026-07-29: `gitleaks` billed 709 minutes for a 10-second median and
  # `zizmor` 709 for an 11-second median, so two jobs cost two whole minutes to
  # do 21 seconds of analysis. GitHub bills a whole minute per job; that
  # rounding is 15.1% of this workflow's entire bill and it is not a check.
  #
  # WHY THIS PAIRING AND NOT ANOTHER. Both are static security gates over
  # committed bytes, both need no services, and this job's `fetch-depth: 0`
  # (which gitleaks requires for its nightly full-history sweep) costs zizmor
  # nothing. Folding them into a test job would have meant burying a secret
  # scan behind a 4-minute proof that could time out ahead of it.
  #
  # WHY THE JOB KEPT THE NAME `gitleaks`. Branch protection required both
  # contexts. Retiring `zizmor` is a REMOVAL, which no in-flight PR can trip
  # over; inventing a new name (`static-gates`) would have added a context that
  # every open PR's older workflow could never report, blocking the whole queue.
  # The name is now narrower than the job — deliberately, and cheaper than a
  # fleet stall.
  #
  # ATTRIBUTION SURVIVES, and that was the condition for doing it: each zizmor
  # step carries `!cancelled()`, so a leak does not hide a workflow finding and
  # a workflow finding does not hide a leak. Step names still say which gate
  # spoke. The secret scan runs FIRST so nothing downstream can pre-empt it.
  gitleaks:
    needs: [tree-dedupe]
    # Skipped only on a master push whose tree a PR run already took to
    # green. `!cancelled()` keeps this gate running when tree-dedupe itself
    # fails, and the event clause makes a skipped PR check unreachable.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.tree-dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks — secret scan (event-native depth; nightly = full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI-audit 2026-07-09: workflow static analysis. BLOCKING only at
      # high severity (zizmor's top tier — the "error" class); the full
      # finding list is a separate advisory step that never fails the job.
      # Dogfood: the pre-existing findings (5 medium artipacked + mutable
      # tag refs) were fixed in the same wave this gate landed (persist-
      # credentials: false everywhere + SHA-pinned actions) — current tree
      # scans clean. Plain output, no SARIF: private repo without GHAS has
      # no code-scanning Security tab to upload to. Offline audits only so
      # the gate is deterministic and needs no token.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
          cache: pip
          # No requirements.txt in this repo — key the pip cache on the
          # workflow file (invalidates exactly when the pinned deps here do).
          cache-dependency-path: .github/workflows/cabinet-ci.yml
      - name: Install zizmor
        if: ${{ !cancelled() }}
        run: pip install zizmor==1.16.3
      - name: zizmor — advisory (all findings, never blocks)
        if: ${{ !cancelled() }}
        run: zizmor --no-online-audits .github/workflows/ || true
      - name: zizmor — gate (high severity blocks)
        if: ${{ !cancelled() }}
        run: zizmor --no-online-audits --min-severity high .github/workflows/

  # ─────────────────────────────────────────────────────────────────────────
  # THE FRAME GATE — the twelve invariants judge a frame no visitor ever sees.
  #
  # `capture.py` (which the `ci` job runs inside the dashboard vitest step)
  # judges a frame raster.py DRAWS from composeLayout's blueprint: no clock, no
  # day bucket, no PIXI stage. So the ambience remap, the weather layer, the
  # killswitch wash and the glow sat outside all twelve checks at every zoom,
  # and a dusk veil replaced 15.6% of every pixel three hours a day with every
  # arm green until a person looked at a picture.
  #
  # A SEPARATE JOB, not a step in `ci`. That job re-budgeted to 25 minutes at
  # ~17m30 of real work and its own header says to re-budget again past ~22m;
  # adding ~4m of browser capture to it would spend that headroom on something
  # that needs none of its services. Here it runs in parallel and owns its own
  # clock. It also needs a browser, which no other job does.
  #
  # NO BROWSER DOWNLOAD. `playwright-core` drives the Chrome the runner image
  # already ships (CHROME_BIN). If that ever disappears the capture FAILS with
  # the paths it tried — it does not skip, because a skipped frame gate is the
  # same blind spot in a nicer coat.
  world-frame:
    needs: [tree-dedupe]
    # Skipped only on a master push whose tree a PR run already took to green,
    # matching every other gate here.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.tree-dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    # MEASURED ON THIS RUNNER, not on a laptop (run 30565939095, with the
    # `surface` arm): 7m21 end to end — 9s npm ci, 2m18 capture of 16 frames,
    # 42s self-arms, 3m55 judge. (Run 30552467292 before that arm: 7m00.)
    # 2026-07-30, with the GROUND pass: 12 more captures (28 total). Locally the
    # capture went 1m00 -> 1m14, so budget ~2m50 here; the `soil` arm itself
    # judges all twelve ground frames in under a second, so the judge step is
    # unchanged. Expect ~8m.
    # 15 leaves better than 2x headroom and still kills a genuinely hung browser
    # rather than letting a cancellation read as a test result. Re-budget if it
    # creeps past ~11m rather than letting a cancellation be read as a red arm.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # 20 -> 22, and it is a DECLARATION rather than an upgrade.
          # `world-capture/resolve-ts.mjs` imports `registerHooks` from
          # `node:module`, which does not exist on 20 — so `test_meadow_feather`
          # and `test_ambience_mirror`, which shell out to `emit.ts` through it,
          # need >= 22. They had been passing in `framework-tests`, which pins NO
          # node at all and was therefore riding whatever ubuntu-latest happened
          # to ship. Moving them here made the requirement visible by failing;
          # it was always there, and the day GitHub changed that image it would
          # have surfaced as a mystery red in a job that never mentions node.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cabinet/dashboard/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/cabinet-ci.yml
      - name: Install Python deps
        # pillow: every arm reads pixels. frame-judge.py FAILS rather than skips
        # without it, on purpose.
        run: pip install pillow pytest

      - name: Install dashboard deps
        run: npm ci --no-audit --no-fund
        working-directory: cabinet/dashboard

      - name: Name the browser
        # LOUD, and before anything depends on it: a capture that silently found
        # no browser would report zero frames judged, and zero frames judged has
        # to look like a failure rather than like a fast green.
        run: |
          set -e
          for c in "$CHROME_BIN" /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -n "$c" ] && [ -x "$c" ]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; echo "using $c"; exit 0; fi
          done
          echo "no Chrome on this runner — the frame gate cannot run and must not pass" >&2
          exit 1

      - name: Capture real composited frames (4 buckets x 3 zooms + killswitch)
        # The hour is an INPUT, never a reading: a capture whose bucket is
        # whatever hour CI happens to start at is a flaky sensor, not a sensor.
        run: node frame-harness/shoot.mjs --out "$RUNNER_TEMP/world-frames" --killswitch 1
        working-directory: cabinet/dashboard

      - name: Judge them (every world-capture arm, moved here 2026-07-30)
        # THE WHOLE DIRECTORY, not just test_frame_judge.py. These arms used to
        # run in `framework-tests`, which is at 22.4-24.6 min against a 25-min
        # guard and cancelled on its boundary when they grew; this job runs ~8
        # min against 15 and it is the one that owns this directory. Same tests,
        # same PR, a required context either way — and test_frame_judge.py is no
        # longer running twice per PR. Covers: ground.py's ramps are the
        # palette's byte for byte, every surface emits only its own ramp, each
        # surface lands in the colour class world_checks.py will read it as, the
        # mirrored checks are identical to their source, NO JUDGE IMPORTS THE
        # THING IT JUDGES (all four of them, discovered rather than listed), and
        # every frame arm red against the defect it names.
        run: python -m pytest cabinet/scripts/world-capture/tests -q
      - name: Frame invariants over the captured sweep
        if: ${{ !cancelled() }}
        run: |
          python3 cabinet/scripts/world-capture/frame-judge.py \
            "$RUNNER_TEMP/world-frames" --json "$RUNNER_TEMP/world-frames/report.json"

      - name: Keep the frames when an arm is red
        # An aesthetic finding is judged by LOOKING. A red arm whose evidence was
        # thrown away costs a whole second run to see.
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: world-frames
          path: ${{ runner.temp }}/world-frames
          retention-days: 7
